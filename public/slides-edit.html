<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="stylesheet" href="/style.css?v=9">
  <style>
    html, body { height: 100%; }
    body.ed-body { display: flex; flex-direction: column; overflow: hidden; }
    .ed-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: .6rem; padding: .5rem .8rem; padding-top: calc(.5rem + env(safe-area-inset-top, 0px)); background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .ed-top .back { font-weight: 800; color: var(--text); text-decoration: none; white-space: nowrap; }
    .ed-top input.title { flex: 1 1 12rem; min-width: 8rem; font-weight: 800; font-size: 1.05rem; padding: .4rem .6rem; margin: 0; }
    .ed-top button, .ed-top a.btn { padding: .45rem .8rem; font-size: .92rem; margin: 0; }
    #state { font-size: .85rem; white-space: nowrap; }
    .ed { flex: 1; min-height: 0; display: grid; grid-template-columns: 178px minmax(0, 1fr) 280px; }
    .ed-slides { overflow-y: auto; padding: .6rem; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: .5rem; }
    .thumb { position: relative; display: flex; gap: .3rem; align-items: flex-start; cursor: pointer; padding: .25rem; border-radius: 10px; border: 2px solid transparent; }
    .thumb.current { border-color: var(--primary); background: var(--card); }
    .thumb.drop-before { box-shadow: 0 -3px 0 var(--primary); }
    .thumb .n { font-size: .75rem; font-weight: 800; color: var(--muted); min-width: 1rem; padding-top: .2rem; }
    .thumb .pic { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff; pointer-events: none; }
    .add-slide { position: relative; }
    .add-slide > button { width: 100%; }
    .layout-menu { position: absolute; left: 0; top: calc(100% + .3rem); z-index: 20; width: 15rem; padding: .4rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: grid; gap: .2rem; }
    .layout-menu button { text-align: left; border: 0; box-shadow: none; background: transparent; padding: .5rem .6rem; font-weight: 700; }
    .layout-menu button:hover { background: var(--bg); }
    .ed-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    .blocks-pop { position: absolute; left: .6rem; top: 3.4rem; z-index: 25; width: min(52rem, calc(100% - 1.2rem)); column-count: 2; column-gap: 1.2rem; max-height: calc(100% - 4.2rem); overflow-y: auto; padding: .9rem; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 16px 50px rgba(30, 30, 80, .3); }
    .blocks-pop .cat { break-inside: avoid; margin-bottom: .6rem; }
    .blocks-pop h3 { margin: .2rem 0 .5rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .blocks-pop h3:first-child { margin-top: 0; }
    .block-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: .5rem; }
    .block-card { display: flex; flex-direction: column; gap: .4rem; align-items: stretch; padding: .5rem; text-align: left; border: 2px solid var(--border); border-radius: 14px; background: var(--card); color: var(--text); cursor: pointer; box-shadow: none; margin: 0; }
    .block-card:hover { border-color: var(--primary); background: var(--bg); }
    .block-card .pv { height: 3.6rem; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #fff; pointer-events: none; }
    .block-card .pv > div { transform-origin: center; }
    .block-card .nm { font-weight: 800; font-size: .88rem; }
    #stagebox td, #stagebox th { cursor: move; }
    .cell-editing { outline: 2px dashed #4f6cf5; outline-offset: -2px; cursor: text !important; -webkit-user-select: text; user-select: text; }
    .ed-tools { display: flex; flex-wrap: wrap; gap: .35rem; padding: .5rem .7rem; background: var(--card); border-bottom: 1px solid var(--border); align-items: center; }
    .ed-tools button { padding: .4rem .7rem; font-size: .9rem; margin: 0; }
    .ed-tools .sep { width: 1px; height: 1.5rem; background: var(--border); margin: 0 .2rem; }
    .ed-stagewrap { flex: 1; min-height: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, #8a90b8 30%); padding: 1rem; overflow: auto; }
    #stagebox { position: relative; box-shadow: 0 10px 40px rgba(20, 20, 60, .25); touch-action: none; user-select: none; -webkit-user-select: none; }
    #stagebox .sl-el { cursor: move; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    .selbox { position: absolute; border: 2px solid #4f6cf5; box-sizing: border-box; pointer-events: none; }
    .handle { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid #4f6cf5; border-radius: 3px; pointer-events: auto; touch-action: none; }
    .guide { position: absolute; background: #ff3b81; pointer-events: none; }
    .editing { outline: 2px dashed #4f6cf5; cursor: text !important; }
    .editing .sl-text { -webkit-user-select: text; user-select: text; }
    .ed-props { overflow-y: auto; padding: .8rem; background: var(--card); border-left: 1px solid var(--border); }
    .ed-props h3 { margin: 1rem 0 .4rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .ed-props h3:first-child { margin-top: 0; }
    .ed-props label { font-size: .82rem; margin: .5rem 0 .2rem; }
    .ed-props input[type="number"], .ed-props select, .ed-props textarea { margin: 0; padding: .4rem .5rem; font-size: .92rem; }
    .ed-props input[type="color"] { padding: 0; width: 2.4rem; height: 2.1rem; border-radius: 8px; border: 1px solid var(--border); background: none; cursor: pointer; margin: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; }
    .row-inline { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; box-shadow: none; padding: .35rem .6rem; min-width: 2.2rem; background: var(--card); margin: 0; }
    .seg button[aria-pressed="true"] { background: var(--primary-grad); color: #fff; }
    .ed-props .mini { padding: .3rem .55rem; font-size: .82rem; margin: 0; }
    .swatches { display: flex; flex-wrap: wrap; gap: .35rem; }
    .swatch { width: 2.1rem; height: 1.4rem; border-radius: 6px; border: 1px solid var(--border); padding: 0; box-shadow: none; cursor: pointer; margin: 0; }
    .colorbtn { width: 2.6rem; height: 2.1rem; padding: 0; border: 2px solid var(--border); border-radius: 9px; cursor: pointer; margin: 0; box-shadow: none; flex: none; position: relative; overflow: hidden; }
    .colorbtn.none::after { content: ''; position: absolute; left: -10%; top: 50%; width: 120%; height: 2px; background: #e11d48; transform: rotate(-35deg); }
    .bgbtn { width: 4.4rem; height: 2.6rem; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; padding: 0; box-shadow: none; margin: 0; }
    .pop { position: fixed; z-index: 70; width: 19.5rem; max-width: calc(100vw - 16px); max-height: min(80vh, 36rem); overflow-y: auto; padding: .8rem; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 50px rgba(30, 30, 80, .32); }
    .pop h4 { margin: .7rem 0 .35rem; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .pop h4:first-child { margin-top: 0; }
    .pop .sw { width: 1.75rem; height: 1.75rem; border-radius: 8px; border: 1px solid rgba(120, 120, 150, .45); padding: 0; cursor: pointer; box-shadow: none; margin: 0; }
    .pop .sw.on { outline: 3px solid var(--primary); outline-offset: 1px; }
    .pop .sw.wide { width: 2.6rem; }
    .pop .sw-row { display: flex; flex-wrap: wrap; gap: .35rem; }
    .pop.editing .sw.custom { outline: 2px dashed #e11d48; outline-offset: 1px; position: relative; }
    .pop input[type="color"] { width: 2.4rem; height: 2rem; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; margin: 0; }
    .pop input[type="text"], .pop input[type="number"], .pop select { margin: 0; padding: .35rem .5rem; font-size: .9rem; }
    .pop .tabs { display: flex; gap: .3rem; margin-bottom: .7rem; }
    .pop .tabs button { flex: 1; padding: .4rem .3rem; font-size: .88rem; margin: 0; }
    .pop .tabs button[aria-pressed="true"] { background: var(--primary-grad); color: #fff; border-color: transparent; }
    .pop .gprev { height: 3.2rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: .6rem; }
    .pop .imgprev { height: 5rem; border-radius: 12px; border: 1px solid var(--border); background: #e9ecfa center / cover no-repeat; margin-bottom: .5rem; }
    .pop label { font-size: .8rem; margin: .45rem 0 .15rem; display: block; }
    .pop .mini { padding: .3rem .55rem; font-size: .82rem; margin: 0; }
    .ask-backdrop { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 1rem; background: rgba(14, 16, 36, .6); }
    .ask { width: min(26rem, 100%); margin: 0; }
    .ask-prev { height: 6.5rem; border-radius: 14px; border: 1px solid var(--border); margin: .4rem 0 .8rem; }
    .drop-hint { outline: 3px dashed var(--primary); outline-offset: -6px; }
    @media (max-width: 700px) { .blocks-pop { column-count: 1; } }
    @media (max-width: 1000px) {
      body.ed-body { overflow: auto; height: auto; }
      .ed { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .ed-slides { flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--border); order: 2; }
      .ed-main { order: 1; min-height: 70vh; }
      .ed-props { order: 3; border-left: 0; border-top: 1px solid var(--border); }
      .thumb { flex: none; }
    }
  </style>
</head>
<body class="ed-body">
  <div class="ed-top">
    <a class="back" href="/slides">← Folien</a>
    <input class="title" id="title" maxlength="120" aria-label="Titel der Präsentation" placeholder="Titel der Präsentation">
    <span class="muted" id="state" aria-live="polite"></span>
    <button type="button" id="pdf" title="Präsentation als PDF herunterladen">⬇ PDF</button>
    <button type="button" class="primary" id="present">▶ Präsentieren</button>
  </div>
  <div class="ed">
    <aside class="ed-slides" id="slides" aria-label="Folien"></aside>
    <section class="ed-main">
      <div class="ed-tools" id="tools">
        <button type="button" class="primary" id="blocks-btn" aria-expanded="false" aria-controls="blocks">▦ Blöcke</button>
        <span class="sep"></span>
        <button type="button" data-add="text">🔤 Text</button>
        <button type="button" data-add="rect">▭ Rechteck</button>
        <button type="button" data-add="ellipse">◯ Kreis</button>
        <button type="button" data-add="triangle">△ Dreieck</button>
        <button type="button" data-add="image">🖼️ Bild</button>
        <span class="sep"></span>
        <button type="button" id="undo" title="Rückgängig (Strg+Z)">↶</button>
        <button type="button" id="redo" title="Wiederholen (Strg+Y)">↷</button>
      </div>
      <div class="blocks-pop" id="blocks" hidden></div>
      <div class="ed-stagewrap" id="stagewrap">
        <div id="stagebox"><div id="stagehost"></div><div id="overlay"></div></div>
      </div>
    </section>
    <aside class="ed-props" id="props" aria-label="Eigenschaften"></aside>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="file" id="bgfile" accept="image/*" hidden>
  <div class="pop" id="pop" hidden></div>
  <div class="ask-backdrop" id="ask" hidden>
    <div class="ask card" role="dialog" aria-modal="true" aria-labelledby="ask-title">
      <h2 id="ask-title">Hintergrund für alle Folien übernehmen?</h2>
      <div class="ask-prev" id="ask-prev"></div>
      <p class="muted" style="margin:.2rem 0 1rem">Du hast den Hintergrund dieser Folie geändert. Soll er bei allen <span id="ask-n"></span> Folien gelten?</p>
      <div class="row-inline"><button type="button" class="primary" id="ask-all">Für alle Folien</button><button type="button" id="ask-one">Nur diese Folie</button></div>
    </div>
  </div>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/slides-render.js"></script>
  <script src="/js/slides-pdf.js"></script>
  <script>
    const W = SlideRender.W;
    const H = SlideRender.H;
    const id = new URLSearchParams(location.search).get('id');
    let deck = null;        // { id, title, data, rev }
    let cur = 0;            // aktuelle Folie
    let selId = null;       // markiertes Element
    let zoom = 1;
    let editing = null;     // Element-ID im Textmodus
    const hist = [];
    const future = [];
    let histKey = null;
    let histAt = 0;

    const uid = (p = 'e') => p + Math.random().toString(36).slice(2, 8);
    const slide = () => deck.data.slides[cur];
    const elOf = (eid) => slide().elements.find((e) => e.id === eid);
    const sel = () => (selId ? elOf(selId) : null);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const isTextual = (e) => e && (e.type === 'text' || e.type === 'shape');

    // ---------------- Speichern ----------------
    let saveTimer = null;
    let saving = false;
    let pending = false;
    let conflict = false;
    function setState(text, cls) { const s = $('#state'); s.textContent = text; s.style.color = cls === 'warn' ? 'var(--danger)' : cls === 'ok' ? 'var(--ok)' : ''; }
    function dirty() {
      pending = true;
      if (conflict) return;
      setState('Ungespeichert …');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 900);
    }
    async function save() {
      clearTimeout(saveTimer);
      if (saving || !pending || conflict) return;
      saving = true;
      pending = false;
      try {
        const r = await api(`/api/slides/${id}`, { method: 'PUT', body: { title: deck.title, data: deck.data, rev: deck.rev } });
        deck.rev = r.rev;
        setState(pending ? 'Ungespeichert …' : '✓ Gespeichert', pending ? '' : 'ok');
      } catch (err) {
        pending = true;
        if (/woanders/.test(err.message)) { conflict = true; setState('Woanders geändert – bitte neu laden', 'warn'); } else setState(`Nicht gespeichert: ${err.message}`, 'warn');
      } finally {
        saving = false;
        if (pending && !conflict) saveTimer = setTimeout(save, 1500);
      }
    }
    addEventListener('beforeunload', (e) => { if (pending || saving) { e.preventDefault(); e.returnValue = ''; } });

    // ---------------- Verlauf (Rückgängig) ----------------
    const snap = () => JSON.stringify({ d: deck.data, cur });
    function pushHist(key) {
      const now = Date.now();
      if (key && key === histKey && now - histAt < 1200) { histAt = now; return; }   // viele kleine Änderungen derselben Art = ein Schritt
      histKey = key || null; histAt = now;
      hist.push(snap());
      if (hist.length > 100) hist.shift();
      future.length = 0;
      updateHistButtons();
    }
    function restore(s) {
      const o = JSON.parse(s);
      deck.data = o.d;
      cur = Math.min(o.cur, deck.data.slides.length - 1);
      if (!elOf(selId)) selId = null;
      endEdit(true);
      renderAll();
      dirty();
    }
    function undo() { if (!hist.length) return; future.push(snap()); restore(hist.pop()); histKey = null; updateHistButtons(); }
    function redo() { if (!future.length) return; hist.push(snap()); restore(future.pop()); histKey = null; updateHistButtons(); }
    function updateHistButtons() { $('#undo').disabled = !hist.length; $('#redo').disabled = !future.length; }

    // ---------------- Folienleiste ----------------
    function renderSlides() {
      const box = $('#slides');
      box.innerHTML = '';
      deck.data.slides.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = `thumb${i === cur ? ' current' : ''}`;
        t.draggable = true;
        t.dataset.i = i;
        t.innerHTML = `<span class="n">${i + 1}</span><div class="pic"></div>`;
        box.appendChild(t);
        SlideRender.mount(t.querySelector('.pic'), s, 130);
      });
      const add = document.createElement('div');
      add.className = 'add-slide';
      add.innerHTML = `<button type="button" id="add-slide">＋ Folie</button>
        <div class="layout-menu" id="layout-menu" hidden>
          <button type="button" data-layout="titleContent">Titel &amp; Inhalt</button>
          <button type="button" data-layout="title">Titelfolie</button>
          <button type="button" data-layout="two">Zwei Spalten</button>
          <button type="button" data-layout="titleOnly">Nur Titel</button>
          <button type="button" data-layout="blank">Leer</button>
        </div>`;
      box.appendChild(add);
    }
    function refreshThumb(i = cur) {
      const t = $('#slides').querySelector(`.thumb[data-i="${i}"] .pic`);
      if (t) SlideRender.mount(t, deck.data.slides[i], 130);
    }

    // Layouts für neue Folien (Farben „auto“ passen sich dem Hintergrund an)
    function layoutElements(name) {
      const T = (x, y, w, h, text, o = {}) => ({ type: 'text', id: uid(), x, y, w, h, text, size: 32, color: 'auto', font: 'sans', align: 'left', valign: 'top', list: 'none', opacity: 1, fill: 'none', ...o });
      if (name === 'title') return [T(140, 240, 1000, 130, 'Titel', { size: 72, bold: true, align: 'center', valign: 'middle' }), T(240, 390, 800, 70, 'Untertitel', { align: 'center', color: '#667085' })];
      if (name === 'titleContent') return [T(80, 50, 1120, 100, 'Titel', { size: 52, bold: true, valign: 'middle' }), T(80, 180, 1120, 480, 'Erster Punkt\nZweiter Punkt\nDritter Punkt', { size: 36, list: 'bullet' })];
      if (name === 'two') return [T(80, 50, 1120, 100, 'Titel', { size: 52, bold: true, valign: 'middle' }), T(80, 180, 540, 480, 'Linke Spalte', { size: 32, list: 'bullet' }), T(660, 180, 540, 480, 'Rechte Spalte', { size: 32, list: 'bullet' })];
      if (name === 'titleOnly') return [T(80, 50, 1120, 100, 'Titel', { size: 52, bold: true, valign: 'middle' })];
      return [];
    }
    function addSlide(layout) {
      pushHist();
      const prev = slide();
      const s = { id: uid('s'), bg: JSON.parse(JSON.stringify(prev.bg)), notes: '', transition: prev.transition || 'fade', elements: layoutElements(layout) };
      deck.data.slides.splice(cur + 1, 0, s);
      cur += 1; selId = null;
      renderAll(); dirty();
    }
    function moveSlide(from, to) {
      if (from === to || to < 0 || to > deck.data.slides.length) return;
      pushHist();
      const [s] = deck.data.slides.splice(from, 1);
      const at = to > from ? to - 1 : to;
      deck.data.slides.splice(at, 0, s);
      cur = at;
      renderAll(); dirty();
    }
    function duplicateSlide() {
      pushHist();
      const copy = JSON.parse(JSON.stringify(slide()));
      copy.id = uid('s'); copy.elements.forEach((e) => { e.id = uid(); });
      deck.data.slides.splice(cur + 1, 0, copy);
      cur += 1; selId = null;
      renderAll(); dirty();
    }
    function deleteSlide() {
      if (deck.data.slides.length < 2) return;
      pushHist();
      deck.data.slides.splice(cur, 1);
      cur = Math.min(cur, deck.data.slides.length - 1); selId = null;
      renderAll(); dirty();
    }

    // ---------------- Bühne ----------------
    function layoutStage() {
      const wrap = $('#stagewrap');
      const aw = wrap.clientWidth - 32;
      const ah = wrap.clientHeight - 32;
      zoom = clamp(Math.min(aw / W, ah / H), 0.15, 2);
      if (!(zoom > 0)) zoom = 0.5;
      $('#stagebox').style.width = `${W * zoom}px`;
      $('#stagebox').style.height = `${H * zoom}px`;
    }
    function renderStage() {
      layoutStage();
      SlideRender.mount($('#stagehost'), slide(), W * zoom);
      renderOverlay();
    }
    function renderOverlay() {
      const ov = $('#overlay');
      ov.innerHTML = '';
      const e = sel();
      if (!e) return;
      const box = document.createElement('div');
      box.className = 'selbox';
      Object.assign(box.style, { left: `${e.x * zoom}px`, top: `${e.y * zoom}px`, width: `${e.w * zoom}px`, height: `${e.h * zoom}px` });
      ov.appendChild(box);
      if (editing) return;
      [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5], ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]].forEach(([k, fx, fy]) => {
        const h = document.createElement('div');
        h.className = 'handle';
        h.dataset.h = k;
        h.style.left = `${(e.x + e.w * fx) * zoom}px`;
        h.style.top = `${(e.y + e.h * fy) * zoom}px`;
        h.style.cursor = `${k}-resize`;
        ov.appendChild(h);
      });
    }
    function drawGuides(gx, gy) {
      document.querySelectorAll('.guide').forEach((g) => g.remove());
      const ov = $('#overlay');
      gx.forEach((x) => { const g = document.createElement('div'); g.className = 'guide'; Object.assign(g.style, { left: `${x * zoom}px`, top: 0, width: '1px', height: '100%' }); ov.appendChild(g); });
      gy.forEach((y) => { const g = document.createElement('div'); g.className = 'guide'; Object.assign(g.style, { top: `${y * zoom}px`, left: 0, height: '1px', width: '100%' }); ov.appendChild(g); });
    }
    function renderAll() { renderSlides(); renderStage(); renderProps(); updateHistButtons(); }
    function afterChange({ props = false, thumb = true } = {}) {
      if (editing) { if (thumb) refreshThumb(); dirty(); return; }   // beim Tippen nicht die Bühne neu aufbauen
      renderStage();

    // ---------------- Bausteine (Blöcke) ----------------
    const T0 = { size: 32, color: 'auto', font: 'sans', align: 'left', valign: 'top', list: 'none', bold: false, italic: false, underline: false };
    const accent = () => (SlideRender.isDark(slide()) ? '#7c9cff' : '#4f6cf5');
    const BLOCKS = [
      { cat: 'Überschriften', name: 'Überschrift 1', make: () => ({ type: 'text', w: 1100, h: 110, text: 'Große Überschrift', fill: 'none', ...T0, size: 72, bold: true, valign: 'middle' }) },
      { cat: 'Überschriften', name: 'Überschrift 2', make: () => ({ type: 'text', w: 1000, h: 80, text: 'Mittlere Überschrift', fill: 'none', ...T0, size: 48, bold: true, valign: 'middle' }) },
      { cat: 'Überschriften', name: 'Überschrift 3', make: () => ({ type: 'text', w: 900, h: 60, text: 'Kleine Überschrift', fill: 'none', ...T0, size: 34, bold: true, valign: 'middle' }) },
      { cat: 'Text', name: 'Textabsatz', make: () => ({ type: 'text', w: 900, h: 220, text: 'Hier steht dein Text. Doppeltippe, um ihn zu ändern, und schreibe ein bis zwei klare Sätze zum Thema.', fill: 'none', ...T0, size: 30 }) },
      { cat: 'Text', name: 'Zitat', make: () => ({ type: 'text', w: 900, h: 180, text: '„Ein kurzes, einprägsames Zitat.“', fill: 'none', ...T0, size: 40, italic: true, align: 'center', valign: 'middle' }) },
      { cat: 'Listen', name: 'Aufzählung', make: () => ({ type: 'text', w: 900, h: 280, text: 'Erster Punkt\nZweiter Punkt\nDritter Punkt', fill: 'none', ...T0, size: 34, list: 'bullet' }) },
      { cat: 'Listen', name: 'Nummerierte Liste', make: () => ({ type: 'text', w: 900, h: 280, text: 'Erster Schritt\nZweiter Schritt\nDritter Schritt', fill: 'none', ...T0, size: 34, list: 'number' }) },
      { cat: 'Buttons', name: 'Button (gefüllt)', make: () => ({ type: 'shape', kind: 'rect', w: 320, h: 84, fill: accent(), stroke: 'none', strokeWidth: 0, radius: 42, text: 'Weiter', ...T0, color: '#ffffff', size: 32, bold: true, align: 'center', valign: 'middle', goto: 0 }) },
      { cat: 'Buttons', name: 'Button (Umriss)', make: () => ({ type: 'shape', kind: 'rect', w: 320, h: 84, fill: 'none', stroke: accent(), strokeWidth: 4, radius: 42, text: 'Mehr erfahren', ...T0, color: 'auto', size: 30, bold: true, align: 'center', valign: 'middle', goto: 0 }) },
      { cat: 'Bilder', name: 'Bildplatzhalter 16:9', make: () => ({ type: 'placeholder', w: 640, h: 360, label: 'Bild einfügen', radius: 16 }) },
      { cat: 'Bilder', name: 'Bildplatzhalter quadratisch', make: () => ({ type: 'placeholder', w: 400, h: 400, label: 'Bild einfügen', radius: 16 }) },
      { cat: 'Tabellen', name: 'Tabelle 3 × 3', make: () => ({ type: 'table', w: 900, h: 270, rows: [['Spalte 1', 'Spalte 2', 'Spalte 3'], ['', '', ''], ['', '', '']], header: true, zebra: false, size: 28, color: 'auto', align: 'left', font: 'sans', headFill: accent(), headColor: '#ffffff', border: '#cbd2ee' }) },
      { cat: 'Tabellen', name: 'Vergleich 2 × 4', make: () => ({ type: 'table', w: 900, h: 360, rows: [['Vorteile', 'Nachteile'], ['', ''], ['', ''], ['', '']], header: true, zebra: true, size: 28, color: 'auto', align: 'left', font: 'sans', headFill: accent(), headColor: '#ffffff', border: '#cbd2ee' }) },
    ];
    function renderBlocks() {
      const box = $('#blocks');
      const cats = [...new Set(BLOCKS.map((b) => b.cat))];
      box.innerHTML = cats.map((c) => `<div class="cat"><h3>${c}</h3><div class="block-grid">${BLOCKS.map((b, i) => (b.cat === c ? `<button type="button" class="block-card" data-block="${i}"><div class="pv"></div><span class="nm">${b.name}</span></button>` : '')).join('')}</div></div>`).join('');
      // Vorschau: das echte Element, verkleinert
      box.querySelectorAll('.block-card').forEach((card) => {
        const e = BLOCKS[Number(card.dataset.block)].make();
        Object.assign(e, { id: 'pv', x: 0, y: 0, opacity: 1 });
        const dom = SlideRender.elementEl(e, { bg: '#ffffff', elements: [] });
        dom.style.position = 'relative'; dom.style.left = '0'; dom.style.top = '0';
        const k = Math.min(120 / e.w, 52 / e.h);
        const wrap = document.createElement('div');
        wrap.style.cssText = `width:${e.w}px;height:${e.h}px;transform:scale(${k});margin:${-(e.h - e.h * k) / 2}px ${-(e.w - e.w * k) / 2}px;`;
        wrap.appendChild(dom);
        card.querySelector('.pv').appendChild(wrap);
      });
    }
    function toggleBlocks(open) {
      const box = $('#blocks');
      const show = open === undefined ? box.hidden : open;
      if (show && !box.children.length) renderBlocks();
      box.hidden = !show;
      $('#blocks-btn').setAttribute('aria-expanded', String(show));
    }
    function insertBlock(i) {
      const e = BLOCKS[i].make();
      e.x = Math.round((W - e.w) / 2);
      e.y = Math.round((H - e.h) / 2);
      while (slide().elements.some((o) => o.x === e.x && o.y === e.y)) { e.x += 24; e.y += 24; }   // nicht exakt auf ein vorhandenes Element legen
      addElement(e);
      toggleBlocks(false);
    }
    $('#blocks-btn').onclick = (ev) => { ev.stopPropagation(); toggleBlocks(); };
    $('#blocks').addEventListener('click', (ev) => { const c = ev.target.closest('[data-block]'); if (c) insertBlock(Number(c.dataset.block)); });
    document.addEventListener('click', (ev) => { if (!$('#blocks').hidden && !ev.target.closest('#blocks, #blocks-btn')) toggleBlocks(false); });

    // ---------------- Elemente einfügen ----------------
    function addElement(e, { edit = false } = {}) {
      pushHist();
      e.id = uid();
      e.opacity = 1;
      slide().elements.push(e);
      selId = e.id;
      afterChange({ props: true });
      if (edit) setTimeout(() => startEdit(e.id), 30);
    }
    const textDefaults = { size: 32, color: 'auto', font: 'sans', align: 'left', valign: 'top', list: 'none', bold: false, italic: false, underline: false };
    function addKind(kind) {
      if (kind === 'text') addElement({ type: 'text', x: 340, y: 300, w: 600, h: 90, text: 'Text', fill: 'none', ...textDefaults, size: 40 }, { edit: true });
      else if (kind === 'image') $('#file').click();
      else {
        const dark = SlideRender.isDark(slide());
        addElement({ type: 'shape', kind, x: 440, y: 230, w: 400, h: 260, fill: dark ? '#7c9cff' : '#4f6cf5', stroke: 'none', strokeWidth: 0, radius: kind === 'rect' ? 24 : 0, text: '', ...textDefaults, color: '#ffffff', align: 'center', valign: 'middle', size: 36 });
      }
    }

    // Bild verkleinern (längste Seite maxSide px) und hochladen → { url, w, h }
    async function uploadAsset(file, maxSide = 1600) {
      const bmp = await createImageBitmap(file).catch(() => null);
      let blob = file;
      let w; let h;
      if (bmp) {
        const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
        w = Math.round(bmp.width * k); h = Math.round(bmp.height * k);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(bmp, 0, 0, w, h);
        const keepPng = /png|gif|webp/.test(file.type);
        blob = await new Promise((r) => c.toBlob(r, keepPng ? 'image/png' : 'image/jpeg', 0.88));
        if (keepPng && blob.size > 1400000) blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
        if (blob.size > 1450000) blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.7));
      } else { w = 800; h = 450; }
      const res = await fetch(`/api/slides/${id}/assets`, { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Hochladen fehlgeschlagen');
      return { url: body.url, w, h };
    }
    async function uploadImage(file, placeholderId) {
      if (!file || !/^image\//.test(file.type)) return;
      setState('Bild wird hochgeladen …');
      try {
        const { url, w, h } = await uploadAsset(file);
        const ph = placeholderId && elOf(placeholderId);
        if (ph && ph.type === 'placeholder') {   // Platzhalter durch das Bild ersetzen (gleiche Position und Größe, zugeschnitten)
          pushHist();
          Object.assign(ph, { type: 'image', src: url, fit: 'cover', radius: ph.radius || 0 });
          delete ph.label;
          selId = ph.id;
          afterChange({ props: true });
        } else {
          const k = Math.min(1, 900 / w, 520 / h);
          const iw = Math.round(w * k); const ih = Math.round(h * k);
          addElement({ type: 'image', x: Math.round((W - iw) / 2), y: Math.round((H - ih) / 2), w: iw, h: ih, src: url, fit: 'contain', radius: 0 });
        }
        setState('');
      } catch (err) { setState(err.message, 'warn'); }
    }
    let fillTarget = null;      // Platzhalter, der mit dem nächsten Bild gefüllt wird
    const selectedPlaceholder = () => { const e = sel(); return e && e.type === 'placeholder' ? e.id : null; };
    $('#file').onchange = (e) => { uploadImage(e.target.files[0], fillTarget || selectedPlaceholder()); fillTarget = null; e.target.value = ''; };
    addEventListener('paste', (e) => {
      if (editing || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      const f = [...(e.clipboardData?.files || [])].find((x) => /^image\//.test(x.type));
      if (f) { e.preventDefault(); uploadImage(f, selectedPlaceholder()); }
    });
    const stageWrap = $('#stagewrap');
    stageWrap.addEventListener('dragover', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); stageWrap.classList.add('drop-hint'); } });
    stageWrap.addEventListener('dragleave', () => stageWrap.classList.remove('drop-hint'));
    stageWrap.addEventListener('drop', (e) => { stageWrap.classList.remove('drop-hint'); const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); const t = document.elementsFromPoint(e.clientX, e.clientY).find((n) => n.classList && n.classList.contains('sl-placeholder')); uploadImage(f, t ? t.dataset.id : selectedPlaceholder()); } });

    // ---------------- Text bearbeiten ----------------
    let editEl = null;       // das gerade bearbeitete DOM-Element (Textbox oder Tabellenzelle)
    function beginEditable(box, eid, onText) {
      pushHist();
      try { box.contentEditable = 'plaintext-only'; } catch { /* ältere Browser */ }
      if (box.contentEditable !== 'plaintext-only') box.contentEditable = 'true';
      editing = eid;
      editEl = box;
      box.focus();
      const range = document.createRange();
      range.selectNodeContents(box);
      range.collapse(false);
      const sel2 = getSelection(); sel2.removeAllRanges(); sel2.addRange(range);
      box.oninput = () => { onText(box.innerText.replace(/\u200b/g, '').replace(/\n$/, '')); refreshThumb(); dirty(); };
      box.onblur = () => endEdit();
    }
    function startEdit(eid) {
      const e = elOf(eid);
      if (e && e.type === 'placeholder') { fillTarget = eid; $('#file').click(); return; }
      if (e && e.type === 'table') return startCellEdit(eid, 0, 0);
      if (!isTextual(e)) return;
      endEdit();
      selId = eid;
      const dom = $('#stagehost').querySelector(`[data-id="${eid}"]`);
      const box = dom && dom.querySelector('.sl-text');
      if (!box) return;
      box.textContent = e.text === '\u200b' ? '' : e.text;
      box.style.whiteSpace = 'pre-wrap';
      box.style.overflow = 'auto';
      dom.classList.add('editing');
      beginEditable(box, eid, (t) => { e.text = t; });
      box.onkeydown = (ev) => {
        if (ev.key === 'Escape') { ev.preventDefault(); box.blur(); }
        const mod = ev.metaKey || ev.ctrlKey;
        if (mod && ['b', 'i', 'u'].includes(ev.key.toLowerCase())) { ev.preventDefault(); toggleProp({ b: 'bold', i: 'italic', u: 'underline' }[ev.key.toLowerCase()], true); }
        ev.stopPropagation();
      };
      renderOverlay();
    }
    // Tabellenzelle bearbeiten; Tab springt zur nächsten Zelle
    function startCellEdit(eid, r, c) {
      const e = elOf(eid);
      if (!e || e.type !== 'table') return;
      endEdit();
      selId = eid;
      r = clamp(r, 0, e.rows.length - 1); c = clamp(c, 0, e.rows[0].length - 1);
      const td = $('#stagehost').querySelector(`[data-id="${eid}"] [data-r="${r}"][data-c="${c}"]`);
      if (!td) return;
      td.classList.add('cell-editing');
      beginEditable(td, eid, (t) => { e.rows[r][c] = t; });
      td.onkeydown = (ev) => {
        if (ev.key === 'Escape') { ev.preventDefault(); td.blur(); }
        else if (ev.key === 'Tab') {
          ev.preventDefault();
          const cols = e.rows[0].length;
          let i = r * cols + c + (ev.shiftKey ? -1 : 1);
          if (i >= e.rows.length * cols) { addTableRow(e); }
          i = clamp(i, 0, e.rows.length * cols - 1);
          const nr = Math.floor(i / cols); const nc = i % cols;
          const keep = editing; editEl.onblur = null;
          endEdit(true);
          renderStage();
          startCellEdit(keep, nr, nc);
        }
        ev.stopPropagation();
      };
      renderOverlay();
    }
    function endEdit(silent) {
      if (!editing) return;
      const dom = editEl;
      editing = null;
      editEl = null;
      if (dom) { dom.onblur = null; dom.oninput = null; dom.onkeydown = null; }
      if (!silent) { renderStage(); refreshThumb(); renderProps(); }
    }

    // ---------------- Zeigen / Ziehen / Skalieren ----------------
    let drag = null;
    let lastDown = null;
    const host = $('#stagebox');
    function pt(ev) { const r = host.getBoundingClientRect(); return { x: (ev.clientX - r.left) / zoom, y: (ev.clientY - r.top) / zoom }; }

    host.addEventListener('pointerdown', (ev) => {
      if (editing && ev.target.closest('.editing, .cell-editing')) return;
      const handle = ev.target.closest('.handle');
      lastDown = null;
      if (handle) {
        const e = sel();
        drag = { mode: 'resize', h: handle.dataset.h, start: pt(ev), orig: { x: e.x, y: e.y, w: e.w, h: e.h }, moved: false };
        host.setPointerCapture(ev.pointerId);
        ev.preventDefault();
        return;
      }
      const dom = ev.target.closest('.sl-el');
      if (editing) endEdit();
      if (!dom) { selId = null; renderOverlay(); renderProps(); return; }
      const e = elOf(dom.dataset.id);
      if (!e) return;
      if (selId !== e.id) { selId = e.id; renderProps(); }
      renderOverlay();
      drag = { mode: 'move', start: pt(ev), orig: { x: e.x, y: e.y }, moved: false };
      lastDown = drag; lastDown.id = e.id;
      const cell = ev.target.closest('td, th');
      lastDown.cell = cell ? [Number(cell.dataset.r), Number(cell.dataset.c)] : null;
      host.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });

    // Einrasten an Folienrändern, -mitte und anderen Elementen
    function snapMove(e, nx, ny) {
      const T = 6 / zoom;
      const xs = [0, W / 2, W];
      const ys = [0, H / 2, H];
      slide().elements.forEach((o) => { if (o.id !== e.id) { xs.push(o.x, o.x + o.w / 2, o.x + o.w); ys.push(o.y, o.y + o.h / 2, o.y + o.h); } });
      const gx = []; const gy = [];
      let bestX = T + 1; let bestY = T + 1; let ax = nx; let ay = ny;
      [0, e.w / 2, e.w].forEach((off) => xs.forEach((c) => { const d = c - (nx + off); if (Math.abs(d) < Math.abs(bestX) && Math.abs(d) <= T) { bestX = d; ax = nx + d; } }));
      [0, e.h / 2, e.h].forEach((off) => ys.forEach((c) => { const d = c - (ny + off); if (Math.abs(d) < Math.abs(bestY) && Math.abs(d) <= T) { bestY = d; ay = ny + d; } }));
      if (bestX <= T) [0, e.w / 2, e.w].forEach((off) => { if (xs.some((c) => Math.abs(c - (ax + off)) < 0.5)) gx.push(ax + off); });
      if (bestY <= T) [0, e.h / 2, e.h].forEach((off) => { if (ys.some((c) => Math.abs(c - (ay + off)) < 0.5)) gy.push(ay + off); });
      return { x: ax, y: ay, gx, gy };
    }

    host.addEventListener('pointermove', (ev) => {
      if (!drag) return;
      const e = sel();
      if (!e) return;
      const p = pt(ev);
      const dx = p.x - drag.start.x;
      const dy = p.y - drag.start.y;
      if (!drag.moved) { if (Math.abs(dx) + Math.abs(dy) < 3 / zoom) return; drag.moved = true; pushHist(); }
      if (drag.mode === 'move') {
        let nx = drag.orig.x + dx; let ny = drag.orig.y + dy;
        if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) ny = drag.orig.y; else nx = drag.orig.x; }
        const s = ev.altKey ? { x: nx, y: ny, gx: [], gy: [] } : snapMove(e, nx, ny);
        e.x = Math.round(s.x); e.y = Math.round(s.y);
        applyLive(e);
        drawGuides(s.gx, s.gy);
      } else {
        const o = drag.orig;
        let { x, y, w, h } = o;
        const k = drag.h;
        if (k.includes('e')) w = o.w + dx;
        if (k.includes('s')) h = o.h + dy;
        if (k.includes('w')) { w = o.w - dx; x = o.x + dx; }
        if (k.includes('n')) { h = o.h - dy; y = o.y + dy; }
        const keep = e.type === 'image' ? !ev.shiftKey : ev.shiftKey;
        if (keep && k.length === 2) {
          const ratio = o.w / o.h;
          if (Math.abs(w - o.w) / o.w > Math.abs(h - o.h) / o.h) h = w / ratio; else w = h * ratio;
          if (k.includes('w')) x = o.x + o.w - w;
          if (k.includes('n')) y = o.y + o.h - h;
        }
        if (w < 20) { if (k.includes('w')) x -= 20 - w; w = 20; }
        if (h < 20) { if (k.includes('n')) y -= 20 - h; h = 20; }
        Object.assign(e, { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
        applyLive(e);
      }
    });
    function applyLive(e) {
      // schnell: nur das Element neu zeichnen statt der ganzen Folie
      const dom = $('#stagehost').querySelector(`[data-id="${e.id}"]`);
      if (dom) { const fresh = SlideRender.elementEl(e, slide()); dom.replaceWith(fresh); }
      renderOverlay();
      syncProps();
    }
    const endDrag = () => {
      if (!drag) return;
      const moved = drag.moved;
      drag = null;
      document.querySelectorAll('.guide').forEach((g) => g.remove());
      if (moved) { refreshThumb(); dirty(); }
    };
    host.addEventListener('pointerup', endDrag);
    host.addEventListener('pointercancel', endDrag);
    // Doppeltippen/Doppelklick startet die Texteingabe (selbst erkannt: dblclick ist mit Pointer-Capture und auf iPads unzuverlässig)
    let lastTap = { id: null, t: 0 };
    host.addEventListener('pointerup', (ev) => {
      if (!lastDown || lastDown.moved) { lastTap = { id: null, t: 0 }; return; }
      const now = Date.now();
      if (lastTap.id === lastDown.id && now - lastTap.t < 450) {
        lastTap = { id: null, t: 0 };
        if (lastDown.cell) startCellEdit(lastDown.id, lastDown.cell[0], lastDown.cell[1]); else startEdit(lastDown.id);
        return;
      }
      lastTap = { id: lastDown.id, t: now };
    });

    // ---------------- Eigenschaften ----------------
    const BASE_COLORS = ['#ffffff', '#f3f4f8', '#d0d5e8', '#8a90b8', '#3d4266', '#14172e', '#000000', '#e11d48', '#f97316', '#facc15', '#16a34a', '#0ea5e9', '#4f6cf5', '#7c4dff', '#d946ef', '#14b8a6'];
    const GRADIENTS = [
      { from: '#4f6cf5', to: '#7c4dff', angle: 135 }, { from: '#1fd1c3', to: '#4f8cff', angle: 135 },
      { from: '#f97316', to: '#e11d48', angle: 135 }, { from: '#14172e', to: '#3b2a7a', angle: 160 },
      { from: '#fde68a', to: '#fb7185', angle: 135 }, { from: '#0f172a', to: '#334155', angle: 180 },
    ];
    const seg = (name, items, value) => `<div class="seg" role="group">${items.map(([v, label, title]) => `<button type="button" data-set="${name}" data-value="${v}" aria-pressed="${value === v}" title="${title || ''}">${label}</button>`).join('')}</div>`;
    const colorBg = (c) => (c === 'none' ? 'transparent' : SlideRender.resolve(c, slide(), '#000000'));
    const colorCls = (c) => (c === 'none' ? 'none' : '');
    const colorHex = (c, e) => { const v = SlideRender.resolve(c, slide(), '#000000'); return /^#[0-9a-f]{6}$/i.test(v) ? v : '#000000'; };
    const num = (name, v, extra = '') => `<input type="number" data-num="${name}" value="${Math.round(v)}" ${extra}>`;

    function renderProps() {
      if (editing) return;
      const box = $('#props');
      const e = sel();
      if (!e) {
        const s = slide();
        const bg = s.bg;
        box.innerHTML = `
          <h3>Folie ${cur + 1} von ${deck.data.slides.length}</h3>
          <label>Hintergrund</label>
          <div class="row-inline"><button type="button" class="bgbtn" id="bg-open" style="background:${SlideRender.bgCss(s)}" aria-label="Hintergrund ändern" title="Hintergrund ändern"></button>
            <button type="button" class="mini" id="bg-open2">Ändern …</button></div>
          <div class="row-inline" style="margin-top:.5rem"><button type="button" class="mini" data-bg-all ${deck.data.slides.length < 2 ? 'disabled' : ''}>Auf alle Folien</button></div>
          <label for="trans">Übergang zur Folie</label>
          <select id="trans" data-slide-prop="transition"><option value="fade">Überblenden</option><option value="slide">Schieben</option><option value="none">Keiner</option></select>
          <label for="notes">Notizen (nur für dich, im Präsentationsmodus mit N)</label>
          <textarea id="notes" rows="5" data-slide-prop="notes" placeholder="Was willst du zu dieser Folie sagen?"></textarea>
          <h3>Folie</h3>
          <div class="row-inline">
            <button type="button" class="mini" data-slide-op="up" ${cur === 0 ? 'disabled' : ''}>↑ Nach oben</button>
            <button type="button" class="mini" data-slide-op="down" ${cur === deck.data.slides.length - 1 ? 'disabled' : ''}>↓ Nach unten</button>
            <button type="button" class="mini" data-slide-op="dup">Duplizieren</button>
            <button type="button" class="mini danger" data-slide-op="del" ${deck.data.slides.length < 2 ? 'disabled' : ''}>Löschen</button>
          </div>`;
        $('#trans').value = s.transition || 'fade';
        $('#notes').value = s.notes || '';

          <label>Rahmen</label>
          <div class="row-inline"><button type="button" class="colorbtn ${colorCls(e.stroke)}" data-pick="stroke" data-auto="" data-none="1" style="background:${colorBg(e.stroke)}" aria-label="Rahmenfarbe"></button>${num('strokeWidth', e.strokeWidth || 0, 'min="0" max="40" aria-label="Rahmenstärke" style="width:4.5rem"')}<button type="button" class="mini" data-color-none="stroke">Keiner</button></div>
          ${e.kind === 'rect' ? `<label for="p-radius">Rundung</label><input id="p-radius" type="range" min="0" max="200" value="${e.radius || 0}" data-range="radius">` : ''}`;
      }
      if (e.type === 'text') {
        html += `<label>Hintergrund des Felds</label><div class="row-inline"><button type="button" class="colorbtn ${colorCls(e.fill)}" data-pick="fill" data-auto="" data-none="1" style="background:${colorBg(e.fill)}" aria-label="Hintergrundfarbe des Felds"></button><button type="button" class="mini" data-color-none="fill">Keiner</button></div>`;
      }
      if (e.type === 'image') {
        html += `<label for="p-fit">Anpassung</label><select id="p-fit" data-set-select="fit"><option value="contain">Ganz zeigen</option><option value="cover">Füllen (zuschneiden)</option></select>
          <label for="p-rad">Rundung</label><input id="p-rad" type="range" min="0" max="200" value="${e.radius || 0}" data-range="radius">`;
      }
      if (e.type === 'placeholder') {
        html += `<button type="button" class="primary mini" data-op="fill" style="width:100%">🖼️ Bild hochladen</button>
          <p class="muted" style="font-size:.8rem;margin:.3rem 0 0">Oder ein Bild per Drag &amp; Drop auf die Folie ziehen bzw. einfügen (Strg+V). Platzhalter sieht man nur im Editor.</p>
          <label for="p-label">Beschriftung</label><input id="p-label" type="text" maxlength="60" data-str="label" value="${escapeHtml(e.label || '')}">
          <label for="p-prad">Rundung</label><input id="p-prad" type="range" min="0" max="200" value="${e.radius || 0}" data-range="radius">`;
      }
      if (e.type === 'table') {
        html += `
          <p class="muted" style="font-size:.8rem;margin:0 0 .4rem">Doppeltippe auf eine Zelle, um sie zu bearbeiten (Tab springt weiter).</p>
          <div class="row-inline"><button type="button" class="mini" data-table-op="addRow">＋ Zeile</button><button type="button" class="mini" data-table-op="delRow" ${e.rows.length < 2 ? 'disabled' : ''}>－ Zeile</button>
            <button type="button" class="mini" data-table-op="addCol">＋ Spalte</button><button type="button" class="mini" data-table-op="delCol" ${e.rows[0].length < 2 ? 'disabled' : ''}>－ Spalte</button></div>
          <div class="row-inline" style="margin-top:.5rem"><div class="seg"><button type="button" data-toggle="header" aria-pressed="${e.header !== false}">Kopfzeile</button><button type="button" data-toggle="zebra" aria-pressed="${!!e.zebra}">Streifen</button></div></div>
          <label for="p-tsize">Schrift</label>
          <div class="grid2"><select id="p-tfont" data-set-select="font"><option value="sans">Modern</option><option value="serif">Serif</option><option value="display">Display</option><option value="mono">Mono</option></select>${num('size', e.size, 'min="8" max="120" aria-label="Schriftgröße" id="p-tsize"')}</div>
          <div style="margin-top:.5rem">${seg('align', [['left', '⯇', 'Linksbündig'], ['center', '≡', 'Zentriert'], ['right', '⯈', 'Rechtsbündig']], e.align)}</div>
          <label>Textfarbe</label><div class="row-inline"><button type="button" class="colorbtn ${colorCls(e.color)}" data-pick="color" data-auto="1" data-none="" style="background:${colorBg(e.color)}" aria-label="Textfarbe"></button><button type="button" class="mini" data-color-auto="color" aria-pressed="${e.color === 'auto'}">Automatisch</button></div>

            <div><label>Kopf: Schrift</label><button type="button" class="colorbtn ${colorCls(e.headColor)}" data-pick="headColor" data-auto="" data-none="" style="background:${colorBg(e.headColor)}" aria-label="Kopfzeile Schrift"></button></div></div>
          <label>Rahmenfarbe</label><div class="row-inline"><button type="button" class="colorbtn ${colorCls(e.border)}" data-pick="border" data-auto="" data-none="" style="background:${colorBg(e.border)}" aria-label="Rahmenfarbe"></button></div>`;
      }

          <input id="p-goto" type="number" min="0" max="${deck.data.slides.length}" data-num="goto" value="${e.goto || 0}" placeholder="0 = nichts">`;
      }
      html += `<label for="p-op">Deckkraft</label><input id="p-op" type="range" min="0.1" max="1" step="0.05" value="${e.opacity ?? 1}" data-range="opacity">
        <h3>Position &amp; Größe</h3>
        <div class="grid2"><div><label>X</label>${num('x', e.x, 'aria-label="X"')}</div><div><label>Y</label>${num('y', e.y, 'aria-label="Y"')}</div>
          <div><label>Breite</label>${num('w', e.w, 'min="20" aria-label="Breite"')}</div><div><label>Höhe</label>${num('h', e.h, 'min="20" aria-label="Höhe"')}</div></div>
        <h3>Anordnen</h3>
        <div class="row-inline"><button type="button" class="mini" data-arrange="front">Ganz nach vorn</button><button type="button" class="mini" data-arrange="forward">Vor</button><button type="button" class="mini" data-arrange="backward">Zurück</button><button type="button" class="mini" data-arrange="back">Ganz hinten</button></div>
        <div class="row-inline" style="margin-top:.5rem"><button type="button" class="mini" data-align="left">⇤</button><button type="button" class="mini" data-align="hcenter">↔ Mitte</button><button type="button" class="mini" data-align="right">⇥</button><button type="button" class="mini" data-align="top">⤒</button><button type="button" class="mini" data-align="vcenter">↕ Mitte</button><button type="button" class="mini" data-align="bottom">⤓</button></div>
        <div class="row-inline" style="margin-top:.8rem"><button type="button" class="mini" data-op="dup">Duplizieren</button><button type="button" class="mini danger" data-op="del">Löschen</button></div>`;
      box.innerHTML = html;
      box.querySelectorAll('[data-set-select]').forEach((s) => { s.value = e[s.dataset.setSelect] ?? s.value; });
    }
    // Nur Zahlenfelder nachziehen (z. B. beim Ziehen), ohne das Panel neu zu bauen
    function syncProps() {
      const e = sel();
      if (!e) return;
      document.querySelectorAll('#props [data-num]').forEach((i) => { if (document.activeElement !== i && e[i.dataset.num] !== undefined) i.value = Math.round(e[i.dataset.num]); });
    }

    function setProp(name, value, key) {
      const e = sel();
      if (!e) return;
      pushHist(key || `p:${name}`);
      e[name] = value;
      afterChange({ props: ['kind', 'align', 'valign', 'list', 'font'].includes(name) });
    }
    function toggleProp(name) { const e = sel(); if (e) setProp(name, !e[name], null); if (editing) { /* Stil im Text sofort sichtbar */ const dom = $('#stagehost').querySelector(`[data-id="${selId}"] .sl-text`); if (dom) { const f = SlideRender.elementEl(sel(), slide()).querySelector('.sl-text'); Object.assign(dom.style, { fontWeight: f.style.fontWeight, fontStyle: f.style.fontStyle, textDecoration: f.style.textDecoration }); } } }

    const props = $('#props');
    props.addEventListener('input', (ev) => {
      const t = ev.target;
      const e = sel();
      if (t.dataset.num && e) { const v = Number(t.value); if (Number.isFinite(v)) setProp(t.dataset.num, ['w', 'h'].includes(t.dataset.num) ? Math.max(20, v) : v); }
      else if (t.dataset.range && e) setProp(t.dataset.range, Number(t.value));
      else if (t.dataset.str && e) setProp(t.dataset.str, t.value);
      else if (t.dataset.slideProp) { pushHist(`s:${t.dataset.slideProp}`); slide()[t.dataset.slideProp] = t.value; if (t.dataset.slideProp === 'notes') dirty(); else afterChange(); }
    });
    props.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t.dataset.setSelect) setProp(t.dataset.setSelect, t.value);
      else if (t.dataset.slideProp === 'transition') { pushHist(); slide().transition = t.value; dirty(); }
    });
    props.addEventListener('click', (ev) => {
      const t = ev.target.closest('button');
      if (!t) return;
      const e = sel();
      const d = t.dataset;
      if (d.toggle) toggleProp(d.toggle);
      else if (d.set) setProp(d.set, d.value);
      else if (d.colorAuto) setProp(d.colorAuto, 'auto');
      else if (d.colorNone) setProp(d.colorNone, 'none');
      else if (t.id === 'bg-open' || t.id === 'bg-open2') openBgPop(t);
      else if (d.pick && e) openColorPop(t, d.pick);
      else if (d.bgAll !== undefined) { pushHist(); deck.data.slides.forEach((s) => { s.bg = JSON.parse(JSON.stringify(slide().bg)); }); renderAll(); dirty(); }
      else if (d.slideOp === 'up') moveSlide(cur, cur - 1);
      else if (d.slideOp === 'down') moveSlide(cur, cur + 2);
      else if (d.slideOp === 'dup') duplicateSlide();
      else if (d.slideOp === 'del' && confirm('Diese Folie löschen?')) deleteSlide();
      else if (d.arrange && e) arrange(d.arrange);
      else if (d.align && e) alignTo(d.align);
      else if (d.tableOp && e && e.type === 'table') tableOp(d.tableOp);
      else if (d.op === 'fill') { fillTarget = selId; $('#file').click(); }
      else if (d.op === 'dup') duplicateElement();
      else if (d.op === 'del') deleteElement();
    });

    function addTableRow(e) { const rh = e.h / e.rows.length; e.rows.push(Array(e.rows[0].length).fill('')); e.h = Math.round(rh * e.rows.length); }
    function tableOp(op) {
      const e = sel();
      pushHist();
      const rh = e.h / e.rows.length; const cw = e.w / e.rows[0].length;
      if (op === 'addRow') addTableRow(e);
      if (op === 'delRow' && e.rows.length > 1) { e.rows.pop(); e.h = Math.max(20, Math.round(rh * e.rows.length)); }
      if (op === 'addCol') { e.rows.forEach((r) => r.push('')); e.w = Math.min(W - e.x, Math.round(cw * e.rows[0].length)); }
      if (op === 'delCol' && e.rows[0].length > 1) { e.rows.forEach((r) => r.pop()); e.w = Math.max(20, Math.round(cw * e.rows[0].length)); }
      afterChange({ props: true });
    }
    function arrange(how) {
      const list = slide().elements;
      const i = list.findIndex((x) => x.id === selId);
      if (i < 0) return;
      pushHist();
      const [e] = list.splice(i, 1);
      const to = { front: list.length, back: 0, forward: Math.min(list.length, i + 1), backward: Math.max(0, i - 1) }[how];
      list.splice(to, 0, e);
      afterChange({ props: false });
    }
    function alignTo(how) {
      const e = sel();
      pushHist();
      if (how === 'left') e.x = 0;
      if (how === 'right') e.x = W - e.w;
      if (how === 'hcenter') e.x = Math.round((W - e.w) / 2);
      if (how === 'top') e.y = 0;
      if (how === 'bottom') e.y = H - e.h;
      if (how === 'vcenter') e.y = Math.round((H - e.h) / 2);
      afterChange();
    }
    function duplicateElement() {
      const e = sel();
      if (!e) return;
      pushHist();
      const c = JSON.parse(JSON.stringify(e));
      c.id = uid(); c.x += 24; c.y += 24;
      slide().elements.push(c);
      selId = c.id;
      afterChange({ props: true });
    }
    function deleteElement() {
      if (!selId) return;
      pushHist();
      slide().elements = slide().elements.filter((x) => x.id !== selId);
      selId = null;
      afterChange({ props: true });
    }

    // ---------------- Farbwahl und Hintergrund (Popover) ----------------
    const pop = $('#pop');
    let popState = null;      // { kind: 'color' | 'bg', anchor, ... }
    const HEX6 = /^#[0-9a-f]{6}$/i;
    const palette = () => { if (!deck.data.palette) deck.data.palette = []; return deck.data.palette; };
    const gradientsList = () => { if (!deck.data.gradients) deck.data.gradients = []; return deck.data.gradients; };
    function addCustomColor(c) {
      c = String(c).toLowerCase();
      if (!HEX6.test(c) || BASE_COLORS.includes(c) || palette().includes(c)) return;
      palette().unshift(c);
      if (palette().length > 24) palette().length = 24;
      dirty();
    }
    function placePop(anchor) {
      const r = anchor.getBoundingClientRect();
      pop.hidden = false;
      const pw = pop.offsetWidth; const ph = pop.offsetHeight;
      let left = clamp(r.left, 8, innerWidth - pw - 8);
      let top = r.bottom + 6;
      if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 6);
      pop.style.left = `${left}px`; pop.style.top = `${top}px`;
    }
    function closePop() {
      if (!popState) return;
      const st = popState;
      popState = null;
      pop.hidden = true;
      pop.classList.remove('editing');
      if (st.kind === 'bg' && JSON.stringify(slide().bg) !== st.before && deck.data.slides.length > 1) askAll();
    }
    const swatch = (c, cur, extra = '') => `<button type="button" class="sw ${extra} ${c.toLowerCase() === String(cur).toLowerCase() ? 'on' : ''}" data-sw="${c}" style="background:${c}" aria-label="${c}"></button>`;
    function colorsHtml(cur) {
      const custom = palette();
      return `<h4>Farben</h4><div class="sw-row">${BASE_COLORS.map((c) => swatch(c, cur)).join('')}</div>
        <h4>Eigene Farben ${custom.length ? '<button type="button" class="mini" data-edit-custom style="float:right;padding:.1rem .45rem">✎</button>' : ''}</h4>
        <div class="sw-row">${custom.map((c) => swatch(c, cur, 'custom')).join('')}
          <label class="sw" style="display:grid;place-items:center;font-weight:900;cursor:pointer;background:var(--bg)" title="Eigene Farbe wählen">＋<input type="color" data-native style="position:absolute;opacity:0;width:0;height:0" value="${HEX6.test(cur) ? cur : '#4f6cf5'}"></label></div>
        <div class="row-inline" style="margin-top:.5rem"><input type="text" data-hex placeholder="#rrggbb" maxlength="7" style="width:6.5rem" aria-label="Hex-Farbe"><button type="button" class="mini" data-hex-ok>Übernehmen</button></div>`;
    }
    // Farbe eines Elements (Text-, Füll-, Rahmenfarbe …)
    function openColorPop(anchor, prop) {
      if (popState) closePop();
      const e = sel();
      const apply = (v, key) => { setProp(prop, v, key || `pick:${prop}`); anchor.style.background = colorBg(v); anchor.classList.toggle('none', v === 'none'); };
      popState = { kind: 'color', anchor, apply, prop };
      const cur = SlideRender.resolve(e[prop], slide(), '#000000');
      pop.innerHTML = `${colorsHtml(cur)}<div class="row-inline" style="margin-top:.6rem">${anchor.dataset.auto ? '<button type="button" class="mini" data-sw="auto">Automatisch</button>' : ''}${anchor.dataset.none ? '<button type="button" class="mini" data-sw="none">Keine</button>' : ''}<button type="button" class="mini" data-pop-close style="margin-left:auto">Fertig</button></div>`;
      placePop(anchor);
    }
    // Hintergrund der Folie: Farbe, Verlauf oder Bild
    let gState = { from: '#4f6cf5', to: '#7c4dff', angle: 135 };
    function applyBg(bg, key) { pushHist(key || 'bg'); slide().bg = bg; afterChange({ props: true }); }
    function bgType(bg) { return typeof bg === 'string' ? 'color' : bg.image ? 'image' : 'gradient'; }
    function openBgPop(anchor) {
      if (popState) closePop();
      const bg = slide().bg;
      if (bgType(bg) === 'gradient') gState = { ...bg };
      popState = { kind: 'bg', anchor, tab: bgType(bg), before: JSON.stringify(bg) };
      renderBgPop();
      placePop(anchor);
    }
    function renderBgPop() {
      const bg = slide().bg;
      const tab = popState.tab;
      const tabs = `<div class="tabs" role="tablist">${[['color', 'Farbe'], ['gradient', 'Verlauf'], ['image', 'Bild']].map(([k, l]) => `<button type="button" data-bg-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>`;
      let body = '';
      if (tab === 'color') body = colorsHtml(typeof bg === 'string' ? bg : '');
      if (tab === 'gradient') {
        const g = bgType(bg) === 'gradient' ? bg : gState;
        const custom = gradientsList();
        const gsw = (x, extra = '') => `<button type="button" class="sw wide ${extra}" data-grad='${JSON.stringify(x)}' style="background:linear-gradient(${x.angle}deg,${x.from},${x.to})" aria-label="Farbverlauf"></button>`;
        body = `<div class="gprev" id="gprev" style="background:linear-gradient(${g.angle}deg,${g.from},${g.to})"></div>
          <div class="row-inline"><div><label>Von</label><input type="color" data-g="from" value="${g.from}"></div><button type="button" class="mini" data-g-swap title="Farben tauschen" style="align-self:flex-end">⇄</button><div><label>Nach</label><input type="color" data-g="to" value="${g.to}"></div></div>
          <label>Richtung: <span id="gang">${Math.round(g.angle)}</span>°</label><input type="range" min="0" max="360" value="${g.angle}" data-g="angle" style="width:100%">
          <div class="row-inline" style="margin-top:.5rem"><button type="button" class="mini" data-g-apply>Verlauf verwenden</button><button type="button" class="mini" data-g-save>＋ Als eigenen speichern</button></div>
          <h4>Vorlagen</h4><div class="sw-row">${GRADIENTS.map((x) => gsw(x)).join('')}</div>
          <h4>Eigene Verläufe ${custom.length ? '<button type="button" class="mini" data-edit-custom style="float:right;padding:.1rem .45rem">✎</button>' : ''}</h4>
          <div class="sw-row">${custom.map((x) => gsw(x, 'custom')).join('') || '<span class="muted" style="font-size:.82rem">Noch keine – speichere oben einen.</span>'}</div>`;
      }
      if (tab === 'image') {
        if (bgType(bg) === 'image') {
          body = `<div class="imgprev" style="background-image:url('${bg.image}');background-size:${bg.fit === 'contain' ? 'contain' : 'cover'}"></div>
            <div class="row-inline"><button type="button" class="mini" data-bg-pick>Anderes Bild …</button><button type="button" class="mini danger" data-bg-remove>Bild entfernen</button></div>
            <label>Anpassung</label><select data-bgimg="fit"><option value="cover">Füllen (zuschneiden)</option><option value="contain">Ganz zeigen</option></select>
            <label>Heller ◂ ▸ Dunkler (für lesbaren Text)</label><input type="range" min="-80" max="80" value="${Math.round((bg.overlay || 0) * 100)}" data-bgimg="overlay" style="width:100%">
            <label>Farbe hinter dem Bild</label><input type="color" data-bgimg="color" value="${HEX6.test(bg.color) ? bg.color : '#ffffff'}">`;
        } else body = '<p class="muted" style="margin:.2rem 0 .6rem">Ein Foto oder eine Grafik als Hintergrund der Folie.</p><button type="button" class="primary" data-bg-pick style="width:100%">🖼️ Bild auswählen</button>';
      }
      pop.innerHTML = `${tabs}${body}<div class="row-inline" style="margin-top:.7rem"><button type="button" class="mini" data-pop-close style="margin-left:auto">Fertig</button></div>`;
      const fit = pop.querySelector('[data-bgimg="fit"]'); if (fit) fit.value = bg.fit || 'cover';
    }
    const gradApply = (key) => applyBg({ from: gState.from, to: gState.to, angle: gState.angle }, key);
    function hexPick(v) { v = String(v).trim(); if (!v.startsWith('#')) v = `#${v}`; return HEX6.test(v) ? v.toLowerCase() : null; }

    pop.addEventListener('click', (ev) => {
      const t = ev.target.closest('button');
      if (!t || !popState) return;
      const d = t.dataset;
      if (d.popClose !== undefined) return closePop();
      if (d.editCustom !== undefined) { pop.classList.toggle('editing'); return; }
      if (d.sw !== undefined) {
        const c = d.sw;
        if (pop.classList.contains('editing') && t.classList.contains('custom')) { palette().splice(palette().indexOf(c), 1); dirty(); return popState.kind === 'bg' ? renderBgPop() : openColorPop(popState.anchor, popState.prop); }
        if (popState.kind === 'color') { popState.apply(c); return; }
        applyBg(c, null); popState.tab = 'color'; return renderBgPop();
      }
      if (d.bgTab) { popState.tab = d.bgTab; return renderBgPop(); }
      if (d.grad) {
        const g = JSON.parse(d.grad);
        if (pop.classList.contains('editing') && t.classList.contains('custom')) { const i = gradientsList().findIndex((x) => x.from === g.from && x.to === g.to && Math.round(x.angle) === Math.round(g.angle)); if (i >= 0) gradientsList().splice(i, 1); dirty(); return renderBgPop(); }
        gState = { ...g }; applyBg({ ...g }); return renderBgPop();
      }
      if (d.gSwap !== undefined) { gState = { from: gState.to, to: gState.from, angle: gState.angle }; gradApply('bg'); return renderBgPop(); }
      if (d.gApply !== undefined) { gradApply(); return renderBgPop(); }
      if (d.gSave !== undefined) {
        const g = { from: gState.from.toLowerCase(), to: gState.to.toLowerCase(), angle: Math.round(gState.angle) };
        if (!gradientsList().some((x) => x.from === g.from && x.to === g.to && Math.round(x.angle) === g.angle)) { gradientsList().unshift(g); if (gradientsList().length > 12) gradientsList().length = 12; dirty(); }
        return renderBgPop();
      }
      if (d.hexOk !== undefined) { const v = hexPick(pop.querySelector('[data-hex]').value); if (v) { addCustomColor(v); if (popState.kind === 'color') { popState.apply(v); openColorPop(popState.anchor, popState.prop); } else { applyBg(v); renderBgPop(); } } return; }
      if (d.bgPick !== undefined) return $('#bgfile').click();
      if (d.bgRemove !== undefined) { applyBg(slide().bg.color || '#ffffff'); popState.tab = 'color'; return renderBgPop(); }
    });
    pop.addEventListener('input', (ev) => {
      const t = ev.target;
      if (!popState) return;
      if (t.dataset.native !== undefined) { if (popState.kind === 'color') popState.apply(t.value); else applyBg(t.value, 'bgnative'); }
      else if (t.dataset.g) {
        gState[t.dataset.g] = t.dataset.g === 'angle' ? Number(t.value) : t.value;
        const prev = $('#gprev'); if (prev) prev.style.background = `linear-gradient(${gState.angle}deg,${gState.from},${gState.to})`;
        if (t.dataset.g === 'angle') $('#gang').textContent = Math.round(gState.angle);
        gradApply('bggrad');
      } else if (t.dataset.bgimg) {
        const bg = { ...slide().bg };
        bg[t.dataset.bgimg] = t.dataset.bgimg === 'overlay' ? Number(t.value) / 100 : t.value;
        applyBg(bg, 'bgimg');
      }
    });
    pop.addEventListener('change', (ev) => {
      const t = ev.target;
      if (!popState) return;
      if (t.dataset.native !== undefined) { addCustomColor(t.value); if (popState.kind === 'color') openColorPop(popState.anchor, popState.prop); else { popState.tab = 'color'; renderBgPop(); } }
      else if (t.dataset.hex !== undefined) { const v = hexPick(t.value); if (v) pop.querySelector('[data-hex-ok]').click(); }
      else if (t.dataset.bgimg === 'fit') { applyBg({ ...slide().bg, fit: t.value }, 'bgimg'); renderBgPop(); }
    });
    $('#bgfile').onchange = async (ev) => {
      const f = ev.target.files[0];
      ev.target.value = '';
      if (!f || !popState || popState.kind !== 'bg') return;
      setState('Bild wird hochgeladen …');
      try {
        const { url } = await uploadAsset(f, 1920);
        const old = typeof slide().bg === 'object' && slide().bg.image ? slide().bg : null;
        applyBg({ image: url, fit: old ? old.fit : 'cover', overlay: old ? old.overlay : 0, color: old ? old.color : '#ffffff' });
        popState.tab = 'image'; renderBgPop();
        setState('');
      } catch (err) { setState(err.message, 'warn'); }
    };
    document.addEventListener('pointerdown', (ev) => { if (popState && !pop.hidden && !ev.target.closest('#pop, .colorbtn, .bgbtn, #bg-open2')) closePop(); });
    addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && popState) closePop(); }, true);
    addEventListener('resize', () => { if (popState) closePop(); });

    // Rückfrage: Hintergrund für alle Folien übernehmen?
    function askAll() {
      $('#ask-prev').style.background = SlideRender.bgCss(slide());
      $('#ask-n').textContent = deck.data.slides.length;
      $('#ask').hidden = false;
      $('#ask-all').focus();
    }
    $('#ask-all').onclick = () => {
      pushHist();
      const bg = slide().bg;
      deck.data.slides.forEach((x) => { x.bg = JSON.parse(JSON.stringify(bg)); });
      $('#ask').hidden = true;
      renderAll(); dirty();
    };
    $('#ask-one').onclick = () => { $('#ask').hidden = true; };
    $('#ask').addEventListener('click', (ev) => { if (ev.target === $('#ask')) $('#ask').hidden = true; });

    // ---------------- Folienleiste: Klicks, Ziehen ----------------
    $('#slides').addEventListener('click', (ev) => {
      const add = ev.target.closest('#add-slide');
      if (add) { const m = $('#layout-menu'); m.hidden = !m.hidden; return; }
      const lay = ev.target.closest('[data-layout]');
      if (lay) { addSlide(lay.dataset.layout); return; }
      const t = ev.target.closest('.thumb');
      if (t) { endEdit(); cur = Number(t.dataset.i); selId = null; renderAll(); }
    });
    document.addEventListener('click', (ev) => { const m = $('#layout-menu'); if (m && !m.hidden && !ev.target.closest('.add-slide')) m.hidden = true; });
    let dragFrom = null;
    $('#slides').addEventListener('dragstart', (ev) => { const t = ev.target.closest('.thumb'); if (!t) return; dragFrom = Number(t.dataset.i); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(dragFrom)); });
    $('#slides').addEventListener('dragover', (ev) => {
      if (dragFrom === null) return;
      ev.preventDefault();
      document.querySelectorAll('.thumb.drop-before').forEach((x) => x.classList.remove('drop-before'));
      const t = ev.target.closest('.thumb');
      if (t) t.classList.add('drop-before');
    });
    $('#slides').addEventListener('drop', (ev) => {
      if (dragFrom === null) return;
      ev.preventDefault();
      const t = ev.target.closest('.thumb');
      const to = t ? Number(t.dataset.i) : deck.data.slides.length;
      const from = dragFrom;
      dragFrom = null;
      moveSlide(from, to);
    });
    $('#slides').addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.thumb.drop-before').forEach((x) => x.classList.remove('drop-before')); });

    // ---------------- Werkzeugleiste, Tastatur ----------------
    $('#tools').addEventListener('click', (ev) => { const b = ev.target.closest('[data-add]'); if (b) addKind(b.dataset.add); });
    $('#undo').onclick = undo;
    $('#redo').onclick = redo;
    $('#title').addEventListener('input', (e) => { deck.title = e.target.value; dirty(); });
    $('#present').onclick = async () => { endEdit(); await flush(); location.href = `/slides-present?id=${id}&n=${cur + 1}`; };
    $('#pdf').onclick = async () => {
      const btn = $('#pdf');
      endEdit(); await flush();
      btn.disabled = true;
      try {
        await SlidesPdf.exportDeck(deck, (i, n) => { btn.textContent = i < n ? `Folie ${i + 1}/${n} …` : '✓ Fertig'; });
      } catch (err) { setState(`PDF fehlgeschlagen: ${err.message}`, 'warn'); }
      setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ PDF'; }, 1500);
    };
    async function flush() { for (let i = 0; i < 20 && (pending || saving); i++) { if (!saving) await save(); else await new Promise((r) => setTimeout(r, 150)); } }

    document.addEventListener('keydown', (ev) => {
      if (!deck || editing) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      const mod = ev.metaKey || ev.ctrlKey;
      const k = ev.key.toLowerCase();
      const e = sel();
      if (mod && k === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
      if (mod && k === 'y') { ev.preventDefault(); redo(); return; }
      if (mod && k === 'd') { ev.preventDefault(); duplicateElement(); return; }
      if (mod && k === 'c' && e) { try { localStorage.setItem('slides-clip', JSON.stringify(e)); } catch { /* egal */ } return; }
      if (mod && k === 'v') {
        let c = null; try { c = JSON.parse(localStorage.getItem('slides-clip')); } catch { /* egal */ }
        if (c && c.type) { pushHist(); c.id = uid(); c.x += 24; c.y += 24; slide().elements.push(c); selId = c.id; afterChange({ props: true }); }
        return;
      }
      if (!e) return;
      if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteElement(); }
      else if (ev.key === 'Enter' && (isTextual(e) || e.type === 'table')) { ev.preventDefault(); startEdit(e.id); }
      else if (ev.key === 'Escape') { selId = null; renderOverlay(); renderProps(); }
      else if (ev.key.startsWith('Arrow')) {
        ev.preventDefault();
        const step = ev.shiftKey ? 20 : 2;
        pushHist('nudge');
        if (ev.key === 'ArrowLeft') e.x -= step;
        if (ev.key === 'ArrowRight') e.x += step;
        if (ev.key === 'ArrowUp') e.y -= step;
        if (ev.key === 'ArrowDown') e.y += step;
        afterChange();
      }
    });

    new ResizeObserver(() => { if (deck && !editing) renderStage(); }).observe($('#stagewrap'));

    requireLogin().then(async () => {
      try {
        deck = await api(`/api/slides/${id}`);
        $('#title').value = deck.title;
        document.title = `${deck.title} – Folien`;
        renderAll();
        setState('✓ Gespeichert', 'ok');
      } catch (err) {
        $('#props').innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    });
  </script>
</body>
</html>
