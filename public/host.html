<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Host</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">← Dashboard</a>
    <strong id="title"></strong>
    <div class="row">
      <span class="muted auto-timer" id="auto-timer" aria-live="off"></span>
      <button type="button" id="auto" aria-pressed="true" title="Das Quiz läuft nach dem Start von selbst weiter">⏩ Automatik: an</button>
      <button type="button" class="danger" id="end">Beenden</button>
      <button type="button" class="primary" id="next">Starten</button>
    </div>
  </header>
  <main class="host">
    <p class="error" id="error"></p>
    <div id="view"></div>
    <div class="card" id="team-options" hidden>
      <h3 style="margin-bottom:.35rem">👥 Team-Modus</h3>
      <p class="muted" id="team-hint" style="margin:0"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/poll.js"></script>
  <script>
    const pin = new URLSearchParams(location.search).get('pin');
    const reducedMotion = document.documentElement.classList.contains('reduce-motion');
    const BOARD_ROWS = 10;
    let joinInfo = null;
    let autoOffset = 0;
    let state = null;
    let tick = null;
    let live;
    let lastKey = null;  // verhindert, dass Animationen bei jedem Nachladen neu starten
    let animToken = 0;
    let timers = [];

    // Geplante Schritte einer Animation; verfallen, sobald eine neue Ansicht gerendert wird
    function later(fn, ms) {
      const token = animToken;
      timers.push(setTimeout(() => { if (token === animToken) fn(); }, ms));
    }

    function stopAnimations() {
      animToken++;
      timers.forEach(clearTimeout);
      timers = [];
      document.querySelectorAll('.confetti').forEach((el) => el.remove());
    }

    function countUp(el, from, to, ms) {
      if (reducedMotion || from === to) { el.textContent = to; return; }
      const token = animToken;
      const t0 = performance.now();
      const step = (now) => {
        if (token !== animToken) return;
        const t = Math.min(1, (now - t0) / ms);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function guestTag(p) {
      return p.guest ? ' <span class="muted">(Gast)</span>' : '';
    }

    function answersHtml(q, reveal, distribution) {
      return `<div class="answers">${q.answers.map((a, i) => `
        <div class="answer c${i} ${reveal && q.correctSet && !q.correctSet.includes(i) ? 'dim' : ''}">
          ${escapeHtml(a)}${distribution ? ` <span style="float:right">${distribution[i]}</span>` : ''}
        </div>`).join('')}</div>`;
    }

    // --- Zwischenstand nach jeder Runde ---

    // Einträge der Rangliste: im Team-Modus die Teams, sonst die Spieler
    function boardEntries(s) {
      if (s.teams) {
        return s.teams.map((t) => ({
          name: `${t.emoji} ${t.name}`, tag: `${t.size} Spieler${t.ghost ? ' + 👻' : ''}`, color: t.color,
          rank: t.rank, prevRank: t.prevRank, score: t.score, prevScore: t.prevScore, gained: t.gained,
        }));
      }
      return s.players.map((p) => ({
        name: p.name, tag: p.guest ? 'Gast' : '', rank: p.rank, prevRank: p.prevRank,
        score: p.score, prevScore: p.prevScore, gained: p.gained,
      }));
    }

    function visibleBoard(s) {
      return boardEntries(s).filter((p) => p.rank <= BOARD_ROWS || p.prevRank <= BOARD_ROWS);
    }

    // --- Zwischenstand nach jeder Runde ---

    function scoreboardHtml(s) {
      const entries = visibleBoard(s);
      const total = boardEntries(s).length;
      const rows = Math.min(BOARD_ROWS, total);
      const start = !reducedMotion;  // erst an alter Position zeigen, dann umsortieren
      return `
        <div class="row spread">
          <span class="muted">Frage ${s.questionIndex + 1} / ${s.total} · PIN ${escapeHtml(s.pin)}</span>
        </div>
        <h2 class="center" style="margin-top:1rem">${s.teams ? 'Zwischenstand der Teams' : 'Zwischenstand'}</h2>
        <div class="board" id="board" style="height: calc(${rows} * var(--slot) - .5rem)">
          ${entries.map((p, i) => `
            <div class="board-row" data-i="${i}" ${p.color ? `data-team style="--team:${p.color};--pos:${(start ? p.prevRank : p.rank) - 1}"` : `style="--pos:${(start ? p.prevRank : p.rank) - 1}"`}>
              <span class="place">${start ? p.prevRank : p.rank}</span>
              <span class="who">${escapeHtml(p.name)}${p.tag ? ` <span class="muted">(${escapeHtml(p.tag)})</span>` : ''}</span>
              <span class="gain">${p.gained ? '+' + p.gained : ''}</span>
              <span class="pts">${start ? p.prevScore : p.score}</span>
              <span class="move"></span>
            </div>`).join('')}
        </div>
        ${total > BOARD_ROWS ? `<p class="center muted">… und ${total - BOARD_ROWS} weitere</p>` : ''}
        ${s.teams ? teamExtras(s) : ''}`;
    }

    // Team-Modus unter der Rangliste: Ausgleich und die besten Einzelspieler
    function teamExtras(s) {
      const ghost = s.teams.find((t) => t.ghost);
      return `
        ${ghost ? `<p class="center muted" style="margin-top:1rem">👻 Geist-Spieler für ${ghost.emoji} ${escapeHtml(ghost.name)}: ${ghost.bonus} Punkte (Durchschnitt der Mitspieler)</p>` : ''}
        <div class="card" style="max-width:760px;margin:1.5rem auto 0">
          <h3>Beste Einzelspieler</h3>
          <ol class="ranking" style="font-size:1.1rem">${s.players.slice(0, 3).map((p) =>
            `<li>${teamEmoji(s, p)} ${escapeHtml(p.name)} – ${p.score} Punkte</li>`).join('')}</ol>
        </div>`;
    }

    function teamEmoji(s, p) {
      const t = s.teams && s.teams.find((x) => x.index === p.team);
      return t ? t.emoji : '';
    }

    function animateScoreboard(s) {
      const entries = visibleBoard(s);
      if (reducedMotion) {
        document.querySelectorAll('.board-row').forEach((row) => {
          if (entries[row.dataset.i].rank < entries[row.dataset.i].prevRank) row.classList.add('climbed');
        });
        return;
      }
      later(() => {
        document.querySelectorAll('.board-row').forEach((row) => {
          const p = entries[row.dataset.i];
          row.style.setProperty('--pos', p.rank - 1);
          countUp(row.querySelector('.pts'), p.prevScore, p.score, 1100);
          if (p.rank < p.prevRank) {
            row.classList.add('climbed');
            row.querySelector('.move').textContent = `▲ ${p.prevRank - p.rank}`;
          }
          later(() => { row.querySelector('.place').textContent = p.rank; }, 500);
        });
      }, 1500);
    }

    // --- Die Teams vorstellen ---

    function teamsHtml(s) {
      return `
        <h1 class="center">Die Teams</h1>
        <div class="teams-grid">${s.teams.map((t, i) => `
          <div class="team-card pop-in" style="--delay:${reducedMotion ? 0 : 0.3 + i * 0.5}s;--team:${t.color}">
            <h2>${t.emoji} ${escapeHtml(t.name)}</h2>
            <p class="muted">${t.size} Spieler</p>
            <ul>${t.members.map((m) => `<li>${escapeHtml(m.name)}${guestTag(m)}</li>`).join('')}${t.ghost ? '<li class="muted">👻 Geist (Durchschnitt des Teams)</li>' : ''}</ul>
          </div>`).join('')}</div>
        ${s.teams.some((t) => t.ghost) ? `<p class="center muted" style="margin-top:1.5rem">👻 Ein Team hat einen Spieler weniger und bekommt deshalb einen Geist-Spieler, der immer den Punktedurchschnitt seiner Mitspieler hat.</p>` : ''}`;
    }

    // --- Siegerehrung ---

    // Podiumsplätze: im Team-Modus die Teams, sonst die Spieler
    function podiumEntries(s) {
      if (s.teams) {
        return s.teams.map((t) => ({ name: `${t.emoji} ${t.name}`, score: t.score, sub: t.members.map((m) => m.name).join(', ') + (t.ghost ? ' + 👻' : '') }));
      }
      return s.players.map((p) => ({ name: p.name, score: p.score }));
    }

    function podiumHtml(s) {
      const entries = podiumEntries(s);
      if (!entries.length) return '<div class="card center"><h2>Keine Teilnehmer</h2></div>';
      const top = entries.slice(0, 3);
      const medals = ['🥇', '🥈', '🥉'];
      // Reihenfolge des Aufpoppens: Platz 3, dann 2, dann 1
      const delay = (i) => reducedMotion ? 0 : 0.6 + (top.length - 1 - i) * 1.8;
      const winnerDelay = delay(0);
      const slot = (i) => `
        <div class="slot p${i + 1}" style="--delay:${delay(i)}s">
          ${i === 0 ? `<div class="crown" aria-hidden="true">👑</div>` : `<div class="medal" aria-hidden="true">${medals[i]}</div>`}
          <div class="who">${escapeHtml(top[i].name)}</div>
          <div class="score">${top[i].score} Punkte</div>
          ${top[i].sub ? `<div class="members muted">${escapeHtml(top[i].sub)}</div>` : ''}
          <div class="step">${i + 1}</div>
        </div>`;
      // Sichtbare Reihenfolge: 2 – 1 – 3
      const order = [1, 0, 2].filter((i) => top[i]);
      const rest = entries.slice(3);
      return `
        <h1 class="center">Siegerehrung</h1>
        <div class="winner-title" style="--delay:${winnerDelay + 0.9}s">🏆 ${escapeHtml(top[0].name)} ${s.teams ? 'gewinnen' : 'gewinnt'}!</div>
        <div class="podium">${order.map(slot).join('')}</div>
        ${rest.length ? `
          <div class="card fade-in" style="--delay:${winnerDelay + 1.8}s; max-width:760px; margin:0 auto 1rem">
            <h3>Weitere Plätze</h3>
            <ol class="ranking" start="4" style="font-size:1.1rem">${rest.slice(0, 10).map((p) =>
              `<li>${escapeHtml(p.name)} – ${p.score} Punkte</li>`).join('')}</ol>
            ${rest.length > 10 ? `<p class="muted">… und ${rest.length - 10} weitere</p>` : ''}
          </div>` : ''}
        ${s.teams ? `
          <div class="card fade-in" style="--delay:${winnerDelay + 1.8}s; max-width:760px; margin:0 auto 1rem">
            <h3>Beste Einzelspieler</h3>
            <ol class="ranking" style="font-size:1.1rem">${s.players.slice(0, 5).map((p) =>
              `<li>${teamEmoji(s, p)} ${escapeHtml(p.name)} – ${p.score} Punkte</li>`).join('')}</ol>
          </div>` : ''}
        ${s.achievements && s.achievements.length ? `
          <div class="card fade-in" style="--delay:${winnerDelay + 2.6}s; max-width:760px; margin:0 auto 1rem">
            <h3>🏆 Neue Erfolge</h3>
            <ul class="list">${s.achievements.map((p) => `
              <li><strong>${escapeHtml(p.name)}</strong>
                <span>${p.items.map((a) => `<span title="${escapeHtml(a.description)}">${a.icon} ${escapeHtml(a.name)}</span>`).join(' · ')}</span>
              </li>`).join('')}</ul>
          </div>` : ''}
        <p class="center fade-in" style="--delay:${winnerDelay + 1.8}s"><a class="btn" href="/dashboard">Zurück zum Dashboard</a></p>`;
    }

    function confetti() {
      const box = document.createElement('div');
      box.className = 'confetti';
      const colors = ['#e11d48', '#2563eb', '#d97706', '#16a34a', '#4f46e5', '#e6b422'];
      for (let i = 0; i < 90; i++) {
        const piece = document.createElement('i');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
        piece.style.animationDelay = `${Math.random() * 1.2}s`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        box.appendChild(piece);
      }
      document.body.appendChild(box);
      later(() => box.remove(), 8000);
    }

    // --- Lobby: Infoleiste, schwebende Namen, Reaktionen ---

    // Kleine Infoleiste oben: Teilnehmer, Modus, Fragen, Fach, Wertung (als Symbole mit Kurztext)
    function infoBar(s) {
      const n = s.players.length;
      const counts = n >= s.minPlayers;
      const items = [
        ['👥', `${n}`, `${n} ${n === 1 ? 'Teilnehmer' : 'Teilnehmer'}`, 'info-count'],
        [s.teamCount ? '🦊' : '👤', s.teamCount ? 'Team' : 'Einzel', s.teamCount ? 'Team-Modus: zwei Teams' : 'Einzel-Modus: jeder für sich'],
        ['❓', `${s.total}`, `${s.total} Fragen`],
      ];
      if (s.subject) items.push([s.subject.icon || '📘', s.subject.name, `Fach: ${s.subject.name}`]);
      items.push([counts ? '🏅' : '⏳', counts ? 'zählt' : `noch ${s.minPlayers - n}`,
        counts ? 'Das Quiz zählt für die Gesamtwertung.' : `Zählt erst ab ${s.minPlayers} Teilnehmern für die Gesamtwertung (noch ${s.minPlayers - n}).`, counts ? 'ok' : 'wait']);
      return `<div class="info-bar" id="info-bar">${items.map(([icon, text, title, cls = '']) =>
        `<span class="info-item ${cls}" title="${escapeHtml(title)}"><span aria-hidden="true">${icon}</span>${escapeHtml(text)}<span class="sr-only"> – ${escapeHtml(title)}</span></span>`).join('')}</div>`;
    }

    function lobbyHtml(s) {
      return `
        ${infoBar(s)}
        <div class="lobby-top">
          ${joinInfo ? `<img class="lobby-qr" src="${joinInfo.qr}" alt="QR-Code zum Beitreten">` : ''}
          <div>
            <div class="muted">Beitreten unter <strong>${escapeHtml(joinInfo ? joinInfo.joinUrl.split('/play')[0] : location.origin)}</strong></div>
            <div class="muted">Game-PIN</div>
            <div class="pin">${escapeHtml(s.pin)}</div>
          </div>
        </div>
        <div class="float-area" id="float-area">
          <div class="float-empty muted" id="float-empty">Warte auf Teilnehmer …</div>
        </div>`;
    }

    // Namen schweben lassen: bestehende Blasen bleiben (sonst startet ihre Animation neu), neue poppen auf
    const bubbles = new Map();
    function syncBubbles(s) {
      const area = $('#float-area');
      if (!area) { bubbles.clear(); return; }
      if (!area.dataset.ready) { bubbles.clear(); area.dataset.ready = '1'; }
      $('#float-empty').hidden = s.players.length > 0;
      const names = new Set(s.players.map((p) => p.name));
      for (const [name, el] of bubbles) if (!names.has(name)) { el.remove(); bubbles.delete(name); }
      s.players.forEach((p, i) => {
        if (bubbles.has(p.name)) return;
        const n = bubbles.size;
        // Verteilung nach dem goldenen Schnitt: gleichmäßig über die Fläche, stabil pro Spieler
        const fx = (n * 0.618034 + 0.13) % 1;
        const fy = (n * 0.381966 + 0.29 + (n % 3) * 0.11) % 1;
        const el = document.createElement('div');
        el.className = 'bubble';
        el.style.cssText = `left:${6 + fx * 74}%;top:${6 + fy * 76}%;--d:${(9 + (n * 7) % 8)}s;--delay:${-(n * 1.7) % 9}s;--dx:${(n % 2 ? 1 : -1) * (30 + (n * 13) % 50)}px;--dy:${(n % 3 ? 1 : -1) * (20 + (n * 17) % 40)}px`;
        el.innerHTML = `<span class="bubble-pill">${avatarHtml(p.name, '2rem')}<span>${escapeHtml(p.name)}${p.guest ? ' <span class="muted">(Gast)</span>' : ''}</span></span>`;
        el.dataset.name = p.name;
        area.appendChild(el);
        bubbles.set(p.name, el);
      });
    }

    // Reaktion eines Spielers: Emoji steigt von seiner Blase auf
    function showReaction(r) {
      const area = $('#float-area');
      if (!area) return;
      const bubble = bubbles.get(r.name);
      const box = area.getBoundingClientRect();
      const rect = bubble ? bubble.getBoundingClientRect() : null;
      const x = rect ? rect.left - box.left + rect.width / 2 : Math.random() * box.width;
      const y = rect ? rect.top - box.top : box.height * 0.7;
      const el = document.createElement('div');
      el.className = 'reaction';
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.setProperty('--sway', `${(Math.random() - 0.5) * 70}px`);
      el.innerHTML = `<span class="reaction-emoji">${r.emoji}</span><span class="reaction-name">${escapeHtml(r.name)}</span>`;
      area.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    let reactionCursor = null;
    function handleReactions(s) {
      if (s.state !== 'lobby') return;
      if (reactionCursor !== null) (s.reactions || []).forEach((r, i) => setTimeout(() => showReaction(r), i * 140));
      if (s.reactionCursor !== undefined) reactionCursor = s.reactionCursor;
    }

    // --- Hauptansicht ---

    // --- Team-Modus in der Lobby ---

    // Der Modus ist am Quiz eingestellt; in der Lobby steht nur, wie die Teams aussehen werden
    function teamHint(s) {
      const n = s.players.length;
      const need = s.teamCount * 2;
      if (n < need) return `Dieses Quiz wird im Team-Modus gespielt. Es braucht mindestens ${need} Teilnehmer (aktuell ${n}).`;
      return n % 2
        ? `${n} Teilnehmer → zwei Teams mit ${(n + 1) / 2} und ${(n - 1) / 2} Spielern. Das kleinere Team bekommt einen Geist-Spieler 👻, der immer den Punktedurchschnitt seiner Mitspieler hat.`
        : `${n} Teilnehmer → zwei gleich große Teams mit je ${n / 2} Spielern.`;
    }

    function updateTeamOptions(s) {
      $('#team-options').hidden = s.state !== 'lobby' || !s.teamCount;
      if (!$('#team-options').hidden) $('#team-hint').textContent = teamHint(s);
    }

    function updateControls(s) {
      $('#title').textContent = s.title;
      const nextBtn = $('#next');
      nextBtn.hidden = s.state === 'finished';
      $('#end').hidden = s.state === 'finished';
      nextBtn.textContent = {
        lobby: s.teamCount ? 'Teams bilden' : 'Quiz starten',
        teams: 'Erste Frage',
        question: 'Auflösen',
        reveal: 'Rangliste zeigen',
        scoreboard: s.questionIndex + 1 < s.total ? 'Nächste Frage' : 'Siegerehrung',
      }[s.state] || '';
      if (s.kind === 'poll') {
        nextBtn.textContent = { lobby: 'Umfrage starten', question: 'Ergebnis zeigen', reveal: s.questionIndex + 1 < s.total ? 'Nächste Frage' : 'Gesamtergebnis' }[s.state] || nextBtn.textContent;
      }
      // Mit Automatik heißt der Knopf „weiter jetzt“: er überspringt nur die Wartezeit
      if (s.auto && ['teams', 'reveal', 'scoreboard'].includes(s.state)) nextBtn.textContent = '⏭ Sofort weiter';
      $('#view').dataset.kind = s.kind;
      $('#auto').hidden = s.state === 'finished';
      $('#auto').textContent = `⏩ Automatik: ${s.auto ? 'an' : 'aus'}`;
      $('#auto').setAttribute('aria-pressed', String(s.auto));
      $('#auto').classList.toggle('on', s.auto);
      nextBtn.disabled = s.state === 'lobby' && s.players.length < Math.max(1, s.teamCount * 2);
      updateTeamOptions(s);
    }

    function render() {
      const s = state;
      updateControls(s);
      // In der Lobby füllt alles genau den Bildschirm aus: kein Scrollen
      document.body.classList.toggle('lobby-lock', s.state === 'lobby');

      // Lobby: nur Infoleiste und Blasen aktualisieren, damit die schwebenden Namen nicht jedes Mal neu starten
      if (s.state === 'lobby' && $('#float-area') && $('#info-bar')) {
        $('#info-bar').outerHTML = infoBar(s);
        syncBubbles(s);
        return;
      }

      // Zwischenstand, Teams und Siegerehrung nur einmal aufbauen, sonst startet die Animation bei jedem Nachladen neu
      const key = `${s.state}:${s.questionIndex}`;
      if (['scoreboard', 'finished', 'teams'].includes(s.state) && key === lastKey) return;
      lastKey = key;

      stopAnimations();
      clearInterval(tick);

      let html = '';
      if (s.state === 'lobby') {
        html = lobbyHtml(s);
      } else if (s.state === 'teams') {
        html = teamsHtml(s);
      } else if (s.state === 'question' || s.state === 'reveal') {
        const reveal = s.state === 'reveal';
        html = `
          <div class="row spread">
            <span class="muted">Frage ${s.questionIndex + 1} / ${s.total} · PIN ${escapeHtml(s.pin)}</span>
            <span class="muted">${s.answeredCount} / ${s.players.length} geantwortet</span>
          </div>
          <div class="question-text">${escapeHtml(s.question.text)}</div>
          ${s.question.multi ? `<div class="multi-hint host-hint">☑️ ${s.kind === 'poll' ? 'Mehrfachauswahl: jeder darf mehrere Antworten wählen' : 'Mehrere Antworten sind richtig – wählt alle richtigen!'}</div>`
            : s.kind === 'poll' ? '<div class="multi-hint plain host-hint">📊 Umfrage – es gibt kein richtig oder falsch</div>' : ''}
          ${reveal ? '' : '<div class="timer" id="timer"></div>'}
          ${reveal && s.kind === 'poll'
            ? `<div class="card">${pollChartHtml({ text: '', answers: s.question.answers, multi: s.question.multi, counts: s.distribution, respondents: s.answeredCount }, { big: true })}</div>`
            : answersHtml(s.question, reveal, reveal ? s.distribution : null)}`;
      } else if (s.state === 'scoreboard') {
        html = scoreboardHtml(s);
      } else if (s.state === 'finished' && s.kind === 'poll') {
        html = `<h2 class="center" style="margin-top:0">📊 Ergebnisse: ${escapeHtml(s.title)}</h2>${s.poll ? pollResultsHtml(s.poll, { big: true }) : ''}
          <p class="center muted">Die Ergebnisse sind gespeichert – du findest sie später unter „Quiz“ beim Knopf „📊 Ergebnisse“.</p>`;
      } else if (s.state === 'finished') {
        html = podiumHtml(s);
      }
      $('#view').innerHTML = html;
      if (s.state === 'lobby') syncBubbles(s);

      if (s.state === 'question') {
        const update = () => {
          const left = Math.ceil(live.remaining(s));
          const el = $('#timer');
          if (el) el.textContent = left;
        };
        update();
        tick = setInterval(update, 250);
      } else if (s.state === 'scoreboard') {
        animateScoreboard(s);
      } else if (s.state === 'finished' && s.kind !== 'poll' && s.players.length && !reducedMotion) {
        const places = Math.min(3, podiumEntries(s).length);
        later(confetti, (0.6 + (places - 1) * 1.8) * 1000 + 300);
      }
    }

    requireLogin().then(async () => {
      try {
        joinInfo = await api(`/api/games/${encodeURIComponent(pin)}/qr`);
      } catch (err) {
        $('#error').textContent = err.message;
        return;
      }
      // Host-Stand laden; in der Lobby kommen neue Reaktionen mit (after = zuletzt gesehene ID)
      const loadHost = async () => {
        const s = await api(`/api/games/${encodeURIComponent(pin)}/host${reactionCursor !== null ? `?after=${reactionCursor}` : ''}`);
        handleReactions(s);
        return s;
      };
      live = liveGame(pin, loadHost, (s) => {
        state = s;
        autoOffset = s.serverNow - Date.now();
        render();
      });
      const act = async (action) => {
        $('#error').textContent = '';
        $('#next').disabled = true;
        try {
          live.apply(await api(`/api/games/${encodeURIComponent(pin)}/${action}`, { method: 'POST' }));
        } catch (err) {
          $('#error').textContent = err.message;
          $('#next').disabled = false;
        }
      };
      $('#next').onclick = () => act('next');
      $('#auto').onclick = async () => {
        try { live.apply(await api(`/api/games/${encodeURIComponent(pin)}/auto`, { method: 'POST', body: { auto: !state.auto } })); }
        catch (err) { $('#error').textContent = err.message; }
      };
      // „Weiter in 3 s“ neben den Knöpfen
      setInterval(() => {
        const el = $('#auto-timer');
        if (!state || !state.auto || !state.autoAt) { el.textContent = ''; return; }
        const left = Math.max(0, Math.ceil((state.autoAt - (Date.now() + autoOffset)) / 1000));
        el.textContent = `Weiter in ${left} s`;
      }, 250);
      $('#end').onclick = () => {
        if (confirm('Spiel wirklich beenden?')) act('end');
      };
    });
  </script>
</body>
</html>
