<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Übung</title>
  <link rel="stylesheet" href="/style.css?v=19">
</head>
<body>
  <header class="top">
    <a class="brand" href="/learnworld" id="back-link">← Learnworld</a>
    <strong id="head-title">Übung</strong>
    <span id="me"></span>
  </header>
  <main style="max-width:860px">
    <p class="error" id="error"></p>
    <div id="intro"></div>
    <div class="tr-modes" id="modes" role="tablist"></div>
    <div id="stage"></div>
  </main>
  <style>
    .tr-modes { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; }
    .tr-modes button { margin: 0; padding: .5rem .9rem; border-radius: 999px; box-shadow: none; background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 800; }
    .tr-modes button[aria-pressed="true"] { background: var(--primary-grad); color: #fff; border-color: transparent; box-shadow: var(--glow); }
    .tr-prog { display: flex; justify-content: space-between; align-items: center; gap: .6rem; color: var(--muted); font-weight: 700; margin-bottom: .6rem; }
    .tr-bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; flex: 1; }
    .tr-bar span { display: block; height: 100%; background: var(--primary-grad); }
    .tr-q { font-size: 1.1rem; font-weight: 800; margin: 0 0 .8rem; overflow-wrap: anywhere; }
    .tr-chips { display: flex; flex-direction: column; gap: .45rem; margin-bottom: .9rem; }
    .tr-chip { margin: 0; text-align: left; padding: .65rem .85rem; border-radius: 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); box-shadow: none; font-weight: 600; overflow-wrap: anywhere; }
    .tr-chip.used { opacity: .35; }
    .tr-answer { border: 2px dashed var(--border); border-radius: 16px; padding: .5rem; min-height: 3.2rem; margin-bottom: .8rem; display: flex; flex-direction: column; gap: .4rem; }
    .tr-answer .tr-chip { display: flex; gap: .6rem; background: var(--card); border-color: var(--primary); }
    .tr-answer .n { font-weight: 800; color: var(--primary); min-width: 1.4rem; }
    .tr-chip.ok, .tr-row.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--card)); }
    .tr-chip.bad, .tr-row.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--card)); }
    .tr-tree { margin: 0 0 1rem; }
    .tr-row { display: flex; gap: .5rem; align-items: baseline; padding: .4rem .6rem; border: 1px solid transparent; border-radius: 12px; overflow-wrap: anywhere; }
    .tr-row .lb { font-weight: 800; color: var(--primary); min-width: 2.2rem; flex: none; }
    .tr-row input { flex: 1; min-width: 0; margin: 0; width: auto; }
    .tr-row .sol { color: var(--muted); font-size: .88rem; display: block; }
    .tr-block { padding: .6rem .8rem; border-radius: 14px; border: 1px solid var(--border); background: var(--card); margin-bottom: .5rem; line-height: 1.9; overflow-wrap: anywhere; }
    .tr-block .role { display: inline-block; font-size: .72rem; font-weight: 800; padding: .05rem .5rem; border-radius: 999px; background: var(--bg); color: var(--muted); margin-right: .4rem; vertical-align: middle; }
    .tr-block input.gap { max-width: 100%; margin: 0 .15rem; padding: .15rem .4rem; font-size: .95rem; display: inline-block; }
    .tr-block input.gap.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--card)); }
    .tr-block input.gap.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--card)); }
    .tr-block .fix { color: var(--ok); font-weight: 800; }
    .tr-block mark.hit { background: color-mix(in srgb, var(--ok) 30%, transparent); color: inherit; border-radius: 4px; padding: 0 .15rem; }
    .tr-block mark.miss { background: color-mix(in srgb, var(--danger) 25%, transparent); color: inherit; border-radius: 4px; padding: 0 .15rem; }
    .tr-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
    .tr-actions button { margin: 0; }
    .tr-result { font-weight: 800; margin: .3rem 0 .6rem; }
    .tr-done { text-align: center; padding: 1.2rem .5rem; }
    .tr-done .big { font-size: 2.6rem; font-weight: 800; }
    textarea.tr-free { width: 100%; min-height: 9rem; }
    .tr-seg { display: inline-flex; gap: .3rem; margin: 0 0 .8rem; }
    .tr-seg button { margin: 0; padding: .3rem .7rem; box-shadow: none; }
    .tr-seg button[aria-pressed="true"] { background: var(--bg); border-color: var(--primary); color: var(--link); }
  </style>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const stage = $('#stage');
    let T = null;            // Übung
    let mode = null;

    // ---------- Hilfen ----------
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const norm = (s) => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9§ ]+/g, ' ').replace(/\s+/g, ' ').trim();
    const STOP = new Set('der die das den dem des ein eine einer einem einen eines und oder mit von bei zur zum nach auf aus als wie ist sind wird werden sich nicht auch noch dann dass sowie oder im in an am um fur ueber unter durch ihr ihre ihrer seine seiner'.split(' '));
    const sigWords = (s) => norm(s).split(' ').filter((w) => w.length >= 3 && !STOP.has(w));
    function lev(a, b) {
      if (a === b) return 0;
      if (Math.abs(a.length - b.length) > 2) return 3;
      const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j++) d[0][j] = j;
      for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      return d[a.length][b.length];
    }
    const sameWord = (u, t) => u === t || (t.length >= 6 && lev(u, t) <= 1) || (t.length >= 7 && u.length >= 7 && u.slice(0, 6) === t.slice(0, 6));
    // Anteil der wichtigen Wörter von target, die im Text des Nutzers vorkommen
    function coverage(userText, target) {
      const tw = sigWords(target);
      if (!tw.length) return norm(userText).includes(norm(target)) ? 1 : 0;
      const uw = norm(userText).split(' ');
      return tw.filter((t) => uw.some((u) => sameWord(u, t))).length / tw.length;
    }
    const OK = 0.6;
    const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    const labelOf = (path) => (path.length === 1 ? `${ROMAN[path[0]] || path[0] + 1}.` : path.slice(1).map((i) => i + 1).join('.'));
    // Schema flach: { node, path, label, depth, parent }
    function flatten(nodes, path = [], parent = null, out = []) {
      nodes.forEach((n, i) => { const p = [...path, i]; const it = { node: n, path: p, label: labelOf(p), depth: p.length - 1, parent }; out.push(it); if (n.c) flatten(n.c, p, it, out); });
      return out;
    }
    const prog = (done, total) => `<div class="tr-prog"><span>${Math.min(done + 1, total)} / ${total}</span><div class="tr-bar"><span style="width:${total ? (done / total) * 100 : 0}%"></span></div></div>`;
    const finish = (score, total, what, again) => { stage.innerHTML = `<div class="card tr-done"><div class="big">${total ? Math.round((score / total) * 100) : 0} %</div><p class="tr-result">${score} von ${total} ${what}</p><p class="muted">${score === total ? 'Sehr gut – das sitzt! 🎉' : 'Wiederhole die Übung, bis alles sitzt.'}</p><div class="tr-actions" style="justify-content:center"><button type="button" class="primary" id="again">Nochmal</button></div></div>`; $('#again').onclick = again; };

    // ---------- Schema: Reihenfolge ----------
    function schemaOrder() {
      const groups = [{ title: 'die Hauptpunkte', items: T.data.nodes.map((n) => n.t), label: '' }];
      for (const it of flatten(T.data.nodes)) if (it.node.c && it.node.c.length > 1) groups.push({ title: `die Unterpunkte von „${it.node.t.length > 60 ? it.node.t.slice(0, 58) + '…' : it.node.t}“`, items: it.node.c.map((c) => c.t) });
      let queue = shuffle(groups); const total = queue.length; let done = 0; let first = 0; const retried = new Set();
      const next = () => {
        if (!queue.length) { finish(first, total, 'Reihenfolgen auf Anhieb richtig', schemaOrder); return; }
        const g = queue[0]; let placed = []; let checked = false;
        const order = shuffle(g.items.map((t, i) => ({ t, i })));
        const draw = () => {
          stage.innerHTML = `${prog(done, total)}<div class="card"><p class="tr-q">Bringe ${escapeHtml(g.title)} in die richtige Reihenfolge:</p>
            <div class="tr-answer" id="ans">${placed.length ? placed.map((o, k) => `<button type="button" class="tr-chip ${checked ? (o.i === k ? 'ok' : 'bad') : ''}" data-rm="${k}"><span class="n">${k + 1}.</span><span>${escapeHtml(o.t)}</span></button>`).join('') : '<span class="muted">Tippe die Punkte nacheinander an.</span>'}</div>
            ${checked ? `<div class="tr-result">${placed.every((o, k) => o.i === k) ? '✅ Richtig!' : '❌ Nicht ganz. So ist es richtig:'}</div>${placed.every((o, k) => o.i === k) ? '' : `<div class="tr-answer">${g.items.map((t, k) => `<div class="tr-chip ok"><span class="n">${k + 1}.</span><span>${escapeHtml(t)}</span></div>`).join('')}</div>`}` : `<div class="tr-chips">${order.map((o) => `<button type="button" class="tr-chip ${placed.includes(o) ? 'used' : ''}" data-add="${order.indexOf(o)}" ${placed.includes(o) ? 'disabled' : ''}>${escapeHtml(o.t)}</button>`).join('')}</div>`}
            <div class="tr-actions">${checked ? '<button type="button" class="primary" id="nx">Weiter</button>' : `<button type="button" class="primary" id="chk" ${placed.length === order.length ? '' : 'disabled'}>Prüfen</button>`}</div></div>`;
          stage.querySelectorAll('[data-add]').forEach((b) => { b.onclick = () => { placed.push(order[Number(b.dataset.add)]); draw(); }; });
          stage.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { if (checked) return; placed.splice(Number(b.dataset.rm), 1); draw(); }; });
          if ($('#chk')) $('#chk').onclick = () => { checked = true; draw(); };
          if ($('#nx')) $('#nx').onclick = () => { const ok = placed.every((o, k) => o.i === k); queue.shift(); done += 1; if (ok) { if (!retried.has(g)) first += 1; } else if (!retried.has(g)) { retried.add(g); queue.push(g); } next(); };
        };
        draw();
      };
      next();
    }

    // ---------- Schema: Lücken ----------
    let gapLevel = 0.4;
    function schemaGaps() {
      const flat = flatten(T.data.nodes);
      const hideN = Math.max(2, Math.round(flat.length * gapLevel));
      const hidden = new Set(shuffle(flat.map((_, i) => i)).slice(0, hideN));
      let checked = false;
      const draw = () => {
        let ok = 0;
        stage.innerHTML = `<div class="tr-seg">${[[0.25, 'leicht'], [0.4, 'mittel'], [0.7, 'schwer']].map(([v, l]) => `<button type="button" data-lv="${v}" aria-pressed="${gapLevel === v}">${l}</button>`).join('')}</div>
          <div class="card"><p class="tr-q">Ergänze die fehlenden Punkte des Schemas.</p><div class="tr-tree">${flat.map((it, i) => {
            const pad = `style="margin-left:${it.depth * 1.3}rem"`;
            if (!hidden.has(i)) return `<div class="tr-row" ${pad}><span class="lb">${it.label}</span><span>${escapeHtml(it.node.t)}</span></div>`;
            if (!checked) return `<div class="tr-row" ${pad}><span class="lb">${it.label}</span><input type="text" data-g="${i}" placeholder="…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
            const v = (stage.dataset['g' + i] || ''); const good = coverage(v, it.node.t) >= OK; if (good) ok += 1;
            return `<div class="tr-row ${good ? 'ok' : 'bad'}" ${pad}><span class="lb">${it.label}</span><span>${good ? '✅' : '❌'} ${escapeHtml(it.node.t)}${good ? '' : `<span class="sol">Deine Antwort: ${escapeHtml(v) || '–'}</span>`}</span></div>`;
          }).join('')}</div>
          ${checked ? `<div class="tr-result">${ok} von ${hidden.size} richtig</div>` : ''}
          <div class="tr-actions">${checked ? '<button type="button" class="primary" id="again">Neue Runde</button>' : '<button type="button" class="primary" id="chk">Prüfen</button>'}</div></div>`;
        stage.querySelectorAll('[data-lv]').forEach((b) => { b.onclick = () => { gapLevel = Number(b.dataset.lv); schemaGaps(); }; });
        if ($('#chk')) $('#chk').onclick = () => { stage.querySelectorAll('[data-g]').forEach((inp) => { stage.dataset['g' + inp.dataset.g] = inp.value; }); checked = true; draw(); };
        if ($('#again')) $('#again').onclick = () => { for (const k of Object.keys(stage.dataset)) delete stage.dataset[k]; schemaGaps(); };
      };
      for (const k of Object.keys(stage.dataset)) delete stage.dataset[k];
      draw();
    }

    // ---------- Schema: Aus dem Kopf ----------
    function schemaRecall(text = '') {
      const flat = flatten(T.data.nodes);
      stage.innerHTML = `<div class="card"><p class="tr-q">Schreibe das Prüfungsschema aus dem Kopf auf – Stichworte genügen.</p>
        <textarea class="tr-free" id="rc" placeholder="z. B. Vorprüfung, Formelle Rechtmäßigkeit: Zuständigkeit, …" autocomplete="off" spellcheck="false">${escapeHtml(text)}</textarea>
        <div class="tr-actions"><button type="button" class="primary" id="cmp">Mit dem Schema vergleichen</button></div></div>`;
      $('#cmp').onclick = () => {
        const val = $('#rc').value;
        let ok = 0;
        const rows = flat.map((it) => { const cv = coverage(val, `${it.node.t}`); const good = cv >= OK; if (good) ok += 1; return `<div class="tr-row ${good ? 'ok' : 'bad'}" style="margin-left:${it.depth * 1.3}rem"><span class="lb">${it.label}</span><span>${good ? '✅' : '❌'} ${escapeHtml(it.node.t)}</span></div>`; });
        stage.innerHTML = `<div class="card"><div class="tr-result">${ok} von ${flat.length} Punkten erkannt (${Math.round((ok / flat.length) * 100)} %)</div><div class="tr-tree">${rows.join('')}</div><p class="muted" style="font-size:.88rem">Die Auswertung sucht die wichtigen Wörter jedes Punkts in deinem Text – sie ersetzt keine eigene Kontrolle.</p>
          <div class="tr-actions"><button type="button" class="primary" id="again">Nochmal versuchen</button></div></div>`;
        $('#again').onclick = () => schemaRecall(val);
      };
    }

    // ---------- Muster ----------
    const GAP = /\{\{([^}]+)\}\}/g;
    const blanksOf = (text) => [...text.matchAll(GAP)].map((m) => m[1].split('|').map((x) => x.trim()));
    const gapOk = (input, alts) => { const u = norm(input); return alts.some((a) => { const t = norm(a); return u === t || (t.length >= 6 && lev(u, t) <= 1); }); };

    function musterGaps() {
      const secs = shuffle(T.data.sections); const total = secs.length; let done = 0; let sumOk = 0; let sumAll = 0;
      const next = () => {
        if (done >= total) { finish(sumOk, sumAll, 'Lücken richtig', musterGaps); return; }
        const sec = secs[done]; let checked = false; const vals = {};
        const draw = () => {
          let gi = 0;
          stage.innerHTML = `${prog(done, total)}<div class="card"><p class="tr-q">${escapeHtml(sec.title)}</p>${sec.hint ? `<p class="muted" style="margin:-.4rem 0 .8rem">${escapeHtml(sec.hint)}</p>` : ''}
            ${sec.blocks.map((b) => `<div class="tr-block"><span class="role">${escapeHtml(b.role)}</span>${escapeHtml(b.text).replace(/\{\{([^}]+)\}\}/g, (_, raw) => {
              const k = gi++; const alts = raw.split('|').map((x) => x.trim());
              const w = `style="width:${Math.min(30, Math.max(7, alts[0].length * 0.62 + 3))}ch"`;
              if (!checked) return `<input class="gap" ${w} type="text" data-k="${k}" value="${escapeHtml(vals[k] || '')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke">`;
              const good = gapOk(vals[k] || '', alts);
              return `<input class="gap ${good ? 'ok' : 'bad'}" ${w} type="text" value="${escapeHtml(vals[k] || '')}" disabled>${good ? '' : `<span class="fix">${escapeHtml(alts[0])}</span>`}`;
            })}</div>`).join('')}
            <div class="tr-actions">${checked ? '<button type="button" class="primary" id="nx">Weiter</button>' : '<button type="button" class="primary" id="chk">Prüfen</button>'}</div></div>`;
          if ($('#chk')) $('#chk').onclick = () => { stage.querySelectorAll('[data-k]').forEach((i) => { vals[i.dataset.k] = i.value; }); checked = true; let k = 0; for (const b of sec.blocks) for (const alts of blanksOf(b.text)) { sumAll += 1; if (gapOk(vals[k++] || '', alts)) sumOk += 1; } draw(); };
          if ($('#nx')) $('#nx').onclick = () => { done += 1; next(); };
          const first = stage.querySelector('input.gap:not([disabled])'); if (first && !checked) first.focus({ preventScroll: true });
        };
        draw();
      };
      next();
    }

    function musterOrder() {
      const secs = shuffle(T.data.sections.filter((s) => s.blocks.length > 1)); const total = secs.length; let done = 0; let first = 0;
      const next = () => {
        if (done >= total) { finish(first, total, 'Abschnitte auf Anhieb richtig', musterOrder); return; }
        const sec = secs[done]; let placed = []; let checked = false; let tries = 0;
        const order = shuffle(sec.blocks.map((b, i) => ({ b, i })));
        const plain = (t) => t.replace(/\{\{([^}|]+)(?:\|[^}]*)?\}\}/g, '$1');
        const draw = () => {
          const ok = placed.every((o, k) => o.i === k);
          stage.innerHTML = `${prog(done, total)}<div class="card"><p class="tr-q">${escapeHtml(sec.title)}: Bringe die Bausteine des Gutachtens in die richtige Reihenfolge.</p>
            <div class="tr-answer">${placed.length ? placed.map((o, k) => `<button type="button" class="tr-chip ${checked ? (o.i === k ? 'ok' : 'bad') : ''}" data-rm="${k}"><span class="n">${k + 1}.</span><span>${escapeHtml(plain(o.b.text))}</span></button>`).join('') : '<span class="muted">Tippe die Sätze nacheinander an.</span>'}</div>
            ${checked ? `<div class="tr-result">${ok ? '✅ Richtig!' : '❌ Nicht ganz. So ist es richtig:'}</div>${ok ? '' : `<div class="tr-answer">${sec.blocks.map((b, k) => `<div class="tr-chip ok"><span class="n">${k + 1}.</span><span><b>${escapeHtml(b.role)}:</b> ${escapeHtml(plain(b.text))}</span></div>`).join('')}</div>`}` : `<div class="tr-chips">${order.map((o, i) => `<button type="button" class="tr-chip ${placed.includes(o) ? 'used' : ''}" data-add="${i}" ${placed.includes(o) ? 'disabled' : ''}>${escapeHtml(plain(o.b.text))}</button>`).join('')}</div>`}
            <div class="tr-actions">${checked ? '<button type="button" class="primary" id="nx">Weiter</button>' : `<button type="button" class="primary" id="chk" ${placed.length === order.length ? '' : 'disabled'}>Prüfen</button>`}</div></div>`;
          stage.querySelectorAll('[data-add]').forEach((b) => { b.onclick = () => { placed.push(order[Number(b.dataset.add)]); draw(); }; });
          stage.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { if (checked) return; placed.splice(Number(b.dataset.rm), 1); draw(); }; });
          if ($('#chk')) $('#chk').onclick = () => { checked = true; tries += 1; draw(); };
          if ($('#nx')) $('#nx').onclick = () => { if (ok && tries === 1) first += 1; done += 1; next(); };
        };
        draw();
      };
      next();
    }

    function musterFree() {
      const secs = shuffle(T.data.sections); const total = secs.length; let done = 0; let sumHit = 0; let sumAll = 0;
      const next = () => {
        if (done >= total) { finish(sumHit, sumAll, 'Schlüsselbegriffe getroffen', musterFree); return; }
        const sec = secs[done];
        stage.innerHTML = `${prog(done, total)}<div class="card"><p class="tr-q">Formuliere: ${escapeHtml(sec.title)}</p>${sec.hint ? `<p class="muted" style="margin:-.4rem 0 .6rem">${escapeHtml(sec.hint)}</p>` : ''}
          <p class="muted" style="font-size:.88rem">Bausteine: ${sec.blocks.map((b) => escapeHtml(b.role)).join(' → ')}</p>
          <textarea class="tr-free" id="fr" placeholder="Schreibe den Abschnitt im Gutachtenstil …" autocomplete="off" spellcheck="false"></textarea>
          <div class="tr-actions"><button type="button" class="primary" id="show">Muster zeigen und vergleichen</button></div></div>`;
        $('#show').onclick = () => {
          const val = norm($('#fr').value); let hit = 0; let all = 0;
          const body = sec.blocks.map((b) => `<div class="tr-block"><span class="role">${escapeHtml(b.role)}</span>${escapeHtml(b.text).replace(/\{\{([^}]+)\}\}/g, (_, raw) => { const alts = raw.split('|').map((x) => x.trim()); const ok = alts.some((a) => val.includes(norm(a))); all += 1; if (ok) hit += 1; return `<mark class="${ok ? 'hit' : 'miss'}">${escapeHtml(alts[0])}</mark>`; })}</div>`).join('');
          sumHit += hit; sumAll += all;
          stage.innerHTML = `${prog(done, total)}<div class="card"><p class="tr-q">${escapeHtml(sec.title)}</p><div class="tr-result">${hit} von ${all} Schlüsselbegriffen in deinem Text (grün = getroffen, rot = fehlt)</div>${body}
            <p class="muted" style="font-size:.88rem">Prüfe selbst, ob dein Text auch inhaltlich stimmt – die Auswertung sucht nur die Schlüsselbegriffe.</p><div class="tr-actions"><button type="button" class="primary" id="nx">Weiter</button></div></div>`;
          $('#nx').onclick = () => { done += 1; next(); };
        };
      };
      next();
    }

    // ---------- Aufbau ----------
    const MODES = {
      schema: [['order', '↕️ Reihenfolge', schemaOrder], ['gaps', '▢ Lücken', schemaGaps], ['recall', '🧠 Aus dem Kopf', () => schemaRecall()]],
      muster: [['gaps', '▢ Lücken füllen', musterGaps], ['order', '↕️ Bausteine ordnen', musterOrder], ['free', '✍️ Selbst formulieren', musterFree]],
    };
    function start(m) {
      mode = m;
      $('#modes').innerHTML = MODES[T.kind].map(([k, l]) => `<button type="button" data-m="${k}" aria-pressed="${k === m}">${l}</button>`).join('');
      try { localStorage.setItem(`train-mode:${T.kind}`, m); } catch { /* egal */ }
      MODES[T.kind].find(([k]) => k === m)[2]();
    }
    $('#modes').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b) start(b.dataset.m); });

    requireLogin().then(async (me) => {
      mountNav('study', me);
      try {
        T = await api(`/api/trainings/${id}`);
        $('#head-title').textContent = T.kind === 'schema' ? 'Prüfungsschema' : 'Musterformulierungen';
        document.title = `${T.title} – Übung`;
        if (T.course) { $('#back-link').href = `/learnworld#${T.course.slug}`; $('#back-link').textContent = `← ${T.course.name}`; }
        $('#intro').innerHTML = `<div class="card"><h1 style="margin:0 0 .3rem">${T.kind === 'schema' ? '🧩' : '✍️'} ${escapeHtml(T.title)}</h1><p class="muted" style="margin:0">${escapeHtml(T.data.intro || '')}</p></div>`;
        let saved = null; try { saved = localStorage.getItem(`train-mode:${T.kind}`); } catch { /* egal */ }
        start(MODES[T.kind].some(([k]) => k === saved) ? saved : MODES[T.kind][0][0]);
      } catch (err) { $('#error').textContent = err.message; }
    });
  </script>
</body>
</html>
