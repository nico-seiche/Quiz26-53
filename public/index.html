<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Anmelden</title>
  <link rel="stylesheet" href="/style.css?v=11">
</head>
<body>
  <main>
    <div class="card narrow">
      <h1>Quiz</h1>
      <p class="muted">Mit einem Konto kannst du Quiz erstellen und hosten – und deine Punkte werden gespeichert.</p>
      <div class="tabs">
        <button type="button" id="tab-login" class="active">Anmelden</button>
        <button type="button" id="tab-register">Registrieren</button>
      </div>
      <form id="form">
        <label for="username">Nutzername</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <label for="password">Passwort</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <p class="error" id="error"></p>
        <button class="primary" type="submit" id="submit">Anmelden</button>
      </form>
    </div>
    <div class="card narrow" id="qr-panel" hidden style="margin-top:1rem">
      <h2 style="margin-top:0">📱 Mit dem Handy anmelden</h2>
      <ol class="muted" style="padding-left:1.2rem;margin:.3rem 0 .8rem">
        <li>Öffne die App auf deinem Handy (dort angemeldet).</li>
        <li>Gehe auf <strong>Profil → Einstellungen → Anderes Gerät anmelden</strong> und scanne diesen Code.</li>
      </ol>
      <div id="qr-box" class="qr-box" aria-label="QR-Code zum Anmelden"></div>
      <p class="muted center" id="qr-status" aria-live="polite" style="margin:.6rem 0"></p>
      <button type="button" id="qr-cancel" style="width:100%">Abbrechen</button>
    </div>
    <p class="center"><button type="button" id="qr-open" class="link-btn">📱 Mit QR-Code vom Handy anmelden</button></p>
    <p class="center"><a href="/play">Ohne Konto als Gast mitspielen →</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script>
    let mode = 'login';
    const next = new URLSearchParams(location.search).get('next') || '/dashboard';

    function setMode(m) {
      mode = m;
      $('#tab-login').classList.toggle('active', m === 'login');
      $('#tab-register').classList.toggle('active', m === 'register');
      $('#submit').textContent = m === 'login' ? 'Anmelden' : 'Konto erstellen';
      $('#password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      $('#error').textContent = '';
    }
    $('#tab-login').onclick = () => setMode('login');
    $('#tab-register').onclick = () => setMode('register');

    $('#form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api(`/api/auth/${mode}`, {
          method: 'POST',
          body: { username: $('#username').value, password: $('#password').value },
        });
        // Prüfen, ob der Browser die Anmeldung wirklich behalten hat (blockierte Cookies fallen sonst erst auf der nächsten Seite auf)
        await api('/api/auth/me').catch(() => { throw new Error('Angemeldet, aber dein Browser speichert keine Cookies für diese Seite. Erlaube Cookies für diese Seite (oder schalte Erweiterungen/Tracking-Schutz dafür aus) und versuche es erneut.'); });
        location.href = next.startsWith('/') ? next : '/dashboard';
      } catch (err) {
        $('#error').textContent = err.message;
      }
    };

    // --- Anmelden per QR-Code: dieses Gerät zeigt den Code, ein angemeldetes Handy bestätigt ihn ---
    let qr = null;     // { code, secret, timer, expires }
    function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
    async function startQr() {
      stopQr();
      $('#qr-panel').hidden = false;
      $('#qr-open').hidden = true;
      $('#form').closest('.card').hidden = true;     // der QR-Code soll ohne Scrollen sichtbar sein
      $('#qr-status').textContent = 'QR-Code wird erstellt …';
      try {
        if (!window.qrcode) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
        const { code, secret, seconds } = await api('/api/auth/qr', { method: 'POST' });
        const q = window.qrcode(0, 'M');
        q.addData(`${location.origin}/qr?code=${code}`);
        q.make();
        $('#qr-box').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
        qr = { code, secret, expires: Date.now() + seconds * 1000 };
        qr.timer = setInterval(pollQr, 2000);
        $('#qr-status').textContent = 'Warte auf die Bestätigung am Handy …';
      } catch (err) { $('#qr-status').textContent = err.message || 'QR-Code konnte nicht erstellt werden.'; }
    }
    function stopQr() { if (qr) clearInterval(qr.timer); qr = null; }
    async function pollQr() {
      if (!qr) return;
      const mine = qr;
      try {
        const r = await api('/api/auth/qr/poll', { method: 'POST', body: { code: mine.code, secret: mine.secret } });
        if (qr !== mine) return;
        if (r.status === 'approved') { stopQr(); $('#qr-status').textContent = `✓ Angemeldet als ${r.user.username}`; location.href = next.startsWith('/') ? next : '/dashboard'; }
        else if (r.status === 'expired') startQr();     // abgelaufen: neuen Code zeigen
      } catch { /* kurzer Verbindungsfehler: beim nächsten Takt nochmal */ }
    }
    $('#qr-open').onclick = startQr;
    $('#qr-cancel').onclick = () => { stopQr(); $('#qr-panel').hidden = true; $('#qr-open').hidden = false; $('#form').closest('.card').hidden = false; };

    // Schon angemeldet? Direkt weiter
    api('/api/auth/me').then(() => { location.href = next; }).catch(() => {});
  </script>
</body>
</html>
