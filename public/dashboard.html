<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – Home</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">Quiz</a>
    <span class="muted hide-small" id="me"></span>
  </header>
  <main>
    <h1 id="hello">Hallo 👋</h1>

    <div class="card">
      <h2>Einem Quiz beitreten</h2>
      <form class="row" id="join-form">
        <input type="text" id="join-pin" inputmode="numeric" placeholder="PIN eingeben" style="max-width:200px">
        <button class="primary" type="submit">Beitreten</button>
      </form>
    </div>

    <div class="tile-grid">
      <a class="tile" href="/profile">
        <span class="tile-value" id="t-points">–</span><span class="muted">Punkte</span>
      </a>
      <a class="tile" href="/leaderboard">
        <span class="tile-value" id="t-rank">–</span><span class="muted" id="t-rank-label">Platz</span>
      </a>
      <a class="tile" href="/profile#erfolge">
        <span class="tile-value" id="t-ach">–</span><span class="muted">Erfolge</span>
      </a>
    </div>

    <div class="card">
      <div class="row spread">
        <h2>Zuletzt gespielt</h2>
        <a href="/profile">Alle Ergebnisse</a>
      </div>
      <ul class="list" id="recent"></ul>
    </div>

    <div class="card">
      <div class="row spread">
        <div>
          <h2>Eigenes Quiz erstellen</h2>
          <span class="muted">Wähle Fach und Spielmodus und lade deinen Kurs ein.</span>
        </div>
        <a class="btn primary" href="/edit">+ Neues Quiz</a>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      const pin = $('#join-pin').value.trim();
      if (pin) location.href = `/play?pin=${encodeURIComponent(pin)}`;
    };

    const nf = (n) => n.toLocaleString('de-DE');

    async function loadOverview() {
      // Jede Kennzahl lädt für sich; ein Fehler bei einer soll die übrigen nicht verhindern
      const [results, achievements, board] = await Promise.all([
        api('/api/results').catch(() => null),
        api('/api/achievements').catch(() => null),
        api('/api/leaderboard').catch(() => null),
      ]);
      if (results) {
        $('#t-points').textContent = nf(results.total);
        $('#recent').innerHTML = results.results.slice(0, 3).map((r) => `
          <li>
            <div>
              <strong>${escapeHtml(r.quiz_title)}</strong>${r.subject ? ` <span class="tag">${escapeHtml(r.subject)}</span>` : ''}<br>
              <span class="muted">${new Date(r.played_at).toLocaleDateString('de-DE')}</span>
            </div>
            <div>${r.score} Punkte · Platz ${r.rank}/${r.player_count}</div>
          </li>`).join('') || '<li class="muted">Noch nichts gespielt – tritt einem Quiz bei und deine Ergebnisse erscheinen hier.</li>';
      }
      if (achievements) $('#t-ach').textContent = `${achievements.earned}/${achievements.total}`;
      if (board) {
        const ranked = board.me.points > 0;
        $('#t-rank').textContent = ranked ? board.me.rank : '–';
        $('#t-rank-label').textContent = ranked ? `Platz von ${board.userCount}` : 'noch ohne Platz';
      }
    }

    requireLogin().then((me) => {
      $('#me').textContent = me.username;
      $('#hello').textContent = `Hallo, ${me.username} 👋`;
      mountNav('home');
      loadOverview();
    });
  </script>
</body>
</html>
