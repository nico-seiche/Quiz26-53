<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – Meine Quizze</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">Quiz</a>
    <div class="row">
      <span class="muted" id="me"></span>
      <button type="button" onclick="logout()">Abmelden</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row spread">
        <h2>Einem Quiz beitreten</h2>
      </div>
      <form class="row" id="join-form">
        <input type="text" id="join-pin" inputmode="numeric" placeholder="PIN eingeben" style="max-width:200px">
        <button class="primary" type="submit">Beitreten</button>
      </form>
    </div>

    <div class="card">
      <h2>Meine Statistik</h2>
      <div class="stat-total" id="total">0</div>
      <div class="muted" id="games">Punkte insgesamt</div>
      <div id="subjects" style="margin-top:1rem"></div>
    </div>

    <div class="card">
      <h2>Meine Ergebnisse</h2>
      <ul class="list" id="results"></ul>
    </div>

    <div class="card">
      <div class="row spread">
        <h2>Meine Quizze</h2>
        <a class="btn primary" href="/edit">+ Neues Quiz</a>
      </div>
      <p class="error" id="error"></p>
      <ul class="list" id="quizzes"></ul>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      const pin = $('#join-pin').value.trim();
      if (pin) location.href = `/play?pin=${encodeURIComponent(pin)}`;
    };

    async function load() {
      const quizzes = await api('/api/quizzes');
      $('#quizzes').innerHTML = quizzes.length ? quizzes.map((q) => `
        <li>
          <div>
            <strong>${escapeHtml(q.title)}</strong><br>
            <span class="muted">${q.question_count} Fragen</span>
            ${q.subject ? `<span class="tag">${escapeHtml(q.subject)}</span>` : '<span class="tag">Kein Fach</span>'}
          </div>
          <div class="row">
            <button class="primary" type="button" data-start="${q.id}" ${q.question_count ? '' : 'disabled'}>Starten</button>
            <a class="btn" href="/edit?id=${q.id}">Bearbeiten</a>
            <button class="danger" type="button" data-delete="${q.id}">Löschen</button>
          </div>
        </li>`).join('') : '<li class="muted">Noch keine Quizze – leg dein erstes an.</li>';
    }

    $('#quizzes').onclick = async (e) => {
      const start = e.target.dataset.start;
      const del = e.target.dataset.delete;
      try {
        if (start) {
          const { pin } = await api('/api/games', { method: 'POST', body: { quizId: Number(start) } });
          location.href = `/host?pin=${pin}`;
        } else if (del && confirm('Quiz wirklich löschen?')) {
          await api(`/api/quizzes/${del}`, { method: 'DELETE' });
          load();
        }
      } catch (err) {
        $('#error').textContent = err.message;
      }
    };

    async function loadResults() {
      const { total, games, subjects, results } = await api('/api/results');
      $('#total').textContent = total.toLocaleString('de-DE');
      $('#games').textContent = `Punkte insgesamt · ${games} ${games === 1 ? 'Spiel' : 'Spiele'}`;
      const max = Math.max(1, ...subjects.map((s) => s.points));
      $('#subjects').innerHTML = subjects.map((s) => `
        <div class="stat-row" title="${s.games} ${s.games === 1 ? 'Spiel' : 'Spiele'}">
          <span>${escapeHtml(s.name)}</span>
          <div class="stat-bar"><span style="width:${(s.points / max) * 100}%"></span></div>
          <span class="stat-points">${s.points.toLocaleString('de-DE')}</span>
        </div>`).join('');
      $('#results').innerHTML = results.length ? results.map((r) => `
        <li>
          <div>
            <strong>${escapeHtml(r.quiz_title)}</strong>${r.subject ? ` <span class="tag">${escapeHtml(r.subject)}</span>` : ''}<br>
            <span class="muted">${new Date(r.played_at).toLocaleString('de-DE')}</span>
          </div>
          <div>${r.score} Punkte · Platz ${r.rank}/${r.player_count}</div>
        </li>`).join('') : '<li class="muted">Noch keine Ergebnisse – spiel eingeloggt mit, dann werden deine Punkte hier gespeichert.</li>';
    }

    requireLogin().then((me) => {
      $('#me').textContent = me.username;
      load();
      loadResults();
    });
  </script>
</body>
</html>
