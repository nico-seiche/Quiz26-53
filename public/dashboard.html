<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Home</title>
  <link rel="stylesheet" href="/style.css?v=20">
</head>
<body>
  <header class="top">
    <a class="brand brand-logo" href="/dashboard" aria-label="Quiz – Startseite"><img src="/icons/logo.svg" alt="" width="32" height="32"></a>
    <span id="me"></span>
  </header>
  <main>
    <h1 class="hello">Hallo, <span class="hello-name" id="hello-name">…</span> 👋</h1>

    <a class="card battle-banner" id="battle-banner" href="/study" hidden></a>

    <div class="card join-slim">
      <form class="join-form" id="join-form" aria-label="Einem Quiz beitreten">
        <span class="join-label" aria-hidden="true">🎮 Quiz-Raum</span>
        <input type="text" id="join-pin" inputmode="numeric" placeholder="PIN eingeben" aria-label="Game-PIN">
        <button class="go-btn" type="submit">GO!</button>
      </form>
      <div class="level-line" id="level-line" hidden>
        <div class="level-bar" role="progressbar" aria-label="Fortschritt zum nächsten Level" id="level-bar">
          <span id="level-fill"></span>
        </div>
        <div class="level-labels">
          <span><strong id="level-now"></strong> <span class="streak-chip" id="streak"></span></span>
          <span class="muted" id="level-next"></span>
        </div>
      </div>
    </div>

    <h2 class="tiles-head">✨ Erstellen</h2>
    <div class="app-tiles">
      <a class="app-tile" href="/quizzes"><span class="at-ico" aria-hidden="true">❓</span><strong>Quiz</strong><small>Meine Quiz &amp; neues Quiz</small></a>
      <a class="app-tile" href="/edit?import=1"><span class="at-ico" aria-hidden="true">📥</span><strong>Quiz importieren</strong><small>Aus KI-Text oder Datei</small></a>
      <a class="app-tile" href="/edit?kind=poll"><span class="at-ico" aria-hidden="true">📊</span><strong>Umfrage</strong><small>Mit Diagramm</small></a>
      <a class="app-tile" href="/study-edit"><span class="at-ico" aria-hidden="true">🃏</span><strong>Lernset</strong><small>Karteikarten</small></a>
      <button class="app-tile" type="button" id="new-deck"><span class="at-ico" aria-hidden="true">🖥️</span><strong>Präsentation</strong><small>Folien</small></button>
      <button class="app-tile" type="button" id="new-doc"><span class="at-ico" aria-hidden="true">📝</span><strong>Dokument</strong><small>Texte schreiben</small></button>
    </div>

    <h2 class="tiles-head">📚 Bereiche</h2>
    <div class="app-tiles">
      <a class="app-tile" href="/learnworld"><span class="at-ico" aria-hidden="true">🎓</span><strong>Learnworld</strong><small>Rechtsfächer &amp; Unterlagen</small></a>
      <a class="app-tile" href="/gesetze"><span class="at-ico" aria-hidden="true">⚖️</span><strong>Gesetze</strong><small>Paragraphen lesen</small></a>
      <a class="app-tile" href="/slides"><span class="at-ico" aria-hidden="true">🎞️</span><strong>Präsentationen</strong><small>Meine Folien</small></a>
      <a class="app-tile" href="/docs"><span class="at-ico" aria-hidden="true">📄</span><strong>Dokumente</strong><small>Meine Texte</small></a>
    </div>

    <div class="row spread section-head">
      <h2>Zuletzt gespielt</h2>
    </div>
    <div class="recent-list" id="recent"></div>

  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    noAutoFocus($('#join-pin'));
    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      const pin = $('#join-pin').value.trim();
      if (pin) location.href = `/play?pin=${encodeURIComponent(pin)}`;
    };

    $('#new-deck').onclick = async () => {
      try { const { id } = await api('/api/slides', { method: 'POST', body: { title: 'Neue Präsentation' } }); location.href = `/slides-edit?id=${id}`; }
      catch (err) { alert(err.message); }
    };

    $('#new-doc').onclick = async () => {
      try { const { id } = await api('/api/docs', { method: 'POST', body: { title: 'Neues Dokument' } }); location.href = `/docs-edit?id=${id}`; }
      catch (err) { alert(err.message); }
    };

    const nf = (n) => n.toLocaleString('de-DE');

    // Level-Fortschritt, aus /api/auth/me
    function showLevel(me, dayStreak) {
      $('#level-line').hidden = false;
      $('#level-fill').style.width = `${(me.intoLevel / me.perLevel) * 100}%`;
      $('#level-bar').setAttribute('aria-valuenow', Math.round((me.intoLevel / me.perLevel) * 100));
      $('#level-now').textContent = `Level ${me.level}`;
      $('#level-next').textContent = `Nächstes Ziel: Level ${me.level + 1} in ${nf(me.toNext)} Punkten`;
      if (dayStreak > 0) $('#streak').textContent = `🔥 ${dayStreak} ${dayStreak === 1 ? 'Tag' : 'Tage'} Serie`;
    }

    // Farbe des Punkte-Etiketts nach Platzierung im Spiel
    function pillClass(r) {
      const share = r.rank / r.player_count;
      return share <= 0.34 ? 'good' : share <= 0.67 ? 'mid' : 'low';
    }

    async function loadOverview(me) {
      const results = await api('/api/results').catch(() => null);
      if (!results) return;
      showLevel(me, results.dayStreak);
      $('#recent').innerHTML = results.results.slice(0, 3).map((r) => `
        <div class="recent-row">
          <span class="subject-icon" aria-hidden="true">${r.subject_icon || '📘'}</span>
          <div>
            <div class="recent-title">${escapeHtml(r.quiz_title)}</div>
            ${r.subject ? `<span class="tag">${escapeHtml(r.subject)}</span>` : ''}
            <span class="muted">${new Date(r.played_at).toLocaleDateString('de-DE')}</span>
          </div>
          <div class="recent-meta">
            <span class="pts-pill ${pillClass(r)}">${nf(r.score)} Punkte</span>
            <span class="muted">Platz ${r.rank}/${r.player_count}</span>
          </div>
        </div>`).join('') || '<div class="card muted">Noch nichts gespielt – tritt einem Quiz bei und deine Ergebnisse erscheinen hier.</div>';
    }

    requireLogin().then((me) => {
      $('#hello-name').textContent = me.username;
      mountNav('home', me);
      if (me.battleInvites) { $('#battle-banner').hidden = false; $('#battle-banner').textContent = `⚔️ ${me.battleInvites === 1 ? 'Du wurdest' : me.battleInvites + ' Herausforderungen:'} zu einem Battle herausgefordert – jetzt ansehen →`; }
      showLevel(me, 0);
      loadOverview(me);
    });
  </script>
</body>
</html>
