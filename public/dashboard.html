<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m!=="on"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Home</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">Quiz</a>
    <span id="me"></span>
  </header>
  <main>
    <h1 class="hello">Hallo, <span class="hello-name" id="hello-name">…</span> 👋</h1>

    <a class="card battle-banner" id="battle-banner" href="/study" hidden></a>

    <div class="card join-card">
      <div class="join-art" aria-hidden="true">
        <span class="spark s1">✨</span><span id="art-avatar"></span><span class="spark s2">✨</span><span class="spark s3">❓</span>
      </div>
      <h2>Einem Quiz beitreten</h2>
      <form class="join-form" id="join-form">
        <input type="text" id="join-pin" inputmode="numeric" placeholder="PIN eingeben" aria-label="Game-PIN">
        <button class="go-btn" type="submit">GO!</button>
      </form>
      <div class="level-line" id="level-line" hidden>
        <div class="level-bar" role="progressbar" aria-label="Fortschritt zum nächsten Level" id="level-bar">
          <span id="level-fill"></span>
        </div>
        <div class="level-labels">
          <span><strong id="level-now"></strong> <span class="streak-chip" id="streak"></span></span>
          <span class="muted" id="level-next"></span>
        </div>
      </div>
    </div>

    <div class="tile-grid">
      <a class="tile tile-gold" href="/profile">
        <span class="tile-icon" aria-hidden="true">🏆</span>
        <span class="tile-value" id="t-points">–</span>
        <span class="tile-label">Punkte</span>
        <span class="tile-chip dark" id="t-today" hidden></span>
      </a>
      <a class="tile tile-silver" href="/leaderboard">
        <span class="tile-icon" aria-hidden="true">🥇</span>
        <span class="tile-value" id="t-rank">–</span>
        <span class="tile-label" id="t-rank-label">Platz</span>
        <span class="tile-chip" id="t-rank-chip" hidden></span>
      </a>
      <a class="tile tile-rainbow" href="/profile#erfolge">
        <span class="tile-icon" aria-hidden="true">⭐</span>
        <span class="tile-value" id="t-ach">–</span>
        <span class="tile-label">Erfolge</span>
        <span class="tile-chip" id="t-ach-chip" hidden></span>
      </a>
    </div>

    <div class="row spread section-head">
      <h2>Zuletzt gespielt</h2>
      <a class="pill-btn" href="/profile">Alle Ergebnisse</a>
    </div>
    <div class="recent-list" id="recent"></div>

    <div class="create-card">
      <span class="q-bubble" aria-hidden="true">?</span>
      <div>
        <h2>Eigenes Quiz erstellen</h2>
        <span class="muted">Wähle Fach und Spielmodus und lade deinen Kurs ein.</span>
      </div>
      <a class="btn primary" href="/edit">+ Neues Quiz</a>
    </div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    noAutoFocus($('#join-pin'));
    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      const pin = $('#join-pin').value.trim();
      if (pin) location.href = `/play?pin=${encodeURIComponent(pin)}`;
    };

    const nf = (n) => n.toLocaleString('de-DE');

    // Level-Fortschritt, aus /api/auth/me
    function showLevel(me, dayStreak) {
      $('#level-line').hidden = false;
      $('#level-fill').style.width = `${(me.intoLevel / me.perLevel) * 100}%`;
      $('#level-bar').setAttribute('aria-valuenow', Math.round((me.intoLevel / me.perLevel) * 100));
      $('#level-now').textContent = `Level ${me.level}`;
      $('#level-next').textContent = `Nächstes Ziel: Level ${me.level + 1} in ${nf(me.toNext)} Punkten`;
      if (dayStreak > 0) $('#streak').textContent = `🔥 ${dayStreak} ${dayStreak === 1 ? 'Tag' : 'Tage'} Serie`;
    }

    // Farbe des Punkte-Etiketts nach Platzierung im Spiel
    function pillClass(r) {
      const share = r.rank / r.player_count;
      return share <= 0.34 ? 'good' : share <= 0.67 ? 'mid' : 'low';
    }

    async function loadOverview(me) {
      // Jede Kennzahl lädt für sich; ein Fehler bei einer soll die übrigen nicht verhindern
      const [results, achievements, board] = await Promise.all([
        api('/api/results').catch(() => null),
        api('/api/achievements').catch(() => null),
        api('/api/leaderboard').catch(() => null),
      ]);
      if (results) {
        $('#t-points').textContent = nf(results.total);
        if (results.today > 0) { $('#t-today').hidden = false; $('#t-today').textContent = `+${nf(results.today)} heute`; }
        showLevel(me, results.dayStreak);
        $('#recent').innerHTML = results.results.slice(0, 3).map((r) => `
          <div class="recent-row">
            <span class="subject-icon" aria-hidden="true">${r.subject_icon || '📘'}</span>
            <div>
              <div class="recent-title">${escapeHtml(r.quiz_title)}</div>
              ${r.subject ? `<span class="tag">${escapeHtml(r.subject)}</span>` : ''}
              <span class="muted">${new Date(r.played_at).toLocaleDateString('de-DE')}</span>
            </div>
            <div class="recent-meta">
              <span class="pts-pill ${pillClass(r)}">${nf(r.score)} Punkte</span>
              <span class="muted">Platz ${r.rank}/${r.player_count}</span>
            </div>
          </div>`).join('') || '<div class="card muted">Noch nichts gespielt – tritt einem Quiz bei und deine Ergebnisse erscheinen hier.</div>';
      }
      if (achievements) {
        $('#t-ach').textContent = `${achievements.earned}/${achievements.total}`;
        if (achievements.title) { $('#t-ach-chip').hidden = false; $('#t-ach-chip').textContent = achievements.title; }
      }
      if (board) {
        const ranked = board.me.points > 0;
        $('#t-rank').textContent = ranked ? board.me.rank : '–';
        $('#t-rank-label').textContent = ranked ? `Platz von ${board.userCount}` : 'noch ohne Platz';
        // Chip: Aufsteiger (Platz seit dem letzten Spiel verbessert), sonst Spitzenplätze
        const up = board.me.prevRank ? board.me.prevRank - board.me.rank : 0;
        const chip = !ranked ? null : up > 0 ? `Aufsteiger! ▲${up}` : board.me.rank === 1 ? 'Spitze! 👑' : board.me.rank <= 3 ? 'Top 3' : null;
        if (chip) { $('#t-rank-chip').hidden = false; $('#t-rank-chip').textContent = chip; }
      }
    }

    requireLogin().then((me) => {
      $('#hello-name').textContent = me.username;
      $('#art-avatar').innerHTML = avatarHtml(me.username, '4.5rem');
      mountNav('home', me);
      if (me.battleInvites) { $('#battle-banner').hidden = false; $('#battle-banner').textContent = `⚔️ ${me.battleInvites === 1 ? 'Du wurdest' : me.battleInvites + ' Herausforderungen:'} zu einem Battle herausgefordert – jetzt ansehen →`; }
      showLevel(me, 0);
      loadOverview(me);
    });
  </script>
</body>
</html>
