<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Gesetze</title>
  <link rel="stylesheet" href="/style.css?v=14">
  <style>
    :root { --tile-border: #d3d9fd; }   /* heller Rahmen im Lightmode */
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tile-border: var(--link); } }
    :root[data-theme="dark"] { --tile-border: var(--link); }
    main.law-main { max-width: 1150px; }
    .law-top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .law-top h1 { margin: 0; font-size: 1.5rem; }
    #error:empty { display: none; }
    .fav-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: .3rem .8rem; font-weight: 800; cursor: pointer; margin: 0 0 0 auto; box-shadow: none; white-space: nowrap; }
    .fav-btn[aria-pressed="true"] { background: #fff4c7; border-color: #f2c94c; color: #8a6100; }
    .fav-law { margin: 1.1rem 0 .4rem; font-size: 1rem; }
    .fav-row { display: flex; align-items: center; gap: .6rem; padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 12px; margin-bottom: .4rem; background: var(--card); }
    .fav-row a { flex: 1; color: var(--text); text-decoration: none; font-weight: 700; overflow-wrap: anywhere; }
    .fav-row a b { color: var(--primary); margin-right: .4rem; }
    .fav-row button { margin: 0; padding: .25rem .6rem; box-shadow: none; background: #fff4c7; color: #8a6100; border: 1px solid #f2c94c; }
    .law-tab.cfg { border-style: dashed; }
    .lib-row { display: flex; align-items: center; gap: .6rem; padding: .45rem .3rem; border-bottom: 1px solid var(--border); }
    .lib-row label { flex: 1; display: flex; align-items: center; gap: .6rem; margin: 0; cursor: pointer; font-weight: 700; min-width: 0; }
    .lib-row input[type=checkbox] { width: 1.3rem; height: 1.3rem; flex: none; margin: 0; }
    .lib-row .t { font-weight: 400; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
    .lib-row button { margin: 0; padding: .2rem .55rem; box-shadow: none; }
    .lib-row.off .nm { opacity: .5; text-decoration: line-through; }
    .law-tab.fav { border-color: #f2c94c; }
    .hl { color: #1b1d3a; border-radius: 3px; padding: .05em 0; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .hl-yellow { background: #fde68a; } .hl-green { background: #bbf7d0; } .hl-blue { background: #bfdbfe; } .hl-pink { background: #fbcfe8; }
    .hl.has-note { border-bottom: 2px solid #7c4dff; }
    .sel-bar { position: fixed; z-index: 60; display: flex; gap: .35rem; align-items: center; padding: .35rem .5rem; border-radius: 999px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 8px 28px rgba(20, 22, 50, .3); }
    .sel-bar button { margin: 0; padding: 0; width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); cursor: pointer; font-size: 1rem; display: inline-grid; place-items: center; }
    .sel-bar .c-yellow { background: #fde68a; } .sel-bar .c-green { background: #bbf7d0; } .sel-bar .c-blue { background: #bfdbfe; } .sel-bar .c-pink { background: #fbcfe8; }
    .sel-bar .sb-note { background: var(--card); width: auto; padding: 0 .6rem; border-radius: 999px; font-weight: 800; font-size: .9rem; }
    .par-note { margin-top: 1.2rem; border: 1px dashed var(--border); border-radius: 12px; padding: .6rem .8rem; }
    .par-note textarea { width: 100%; min-height: 4.5rem; margin: .3rem 0 0; }
    .note-row { padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 12px; margin-bottom: .4rem; background: var(--card); }
    .note-row .q { padding: .1rem .35rem; border-radius: 4px; color: #1b1d3a; display: inline; overflow-wrap: anywhere; }
    .note-row a.go { color: var(--primary); font-weight: 800; text-decoration: none; margin-right: .4rem; }
    .form-sec { margin-top: 1.4rem; }
    .form-sec h3 { margin: 1rem 0 .3rem; font-size: 1.02rem; }
    .form-sec .form-note { font-size: .88rem; margin: 0 0 .6rem; }
    .form-item { border: 1px solid var(--border); border-radius: 12px; padding: .5rem .75rem; margin-bottom: .4rem; background: var(--card); }
    .form-item a.ref-head { font-weight: 800; color: var(--primary); text-decoration: none; }
    .form-item q { display: block; quotes: none; margin-top: .15rem; overflow-wrap: anywhere; }
    .form-item mark { background: #ffe27a; color: #1b1d3a; font-weight: 800; border-radius: 3px; padding: 0 .15rem; }
    .law-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .law-tab { padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 800; cursor: pointer; }
    .law-tab[aria-pressed="true"] { background: var(--primary-grad); color: #fff; border-color: transparent; box-shadow: var(--glow); }

    .law-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; align-items: start; }
    .law-layout.side-open { grid-template-columns: 340px minmax(0, 1fr); }
    .law-layout:not(.side-open) .law-side { display: none; }
    .law-side { position: sticky; top: 4.5rem; max-height: calc(100vh - 11rem); display: flex; flex-direction: column; padding: .9rem; }
    .law-side input { margin-bottom: .6rem; }
    .toc { overflow-y: auto; margin: 0 -.3rem; padding: 0 .3rem; flex: 1; overscroll-behavior: contain; }
    .toc-group { width: 100%; display: flex; align-items: center; gap: .4rem; text-align: left; padding: .5rem .5rem; margin-top: .35rem; border: 0; border-radius: 10px; background: var(--bg); color: var(--text); font-weight: 800; font-size: .88rem; cursor: pointer; box-shadow: none; }
    .toc-group .chev { transition: transform .15s; flex: none; }
    .toc-group[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .toc-sub { padding: .5rem .5rem .1rem; font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: none; }
    .toc-sub.l2 { padding-left: .5rem; color: var(--text); }
    .toc-sub.l3 { padding-left: .9rem; }
    .toc-sub.l4 { padding-left: 1.3rem; font-weight: 600; }
    .toc-par { display: flex; gap: .5rem; width: 100%; text-align: left; padding: .38rem .5rem; border: 0; border-radius: 9px; background: transparent; color: var(--text); font-size: .9rem; font-weight: 500; cursor: pointer; box-shadow: none; line-height: 1.3; }
    .toc-par:hover { background: var(--bg); }
    .toc-par .n { flex: none; min-width: 3rem; font-weight: 800; color: var(--link); font-variant-numeric: tabular-nums; }
    .toc-par[aria-current="true"] { background: var(--primary-grad); color: #fff; }
    .toc-par[aria-current="true"] .n { color: #fff; }
    .toc-hit { display: block; width: 100%; text-align: left; padding: .55rem .6rem; margin-bottom: .3rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); font-weight: 500; cursor: pointer; box-shadow: none; }
    .toc-hit:hover { border-color: var(--primary); }
    .toc-hit .t { font-weight: 800; }
    .toc-hit .snip { display: block; margin-top: .15rem; font-size: .82rem; color: var(--muted); line-height: 1.35; }
    mark { background: #fde68a; color: #1b1d3a; border-radius: 3px; padding: 0 .1em; }

    .law-read { padding: 1.4rem 1.5rem; min-height: 22rem; min-width: 0; overflow-wrap: anywhere; }
    .law-views { display: flex; gap: .5rem; margin-bottom: .9rem; }
    .law-views button { padding: .45rem .8rem; font-size: .9rem; }
    .law-views button[aria-pressed="true"] { background: var(--bg); border-color: var(--primary); color: var(--link); }
    .grid-head { margin: .2rem 0 .2rem; font-size: 1.3rem; }
    .num-row { display: grid; grid-template-columns: 3.8rem minmax(0, 1fr); gap: .5rem; align-items: center; margin-bottom: .55rem; }
    .num-tiles { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: .55rem; }
    .num-row-label { font-size: .8rem; font-weight: 800; color: var(--muted); }
    .num-tile { width: 100%; aspect-ratio: 1 / .8; display: grid; place-items: center; padding: 0; border: 2px solid var(--tile-border); border-radius: 14px; background: var(--card); color: var(--text); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; cursor: pointer; box-shadow: none; transition: transform .12s, background .12s; }
    .num-tile:hover { background: var(--primary-grad); color: #fff; border-color: transparent; transform: translateY(-2px); }
    .num-tile[aria-current="true"] { background: var(--primary-grad); color: #fff; border-color: transparent; box-shadow: var(--glow); }
    .num-tile.empty { border: 1.5px dashed var(--border); background: transparent; color: var(--muted); font-weight: 600; opacity: .45; cursor: default; }
    .num-tile.empty:hover { transform: none; background: transparent; color: var(--muted); }
    .related { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: -.4rem 0 1.1rem; font-size: .85rem; color: var(--muted); }
    .related button { padding: .2rem .65rem; border: 1px solid var(--tile-border); border-radius: 999px; background: var(--card); color: var(--link); font-size: .85rem; font-weight: 800; cursor: pointer; box-shadow: none; }
    .related button:hover, .related button[aria-current="true"] { background: var(--primary-grad); color: #fff; border-color: transparent; }
    .law-crumb { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; line-height: 1.4; }
    .par-head { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .par-num { font-size: 2rem; font-weight: 900; background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.02em; }
    .par-title { margin: 0; font-size: 1.35rem; line-height: 1.25; }
    .abs { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: .3rem; margin: 0 0 .85rem; line-height: 1.65; font-size: 1.04rem; }
    .abs .an { font-weight: 800; color: var(--link); font-variant-numeric: tabular-nums; }
    .abs.plain { grid-template-columns: 1fr; }
    .abs.item { margin-left: 2.4rem; margin-top: -.35rem; }
    .abs.item .an { color: var(--muted); }
    .abs.plain.d1, .abs.plain.d2 { margin-left: 2.4rem; }
    .abs.item.d2 { margin-left: 4.2rem; grid-template-columns: 2rem minmax(0, 1fr); }
    .abs.item.d3 { margin-left: 6rem; grid-template-columns: 2rem minmax(0, 1fr); }
    .abs p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
    a.ref { color: var(--link); font-weight: 800; text-decoration: none; border-bottom: 1.5px dotted currentColor; cursor: pointer; }
    a.ref:hover { background: var(--bg); }
    .par-nav { display: flex; justify-content: space-between; gap: .6rem; margin-bottom: 1rem; }
    .par-nav button { flex: 1 1 0; text-align: left; display: flex; flex-direction: column; gap: .1rem; padding: .6rem .8rem; min-width: 0; }
    .par-nav button:last-child { text-align: right; }
    .par-nav .small { font-size: .78rem; font-weight: 600; opacity: .7; }
    .par-nav .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    details.notes { margin-top: 1.1rem; font-size: .85rem; color: var(--muted); }
    details.notes summary { cursor: pointer; font-weight: 800; }
    details.notes p { margin: .4rem 0 0; }
    .law-intro h2 { margin-top: 0; }
    .law-intro .muted { font-size: .9rem; line-height: 1.5; }
    .law-intro dl { margin: 1rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: .3rem .9rem; font-size: .92rem; }
    .law-intro dt { font-weight: 800; }
    .law-intro dd { margin: 0; overflow-wrap: anywhere; }
    .law-keys { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
    kbd { padding: .05rem .35rem; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); font-size: .8rem; }

    @media (max-width: 860px) {
      main.law-main { padding-left: .75rem; padding-right: .75rem; }
      .law-layout, .law-layout.side-open { grid-template-columns: minmax(0, 1fr); }
      .law-layout:not(.side-open) .law-side { display: block; }
      .law-side { position: static; max-height: none; }
      .toc { overflow: visible; }
      .law-layout:not(.mobile-toc) .law-side { display: none; }
      .law-layout.mobile-toc .law-read { display: none; }
      .num-row { grid-template-columns: minmax(0, 1fr); gap: .3rem; margin-bottom: .9rem; }
      .num-tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .45rem; }
      .num-tile { font-size: 1.35rem; aspect-ratio: 1 / .9; }
      .law-read { padding: 1.1rem 1rem; }
      .law-keys { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/profile">← Profil</a>
    <strong>Gesetze</strong>
    <span id="me"></span>
  </header>
  <main class="law-main">
    <div class="law-top">
      <h1>⚖️ Gesetze</h1>
    </div>
    <p class="error" id="error"></p>
    <div class="law-tabs" id="tabs" role="group" aria-label="Gesetz auswählen"></div>
    <div class="law-layout" id="layout" hidden>
      <aside class="card law-side">
        <input type="text" id="search" inputmode="search" enterkeyhint="search" placeholder="§ oder Stichwort suchen …" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Suchen">
        <div class="toc" id="toc"></div>
      </aside>
      <section class="card law-read" id="read" aria-live="polite"></section>
    </div>
    <section class="card" id="favs" hidden></section>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let laws = [];
    let law = null;            // geladenes Gesetz
    let pars = [];             // nur die Paragraphen, in Reihenfolge
    let byNum = new Map();
    let current = null;        // aktueller Paragraph
    let pane = 'grid';         // rechts: 'grid' (Übersicht) oder 'read' (Paragraph)
    let query = '';
    const openGroups = new Set();
    let prefs = { hidden: [], order: [] };
    let notes = [];            // Markierungen und Notizen: { id, law, num, line, start, end, quote, color, note }
    let favs = [];             // { law, num, title }
    let favMode = false;       // Favoriten- oder Notizenseite offen
    let special = '__fav';     // welche: '__fav' oder '__notes'
    const cache = new Map();

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* egal */ } },
    };

    // --- Text → HTML ---------------------------------------------------------
    // „§ 8“, „§§ 47 bis 49“: Verweise innerhalb des Gesetzes werden anklickbar, solange nicht ein anderes Gesetz folgt („§ 1 Ordnungsbehördengesetz“).
    const NUM = String.raw`\d+[a-z]?(?![a-zäöüß])`;
    const lt = (p) => p.title || p.lt || '';   // Listentitel; Artikel ohne Überschrift (GG) zeigen den Textanfang
    const U = () => (law && law.unit) || '§';
    let REF = null;
    const buildRef = () => {
      const lead = U() === '§' ? '§§?' : '(?:Artikel|Art\\.)';
      REF = new RegExp(String.raw`(${lead}\s*)(${NUM})((?:\s*(?:,|und|bis|oder|sowie|–)\s*${NUM})*)`, 'g');
    };
    const OTHER_LAW_HEAD = String.raw`^(?:\s*(?:Abs\.|Absatz|Satz|S\.|Nr\.|Nummer|Buchstabe|Halbsatz|Alt\.)|\s*\d+[a-z]?\)?|\s*[a-z]\)|\s*,|\s+und|\s+bis|\s+oder)*\s+(?:des |der |dem |den )?`;
    let otherLaw = null;
    const buildOtherLaw = () => { otherLaw = new RegExp(OTHER_LAW_HEAD + `(?!${law.short.split(' ')[0]}\\b|Abs\\.|Absatz|Satz|S\\.|Nr\\.|Nummer|Buchstabe|Halbsatz|Alt\\.)[A-ZÄÖÜ]`); };
    function link(num) {
      const n = num.replace(/\s+/g, '');
      return byNum.has(n) ? `<a class="ref" data-go="${n}" href="#${law.slug}/${n}">${num}</a>` : num;
    }
    function textHtml(raw, noLink) {
      const esc = escapeHtml(raw);
      if (noLink) return highlight(esc);
      let out = '';
      let last = 0;
      for (const m of esc.matchAll(REF)) {
        const tail = esc.slice(m.index + m[0].length);
        out += esc.slice(last, m.index);
        last = m.index + m[0].length;
        if (otherLaw.test(tail)) { out += m[0]; continue; }
        out += m[1] + link(m[2]) + m[3].replace(/\d+[a-z]?(?![a-zäöüß])/g, (x) => link(x));
      }
      out += esc.slice(last);
      return highlight(out);
    }
    function highlight(html) {
      const terms = query.split(/\s+/).filter((t) => t.length > 1 && !/^\d+[a-z]?$/i.test(t));
      if (!terms.length) return html;
      const re = new RegExp(`(${terms.map((t) => escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![^<]*>)`, 'gi');
      return html.replace(re, '<mark>$1</mark>');
    }

    // Absätze: „(1) …“, Aufzählungen „1. …“ / „a) …“, sonst Fließtext
    function absatzHtml(raw, noLink) {
      const depth = raw.length - raw.replace(/^\t+/, '').length;
      const line = raw.slice(depth);
      const abs = line.match(/^(\(\d+[a-z]?\))\s+([\s\S]*)$/);
      if (abs) return `<div class="abs"><span class="an">${abs[1]}</span><p>${textHtml(abs[2], noLink)}</p></div>`;
      const item = line.match(/^(\d+[a-z]?\.|[a-z]{1,2}\)|[a-z]{2}\)|[ivx]+\))\s+([\s\S]*)$/);
      if (item) return `<div class="abs item d${Math.max(depth, 1)}"><span class="an">${escapeHtml(item[1])}</span><p>${textHtml(item[2], noLink)}</p></div>`;
      return `<div class="abs plain${depth ? ` d${depth}` : ''}"><p>${textHtml(line, noLink)}</p></div>`;
    }

    // Unter einer Aufzählung wie „aus dem Strafgesetzbuch:“ (mit Doppelpunkt) beziehen sich die §-Angaben auf das andere Gesetz → nicht verlinken
    const EXTERNAL_HEAD = /\b(?:aus|nach|gemäß|im|des|der|dem)\s+(?:dem\s+|der\s+)?[A-ZÄÖÜ][\wäöüß-]*(?:gesetz(?:es|buch(?:es)?)?|buch|ordnung|verordnung)\b[^:]*:$/;
    function linesHtml(lines) {
      let extDepth = -1;     // Einrückung der Zeile, unter der alles extern ist
      return lines.map((raw) => {
        const depth = raw.length - raw.replace(/^\t+/, '').length;
        if (extDepth >= 0 && depth <= extDepth) extDepth = -1;
        const external = extDepth < 0 && depth > 0 && (EXTERNAL_HEAD.test(raw.trim()) || /^(?:\S+\s+)?aus (?:dem|der) [A-ZÄÖÜ]/.test(raw.trim()));
        const html = absatzHtml(raw, extDepth >= 0 || external);
        if (external) extDepth = depth;
        return html;
      }).join('');
    }

    // --- Gliederung ----------------------------------------------------------
    function tocHtml() {
      let html = '';
      let group = null;      // aktueller Abschnitt (Ebene 1)
      let open = true;
      for (const item of law.items) {
        if (item.type === 'head' && item.level === 1) {
          group = `${item.label}`;
          open = openGroups.has(group);
          html += `<button type="button" class="toc-group" data-group="${escapeHtml(group)}" aria-expanded="${open}"><span class="chev" aria-hidden="true">▸</span><span>${escapeHtml(item.label)} · ${escapeHtml(lt(item))}</span></button>`;
        } else if (!open) {
          continue;
        } else if (item.type === 'head') {
          html += `<div class="toc-sub l${item.level}">${escapeHtml([item.label, item.title].filter(Boolean).join(' · '))}</div>`;
        } else if (isLettered(item)) {
          continue;
        } else {
          html += `<button type="button" class="toc-par" data-num="${item.num}" ${current && current.num === item.num ? 'aria-current="true"' : ''}><span class="n">${U()} ${item.num}</span><span>${escapeHtml(lt(item))}</span></button>`;
        }
      }
      return html;
    }

    function groupOf(num) {
      let group = null;
      for (const item of law.items) {
        if (item.type === 'head' && item.level === 1) group = item.label;
        if (item.type === 'par' && item.num === num) return group;
      }
      return null;
    }

    // --- Suche ---------------------------------------------------------------
    const norm = (s) => s.toLowerCase();
    function searchHtml(q) {
      const nq = norm(q.trim());
      const numQ = nq.replace(/^(?:§+|art(?:ikel|\.)?)\s*/, '').replace(/\s+/g, '');
      const terms = nq.split(/\s+/).filter(Boolean);
      const hits = [];
      for (const p of pars) {
        const title = norm(p.title);
        const body = norm(p.text.join(' '));
        let score = 0;
        if (p.num === numQ) score = 1000;
        else if (/^\d+[a-z]?$/.test(numQ) && p.num.startsWith(numQ) && /^(?:§|art)?\s*\d/.test(nq)) score = 500;
        else if (terms.every((t) => title.includes(t))) score = 300;
        else if (terms.every((t) => (title + ' ' + body).includes(t))) score = 100;
        if (score) hits.push({ p, score, body });
      }
      hits.sort((a, b) => b.score - a.score || pars.indexOf(a.p) - pars.indexOf(b.p));
      if (!hits.length) return '<p class="muted">Nichts gefunden.</p>';
      const t0 = terms.find((t) => t.length > 1 && !/^§/.test(t));
      return `<p class="muted" style="margin:.2rem 0 .5rem">${hits.length} Treffer</p>` + hits.slice(0, 40).map(({ p, body }) => {
        let snip = '';
        const i = t0 ? body.indexOf(t0) : -1;
        if (i >= 0 && !norm(p.title).includes(t0)) {
          const text = p.text.join(' ');
          snip = `<span class="snip">…${highlight(escapeHtml(text.slice(Math.max(0, i - 50), i + 90)))}…</span>`;
        }
        return `<button type="button" class="toc-hit" data-num="${p.num}"><span class="t">${U()} ${p.num} ${highlight(escapeHtml(lt(p)))}</span>${snip}</button>`;
      }).join('');
    }

    // --- Anzeige -------------------------------------------------------------
    function renderToc() {
      $('#toc').innerHTML = query.trim() ? searchHtml(query) : tocHtml();
    }

    function crumbOf(num) {
      const trail = [];
      for (const item of law.items) {
        if (item.type === 'head') { trail.length = Math.min(trail.length, item.level - 1); trail[item.level - 1] = [item.label, item.title].filter(Boolean).join(' · '); }
        if (item.type === 'par' && item.num === num) break;
      }
      return trail.filter(Boolean).join(' › ');
    }

    function intro() {
      return `<div class="law-intro">
        <h2>${escapeHtml(law.short)}</h2>
        <p class="muted">${escapeHtml(law.title)}</p>
        <dl>
          <dt>Fassung</dt><dd>${escapeHtml(law.version || `gültig ab ${law.validFrom || '–'}`)}</dd>
          ${(law.hints || []).map((h) => `<dt>Hinweis</dt><dd>${escapeHtml(h)}</dd>`).join('')}
          <dt>Umfang</dt><dd>${pars.length} ${U() === "§" ? "Paragraphen" : "Artikel"}</dd>
          ${law.citation ? `<dt>Vollzitat</dt><dd>${escapeHtml(law.citation)}</dd>` : ''}
          <dt>Quelle</dt><dd><a href="${escapeHtml(law.source)}" target="_blank" rel="noopener">${escapeHtml(new URL(law.source).hostname.replace(/^www\./, ''))}</a> (amtlich)</dd>
        </dl>
        <p class="law-keys">Tipp: <kbd>/</kbd> sucht, <kbd>←</kbd> <kbd>→</kbd> blättern. Verweise wie „§ 8“ im Text sind anklickbar.</p>
      </div>`;
    }

    // Übersicht: je Zehnerblock eine Reihe (1–9, 10–19, 20–29 …); Paragraphen mit Buchstaben (12a) stehen nur auf der Seite ihres Paragraphen
    const baseOf = (num) => num.replace(/[a-z]+$/, '');
    const isLettered = (p) => /[a-z]$/.test(p.num);
    function gridHtml() {
      const slots = new Map();   // Zahl → { main, subs[] }
      for (const p of pars) {
        const n = Number(baseOf(p.num));
        if (!slots.has(n)) slots.set(n, { main: null, subs: [] });
        if (isLettered(p)) slots.get(n).subs.push(p); else slots.get(n).main = p;
      }
      const nums = [...slots.keys()];
      const first = Math.floor(Math.min(...nums) / 10);
      const last = Math.floor(Math.max(...nums) / 10);
      const cur = current ? baseOf(current.num) : null;
      let html = '';
      for (let row = first; row <= last; row++) {
        let tiles = '';
        for (let col = 0; col < 10; col++) {
          const n = row * 10 + col;
          const slot = slots.get(n);
          const target = slot && (slot.main || slot.subs[0]);
          tiles += target
            ? `<button type="button" class="num-tile" data-num="${target.num}" title="${U()} ${target.num} ${escapeHtml(lt(target))}" ${cur === String(n) ? 'aria-current="true"' : ''}>${n}</button>`
            : `<span class="num-tile empty" aria-hidden="true">${n === 0 ? '' : n}</span>`;
        }
        html += `<div class="num-row"><div class="num-row-label">${row === 0 ? '1–9' : `${row * 10}–${row * 10 + 9}`}</div><div class="num-tiles">${tiles}</div></div>`;
      }
      return `<div class="num-grid">${html}</div>`;
    }

    // Zusammengehörige Paragraphen (12, 12a, 12b …) als Chips auf der Seite des Paragraphen
    function relatedHtml(p) {
      const base = baseOf(p.num);
      const group = pars.filter((x) => baseOf(x.num) === base);
      if (group.length < 2) return '';
      return `<div class="related"><span>Dazu gehören:</span>${group.map((x) => `<button type="button" data-num="${x.num}" title="${escapeHtml(lt(x))}" ${x.num === p.num ? 'aria-current="true"' : ''}>${U()} ${x.num}</button>`).join('')}</div>`;
    }

    const isMobile = () => matchMedia('(max-width: 860px)').matches;
    const tocOpen = () => $('#layout').classList.contains(isMobile() ? 'mobile-toc' : 'side-open');

    function viewsHtml() {
      return `<div class="law-views">
        <button type="button" data-view="grid" aria-pressed="${pane === 'grid'}">▦ Übersicht</button>
        <button type="button" data-view="toc" aria-pressed="${tocOpen()}">☰ Inhaltsverzeichnis</button>
      </div>`;
    }

    // Formvorschriften: Sätze mit Schriftform, Begründung, Belehrung/Benachrichtigung, Dokumentation, Anordnungsvorbehalten – Wortlaut unverändert aus dem Gesetz
    const FORM_LAWS = ['polg-nrw', 'pog-nrw'];
    const FORM_CATS = [
      ['✍️ Schriftform und Textform', /schriftlich|Schriftform|Textform|in elektronischer Form/i, /schriftlich\w*|Schriftform|Textform|elektronischer Form/gi],
      ['📝 Begründung und notwendiger Inhalt', /zu begründen|Begründung|ist\w* .{0,25}begründet|anzugeben|zu bezeichnen/i, /zu begründen|Begründung|begründet\w*|anzugeben|zu bezeichnen/gi],
      ['📣 Belehrung, Unterrichtung und Benachrichtigung', /belehr|zu unterrichten|unterrichtet|benachrichtig|bekannt ?zu ?geben|bekanntzugeben|aushändig|Abschrift/i, /belehr\w*|unterricht\w*|benachrichtig\w*|bekannt ?zu ?geben|bekanntzugeben|aushändig\w*|Abschrift/gi],
      ['🗂️ Dokumentation und Protokollierung', /dokumentier|protokollier|Protokoll|aktenkundig|Niederschrift|aufzuzeichnen|aufgezeichnet/i, /dokumentier\w*|protokollier\w*|Protokoll\w*|aktenkundig|Niederschrift|aufzuzeichnen|aufgezeichnet/gi],
      ['⚖️ Anordnung und Richtervorbehalt', /bedürfen? der Anordnung|Anordnung durch|Anordnung des Gerichts|Anordnung ergeht|richterlich|durch (?:den |die )?Richter|Amtsgericht/i, /bedürfen? der Anordnung|Anordnung durch|Anordnung des Gerichts|Anordnung ergeht|richterlich\w*|Richter\w*|Amtsgericht/gi],
    ];
    const sentences = (t) => t.split(/(?<=[.;:])\s+(?=(?:[A-ZÄÖÜ(]|\d+\.))/).map((x) => x.trim()).filter(Boolean);
    function formHtml(p) {
      if (!FORM_LAWS.includes(law.slug)) return '';
      const groups = FORM_CATS.map(([title, , mark]) => ({ title, mark, items: [] }));
      let abs = '';
      const seen = new Set();
      for (const raw of p.text) {
        const m = raw.match(/^\((\d+[a-z]?)\)/);
        if (m) abs = m[1];
        for (const sent of sentences(raw)) {
          FORM_CATS.forEach(([, test], i) => {
            if (!test.test(sent) || sent.length < 25) return;
            const key = `${i}|${sent}`;
            if (seen.has(key)) return;
            seen.add(key);
            groups[i].items.push({ abs, sent });
          });
        }
      }
      const found = groups.filter((g) => g.items.length);
      if (!found.length) return '';
      const body = found.map((g) => `<h3>${g.title}</h3>` + g.items.map((x) => {
        const sent = escapeHtml(x.sent.length > 420 ? `${x.sent.slice(0, 400).trim()} …` : x.sent).replace(new RegExp(g.mark.source, 'gi'), (w) => `<mark>${w}</mark>`);
        return `<div class="form-item">${x.abs ? `<span class="muted">Abs. ${x.abs}</span>` : ''}<q>${sent}</q></div>`;
      }).join('')).join('');
      return `<details class="form-sec"><summary><strong>📑 Formvorschriften in diesem Paragraphen</strong></summary><p class="muted form-note">Automatisch per Stichwortsuche aus dem Text oben zusammengestellt (Wortlaut unverändert, nicht abschließend).</p>${body}</details>`;
    }

    function renderRead() {
      const box = $('#read');
      if (pane === 'grid' || !current) {
        box.innerHTML = `${viewsHtml()}<h2 class="grid-head">${escapeHtml(law.short)} · ${pars.length} ${U() === "§" ? "Paragraphen" : "Artikel"}</h2><p class="muted" style="margin:0 0 .8rem">${escapeHtml(law.title)} – tippe auf eine Zahl.</p>${gridHtml()}<details class="notes" style="margin-top:1.2rem"><summary>Fassung &amp; Quelle</summary>${intro()}</details>`;
        return;
      }
      const i = pars.indexOf(current);
      const prev = pars[i - 1];
      const next = pars[i + 1];
      box.innerHTML = `
        ${viewsHtml()}
        <div class="par-nav">
          <button type="button" data-num="${prev ? prev.num : ''}" ${prev ? '' : 'disabled'}><span class="small">‹ Vorher</span><span class="tt">${prev ? `${U()} ${prev.num} ${escapeHtml(lt(prev))}` : '–'}</span></button>
          <button type="button" data-num="${next ? next.num : ''}" ${next ? '' : 'disabled'}><span class="small">Weiter ›</span><span class="tt">${next ? `${U()} ${next.num} ${escapeHtml(lt(next))}` : '–'}</span></button>
        </div>
        <div class="law-crumb">${escapeHtml(law.short)} › ${escapeHtml(crumbOf(current.num))}</div>
        <div class="par-head"><span class="par-num">${U()} ${current.num}</span>${current.title ? `<h2 class="par-title">${highlight(escapeHtml(current.title))}</h2>` : ''}<button type="button" class="fav-btn" data-fav aria-pressed="${isFav(law.slug, current.num)}">${isFav(law.slug, current.num) ? '★ Favorit' : '☆ Merken'}</button></div>
        ${relatedHtml(current)}
        ${linesHtml(current.text)}
        ${formHtml(current)}
        ${paraNoteHtml()}
        ${current.notes.length ? `<details class="notes"><summary>Änderungshistorie (${current.notes.length})</summary>${current.notes.map((n) => `<p>${escapeHtml(n)}</p>`).join('')}</details>` : ''}`;
      applyNotes();
    }

    // --- Persönliche Bibliothek: Gesetze ein-/ausblenden und sortieren ---
    function visibleLaws() {
      const rank = (l) => { const i = prefs.order.indexOf(l.slug); return i < 0 ? 1000 + laws.indexOf(l) : i; };
      return laws.filter((l) => !prefs.hidden.includes(l.slug)).sort((a, b) => rank(a) - rank(b));
    }
    function allLawsOrdered() {
      const rank = (l) => { const i = prefs.order.indexOf(l.slug); return i < 0 ? 1000 + laws.indexOf(l) : i; };
      return [...laws].sort((a, b) => rank(a) - rank(b));
    }
    function renderTabs() {
      const cur = law && !favMode ? law.slug : (favMode ? special : null);
      const vis = visibleLaws();
      $('#tabs').innerHTML = `<button type="button" class="law-tab fav" data-slug="__fav" aria-pressed="${cur === '__fav'}">⭐ Favoriten</button><button type="button" class="law-tab fav" data-slug="__notes" aria-pressed="${cur === '__notes'}">📝 Notizen${notes.length ? ` (${notes.length})` : ''}</button>`
        + vis.map((l) => `<button type="button" class="law-tab" data-slug="${l.slug}" aria-pressed="${l.slug === cur}" title="${escapeHtml(l.title)}">${escapeHtml(l.short)}</button>`).join('')
        + `<button type="button" class="law-tab cfg" data-cfg title="Gesetze ein- und ausblenden, Reihenfolge ändern">⚙️ Bibliothek${prefs.hidden.length ? ` (${vis.length}/${laws.length})` : ''}</button>`;
    }
    let prefsTimer = null;
    function savePrefs() {
      clearTimeout(prefsTimer);
      prefsTimer = setTimeout(() => api('/api/gesetze/prefs/me', { method: 'PUT', body: prefs }).catch((err) => { $('#error').textContent = err.message; }), 400);
    }
    function openLibrary() {
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(20,22,50,.5);display:flex;align-items:center;justify-content:center;padding:1rem';
      const body = () => allLawsOrdered().map((l, i, arr) => `<div class="lib-row ${prefs.hidden.includes(l.slug) ? 'off' : ''}">
          <label><input type="checkbox" data-show="${l.slug}" ${prefs.hidden.includes(l.slug) ? '' : 'checked'}><span style="min-width:0"><span class="nm">${escapeHtml(l.short)}</span><br><span class="t">${escapeHtml(l.title)}</span></span></label>
          <button type="button" data-up="${l.slug}" ${i === 0 ? 'disabled' : ''} aria-label="Nach oben">↑</button><button type="button" data-down="${l.slug}" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Nach unten">↓</button></div>`).join('');
      box.innerHTML = `<div class="card" style="width:min(640px,100%);margin:0;max-height:90vh;display:flex;flex-direction:column">
        <h2 style="margin:0 0 .3rem">⚙️ Meine Gesetze-Bibliothek</h2>
        <p class="muted" style="margin:0 0 .6rem">Haken entfernen = Gesetz nicht mehr in der Leiste anzeigen. Mit ↑ ↓ legst du die Reihenfolge fest. Deine Favoriten bleiben immer erhalten.</p>
        <div class="row" style="gap:.5rem;margin-bottom:.4rem"><button type="button" data-all="1">Alle anzeigen</button><button type="button" data-all="0">Alle ausblenden</button></div>
        <div id="lib-list" style="overflow:auto;flex:1;min-height:0">${body()}</div>
        <div class="row" style="justify-content:flex-end;margin-top:.6rem"><button type="button" class="primary" data-done="1">Fertig</button></div></div>`;
      document.body.appendChild(box);
      const redraw = () => { const sc = box.querySelector('#lib-list').scrollTop; box.querySelector('#lib-list').innerHTML = body(); box.querySelector('#lib-list').scrollTop = sc; renderTabs(); savePrefs(); };
      const move = (slug, d) => { const ord = allLawsOrdered().map((l) => l.slug); const i = ord.indexOf(slug); const j = i + d; if (j < 0 || j >= ord.length) return; [ord[i], ord[j]] = [ord[j], ord[i]]; prefs.order = ord; redraw(); };
      box.addEventListener('change', (e) => {
        const c = e.target.closest('[data-show]');
        if (!c) return;
        prefs.hidden = c.checked ? prefs.hidden.filter((x) => x !== c.dataset.show) : [...prefs.hidden, c.dataset.show];
        if (!prefs.order.length) prefs.order = allLawsOrdered().map((l) => l.slug);
        redraw();
      });
      box.addEventListener('click', (e) => {
        if (e.target === box || e.target.closest('[data-done]')) { box.remove(); return; }
        const up = e.target.closest('[data-up]'); const down = e.target.closest('[data-down]'); const all = e.target.closest('[data-all]');
        if (up) move(up.dataset.up, -1); else if (down) move(down.dataset.down, 1);
        else if (all) { prefs.hidden = all.dataset.all === '1' ? [] : laws.map((l) => l.slug); redraw(); }
      });
    }

    // --- Markierungen und Notizen ----------------------------------------------
    const COLOR_NAMES = { yellow: 'Gelb', green: 'Grün', blue: 'Blau', pink: 'Rosa' };
    const notesOf = (slug, num) => notes.filter((n) => n.law === slug && n.num === num);
    const pOf = (i) => document.querySelectorAll('#read .abs > p')[i];

    // Text einer Zeile: Textknoten mit Zeichenpositionen
    function textNodes(p) {
      const out = [];
      const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
      let pos = 0;
      for (let n = w.nextNode(); n; n = w.nextNode()) { out.push({ node: n, from: pos, to: pos + n.data.length }); pos += n.data.length; }
      return out;
    }
    function wrapRange(p, start, end, note) {
      for (const t of textNodes(p).filter((x) => x.to > start && x.from < end).reverse()) {
        const a = Math.max(start, t.from) - t.from;
        const b = Math.min(end, t.to) - t.from;
        let node = t.node;
        if (b < node.data.length) node.splitText(b);
        if (a > 0) node = node.splitText(a);
        const span = document.createElement('span');
        span.className = `hl hl-${note.color}${note.note ? ' has-note' : ''}`;
        span.dataset.nid = note.id;
        node.parentNode.insertBefore(span, node);
        span.appendChild(node);
      }
    }
    // Markierungen nach dem Zeichnen eines Paragraphen einsetzen; stimmt der Wortlaut nicht mehr, wird er per Textsuche wiedergefunden
    function applyNotes() {
      if (!law || !current) return;
      for (const n of notesOf(law.slug, current.num)) {
        if (n.line < 0) continue;
        const p = pOf(n.line);
        if (!p) { n.orphan = true; continue; }
        const text = p.textContent;
        let { start, end } = n;
        if (text.slice(start, end) !== n.quote) {
          const at = text.indexOf(n.quote);
          if (at < 0) { n.orphan = true; continue; }
          start = at; end = at + n.quote.length;
        }
        n.orphan = false;
        wrapRange(p, start, end, n);
      }
    }
    function paraNoteHtml() {
      const n = notesOf(law.slug, current.num).find((x) => x.line < 0);
      const orphans = notesOf(law.slug, current.num).filter((x) => x.line >= 0 && x.orphan);
      return `<div class="par-note"><strong>📝 Meine Notiz zu ${U()} ${escapeHtml(current.num)}</strong> <span class="muted" id="pn-state"></span>
        <textarea id="pn-text" placeholder="Eigene Merksätze, Beispiele, Fälle …" rows="3">${escapeHtml(n ? n.note : '')}</textarea>
        ${orphans.length ? `<p class="muted" style="margin:.5rem 0 0">Diese Markierungen finde ich im Text nicht mehr (Gesetz geändert): ${orphans.map((o) => `„${escapeHtml(o.quote.slice(0, 40))}“`).join(', ')}</p>` : ''}</div>`;
    }
    let pnTimer = null;
    async function savePara(text) {
      const existing = notesOf(law.slug, current.num).find((x) => x.line < 0);
      $('#pn-state') && ($('#pn-state').textContent = 'speichert …');
      try {
        if (existing && !text.trim()) { await api(`/api/gesetze/notes/${existing.id}`, { method: 'DELETE' }); notes = notes.filter((x) => x !== existing); }
        else if (existing) { await api(`/api/gesetze/notes/${existing.id}`, { method: 'PATCH', body: { note: text } }); existing.note = text; }
        else if (text.trim()) { const { id } = await api('/api/gesetze/notes', { method: 'POST', body: { law: law.slug, num: current.num, line: -1, note: text } }); notes.push({ id, law: law.slug, num: current.num, line: -1, start: 0, end: 0, quote: '', color: 'yellow', note: text }); }
        $('#pn-state') && ($('#pn-state').textContent = '✓ gespeichert');
        renderTabs();
      } catch (err) { $('#pn-state') && ($('#pn-state').textContent = ''); $('#error').textContent = err.message; }
    }

    // Auswahl im Text → Leiste zum Markieren
    let selBar = null;
    function hideSelBar() { if (selBar) { selBar.remove(); selBar = null; } }
    function currentSelection() {
      const sel = getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
      const r = sel.getRangeAt(0);
      const startP = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest('#read .abs > p');
      const endP = (r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement).closest('#read .abs > p');
      if (!startP || startP !== endP) return null;      // eine Markierung gehört in eine Zeile (Absatz/Punkt)
      const pre = document.createRange();
      pre.selectNodeContents(startP);
      pre.setEnd(r.startContainer, r.startOffset);
      const start = pre.toString().length;
      const quote = r.toString();
      if (!quote.trim()) return null;
      const lead = quote.length - quote.trimStart().length;
      const trimmed = quote.trim();
      const line = [...document.querySelectorAll('#read .abs > p')].indexOf(startP);
      return { line, start: start + lead, end: start + lead + trimmed.length, quote: trimmed, rect: r.getBoundingClientRect() };
    }
    function showSelBar() {
      if (!law || !current || pane !== 'read') return hideSelBar();
      const s = currentSelection();
      if (!s) return hideSelBar();
      if (!selBar) {
        selBar = document.createElement('div');
        selBar.className = 'sel-bar';
        selBar.innerHTML = Object.keys(COLOR_NAMES).map((c) => `<button type="button" class="c-${c}" data-hl="${c}" aria-label="${COLOR_NAMES[c]} markieren"></button>`).join('') + '<button type="button" class="sb-note" data-hl-note="1">📝 Notiz</button>';
        selBar.addEventListener('pointerdown', (e) => e.preventDefault());     // Auswahl bleibt bestehen
        selBar.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          const sel = currentSelection();
          if (!sel) return hideSelBar();
          addHighlight(sel, b.dataset.hl || 'yellow', Boolean(b.dataset.hlNote));
        });
        document.body.appendChild(selBar);
      }
      const w = selBar.offsetWidth || 220;
      selBar.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, s.rect.left + s.rect.width / 2 - w / 2))}px`;
      selBar.style.top = `${Math.min(innerHeight - 56, s.rect.bottom + 10)}px`;
    }
    async function addHighlight(sel, color, withNote) {
      hideSelBar();
      getSelection().removeAllRanges();
      try {
        const body = { law: law.slug, num: current.num, line: sel.line, start: sel.start, end: sel.end, quote: sel.quote, color };
        const { id } = await api('/api/gesetze/notes', { method: 'POST', body });
        const n = { id, law: law.slug, num: current.num, line: sel.line, start: sel.start, end: sel.end, quote: sel.quote, color, note: '' };
        notes.push(n);
        renderRead(); renderTabs();
        if (withNote) openNoteEditor(n.id);
      } catch (err) { $('#error').textContent = err.message; }
    }
    // Popover zu einer Markierung: Farbe, Notiz, Löschen
    function openNoteEditor(id) {
      const n = notes.find((x) => x.id === Number(id));
      const el = document.querySelector(`#read .hl[data-nid="${id}"]`) || document.querySelector(`[data-edit-note="${id}"]`);
      if (!n || !el) return;
      document.querySelectorAll('.hl-pop').forEach((x) => x.remove());
      const pop = document.createElement('div');
      pop.className = 'sel-bar hl-pop';
      pop.style.cssText = 'flex-direction:column;align-items:stretch;border-radius:16px;width:min(340px,calc(100vw - 16px));padding:.6rem';
      pop.innerHTML = `<div class="row" style="gap:.35rem;flex-wrap:nowrap">${Object.keys(COLOR_NAMES).map((c) => `<button type="button" class="c-${c}" data-c="${c}" aria-label="${COLOR_NAMES[c]}" style="${n.color === c ? 'box-shadow:0 0 0 3px var(--primary)' : ''}"></button>`).join('')}<span style="flex:1"></span><button type="button" data-del style="width:auto;padding:0 .6rem;border-radius:999px;font-size:.9rem">🗑 Löschen</button></div>
        <textarea rows="3" placeholder="Notiz zu dieser Stelle …" style="width:100%;margin:.5rem 0 0">${escapeHtml(n.note)}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:.4rem"><button type="button" data-ok style="width:auto;padding:0 .8rem;border-radius:999px;border:0;background:var(--primary-grad);color:#fff;font-weight:800">Fertig</button></div>`;
      document.body.appendChild(pop);
      const r = el.getBoundingClientRect();
      pop.style.left = `${Math.max(8, Math.min(innerWidth - pop.offsetWidth - 8, r.left))}px`;
      pop.style.top = `${Math.min(innerHeight - pop.offsetHeight - 8, r.bottom + 8)}px`;
      const ta = pop.querySelector('textarea');
      const close = async () => {
        const text = ta.value;
        pop.remove();
        if (text !== n.note) { try { await api(`/api/gesetze/notes/${n.id}`, { method: 'PATCH', body: { note: text } }); n.note = text; } catch (err) { $('#error').textContent = err.message; } }
        if (favMode) renderNotes(); else renderRead();
      };
      pop.addEventListener('pointerdown', (e) => { if (!e.target.closest('textarea')) e.preventDefault(); });
      pop.addEventListener('click', async (e) => {
        const c = e.target.closest('[data-c]');
        if (c) { n.color = c.dataset.c; api(`/api/gesetze/notes/${n.id}`, { method: 'PATCH', body: { color: n.color } }).catch(() => {}); pop.querySelectorAll('[data-c]').forEach((b) => { b.style.boxShadow = b.dataset.c === n.color ? '0 0 0 3px var(--primary)' : ''; }); document.querySelectorAll(`.hl[data-nid="${n.id}"]`).forEach((h) => { h.className = `hl hl-${n.color}${n.note ? ' has-note' : ''}`; }); return; }
        if (e.target.closest('[data-del]')) { pop.remove(); await api(`/api/gesetze/notes/${n.id}`, { method: 'DELETE' }).catch(() => {}); notes = notes.filter((x) => x !== n); renderTabs(); if (favMode) renderNotes(); else renderRead(); return; }
        if (e.target.closest('[data-ok]')) close();
      });
      setTimeout(() => ta.focus(), 0);
    }
    document.addEventListener('selectionchange', () => { clearTimeout(showSelBar.t); showSelBar.t = setTimeout(showSelBar, 250); });
    window.addEventListener('scroll', () => { if (selBar) showSelBar(); }, { passive: true });
    document.addEventListener('click', (e) => {
      const en = e.target.closest('[data-edit-note]');
      if (en) { openNoteEditor(en.dataset.editNote); return; }
      const h = e.target.closest('#read .hl');
      if (h && !(getSelection() && !getSelection().isCollapsed)) { e.preventDefault(); openNoteEditor(h.dataset.nid); return; }
      if (!e.target.closest('.hl-pop') && !e.target.closest('.sel-bar')) document.querySelectorAll('.hl-pop').forEach((x) => x.remove());
    }, true);
    document.addEventListener('input', (e) => {
      if (e.target.id === 'pn-text') { clearTimeout(pnTimer); const v = e.target.value; pnTimer = setTimeout(() => savePara(v), 800); }
    });

    // Übersicht „Notizen“
    function renderNotes() {
      const box = $('#favs');
      const order = laws.map((l) => l.slug);
      const groups = order.map((slug) => ({ l: laws.find((x) => x.slug === slug), items: notes.filter((n) => n.law === slug) })).filter((g) => g.items.length);
      const byNum = (a, b) => parseInt(a.num, 10) - parseInt(b.num, 10) || a.num.localeCompare(b.num) || a.line - b.line || a.start - b.start;
      box.innerHTML = `<h2 style="margin:0 0 .3rem">📝 Meine Notizen und Markierungen</h2>
        <p class="muted" style="margin:0 0 .6rem">${notes.length ? `${notes.length} Einträge – tippe auf einen Paragraphen, um ihn zu öffnen. Nur du siehst sie.` : 'Noch nichts markiert. Wähle im Gesetzestext ein paar Wörter aus und tippe auf eine Farbe – oder schreibe unter dem Paragraphen eine Notiz.'}</p>`
        + groups.map((g) => `<h3 class="fav-law">${escapeHtml(g.l.short)}</h3>` + [...g.items].sort(byNum).map((n) => `<div class="note-row">
            <a class="go" href="#${n.law}/${n.num}" data-open-fav="${n.law}/${n.num}">${g.l.short === 'GG' ? 'Art.' : '§'} ${escapeHtml(n.num)}</a>
            ${n.line >= 0 ? `<span class="q hl-${n.color}" data-edit-note="${n.id}" style="cursor:pointer">${escapeHtml(n.quote)}</span>` : '<span class="muted">Notiz zum Paragraphen</span>'}
            ${n.note ? `<div style="margin-top:.3rem;white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(n.note)}</div>` : ''}
          </div>`).join('')).join('');
    }
    function openNotes() {
      favMode = true;
      special = '__notes';
      $('#layout').hidden = true;
      $('#favs').hidden = false;
      renderTabs();
      history.replaceState(null, '', '#notizen');
      renderNotes();
    }

    const isFav = (slug, num) => favs.some((f) => f.law === slug && f.num === num);
    async function toggleFav(slug, num, title) {
      const was = isFav(slug, num);
      favs = was ? favs.filter((f) => !(f.law === slug && f.num === num)) : [{ law: slug, num, title }, ...favs];
      if (favMode) renderFavs(); else renderRead();
      try {
        await api(`/api/gesetze/favorites/${slug}/${num}`, was ? { method: 'DELETE' } : { method: 'PUT', body: { title } });
      } catch (err) {
        favs = was ? [{ law: slug, num, title }, ...favs] : favs.filter((f) => !(f.law === slug && f.num === num));
        if (favMode) renderFavs(); else renderRead();
        $('#error').textContent = err.message;
      }
    }

    function renderFavs() {
      const box = $('#favs');
      const order = laws.map((l) => l.slug);
      const byLaw = order.map((slug) => ({ l: laws.find((x) => x.slug === slug), items: favs.filter((f) => f.law === slug).sort((a, b) => parseInt(a.num, 10) - parseInt(b.num, 10) || a.num.localeCompare(b.num)) })).filter((g) => g.items.length);
      box.innerHTML = `<h2 style="margin:0 0 .3rem">⭐ Meine Favoriten</h2><p class="muted" style="margin:0 0 .6rem">${favs.length ? `${favs.length} markiert – tippe auf einen Eintrag, um ihn zu lesen.` : 'Noch nichts markiert. Öffne einen Paragraphen und tippe auf „☆ Merken“.'}</p>`
        + byLaw.map((g) => `<h3 class="fav-law">${escapeHtml(g.l.short)} <span class="muted">· ${escapeHtml(g.l.title)}</span></h3>`
          + g.items.map((f) => `<div class="fav-row"><a href="#${f.law}/${f.num}" data-open-fav="${f.law}/${f.num}"><b>${g.l.short === 'GG' ? 'Art.' : '§'} ${escapeHtml(f.num)}</b>${escapeHtml(f.title)}</a><button type="button" data-unfav="${f.law}/${f.num}" title="Aus Favoriten entfernen" aria-label="Aus Favoriten entfernen">★</button></div>`).join('')).join('');
    }
    function openFavs() {
      favMode = true;
      special = '__fav';
      $('#layout').hidden = true;
      $('#favs').hidden = false;
      renderTabs();
      history.replaceState(null, '', '#favoriten');
      renderFavs();
    }

    function show(num, { push = true, scroll = true } = {}) {
      const p = byNum.get(num);
      if (!p) return;
      current = p;
      store.set(`law:${law.slug}`, num);
      const g = groupOf(num);
      if (g) openGroups.add(g);
      if (push && location.hash !== `#${law.slug}/${num}`) history.replaceState(null, '', `#${law.slug}/${num}`);
      pane = 'read';
      $('#layout').classList.remove('mobile-toc');
      renderRead();
      renderToc();
      if (scroll) window.scrollTo({ top: 0 });
      const cur = $('#toc [aria-current]');
      if (cur && !query.trim()) cur.scrollIntoView({ block: 'nearest' });
    }

    function showView(view) {
      if (view === 'grid') {
        pane = 'grid';
        $('#layout').classList.remove('mobile-toc');
        renderRead();
        window.scrollTo({ top: 0 });
        history.replaceState(null, '', `#${law.slug}`);
      } else {
        const cls = isMobile() ? 'mobile-toc' : 'side-open';
        $('#layout').classList.toggle(cls);
        renderToc();
        renderRead();
        const cur = $('#toc [aria-current]');
        if (cur && tocOpen()) cur.scrollIntoView({ block: 'center' });
      }
    }

    async function openLaw(slug, num) {
      $('#error').textContent = '';
      favMode = false;
      $('#favs').hidden = true;
      if (!cache.has(slug)) cache.set(slug, await api(`/api/gesetze/${slug}`));
      law = cache.get(slug);
      pars = law.items.filter((i) => i.type === 'par');
      buildOtherLaw();
      buildRef();
      for (const p of pars) if (!p.title && !p.lt) { const t = (p.text[0] || '').replace(/^\(\d+[a-z]?\)\s*/, ''); p.lt = t.length > 60 ? `${t.slice(0, 58).trim()}…` : t; }
      byNum = new Map(pars.map((p) => [p.num, p]));
      current = null;
      pane = 'grid';
      query = '';
      $('#search').value = '';
      store.set('law:last', slug);
      renderTabs();
      $('#layout').hidden = false;
      $('#layout').classList.remove('mobile-toc');
      renderToc();
      renderRead();
      if (num && byNum.has(num)) show(num, { scroll: false });
      history.replaceState(null, '', num && byNum.has(num) ? `#${slug}/${num}` : `#${slug}`);
    }

    // --- Ereignisse ----------------------------------------------------------
    document.addEventListener('click', async (e) => {
      const unfav = e.target.closest('[data-unfav]');
      if (unfav) { const [slug, num] = unfav.dataset.unfav.split('/'); toggleFav(slug, num, ''); return; }
      const openFav = e.target.closest('[data-open-fav]');
      if (openFav) { e.preventDefault(); const [slug, num] = openFav.dataset.openFav.split('/'); openLaw(slug, num).catch((err) => { $('#error').textContent = err.message; }); return; }
      if (law && e.target.closest('[data-fav]')) { toggleFav(law.slug, current.num, lt(current)); return; }
      if (!law) return;
      const group = e.target.closest('.toc-group');
      if (group) {
        const key = group.dataset.group;
        if (openGroups.has(key)) openGroups.delete(key); else openGroups.add(key);
        renderToc();
        return;
      }
      const ref = e.target.closest('a.ref, a.ref-head');
      if (ref) { e.preventDefault(); query = ''; $('#search').value = ''; show(ref.dataset.go); return; }
      const hit = e.target.closest('[data-num]');
      if (hit && hit.dataset.num) { show(hit.dataset.num); return; }
      const view = e.target.closest('[data-view]');
      if (view) showView(view.dataset.view);
    });

    $('#search').addEventListener('input', (e) => {
      query = e.target.value;
      renderToc();
      if (current && pane === 'read') renderRead();
    });
    $('#search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const first = $('#toc .toc-hit'); if (first) show(first.dataset.num); e.target.blur(); }
      if (e.key === 'Escape') { e.target.value = ''; query = ''; renderToc(); e.target.blur(); }
    });
    document.addEventListener('keydown', (e) => {
      if (!law || e.metaKey || e.ctrlKey || e.altKey) return;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === '/' && !typing) { e.preventDefault(); if (!tocOpen()) showView('toc'); $('#search').focus(); return; }
      if (typing || !current || pane !== 'read') return;
      const i = pars.indexOf(current);
      if (e.key === 'ArrowLeft' && pars[i - 1]) show(pars[i - 1].num);
      if (e.key === 'ArrowRight' && pars[i + 1]) show(pars[i + 1].num);
    });
    window.addEventListener('hashchange', () => {
      const [slug, num] = location.hash.slice(1).split('/');
      if (slug && law && slug === law.slug) { if (num && byNum.has(num) && (!current || current.num !== num)) show(num, { push: false }); }
      else if (slug === 'favoriten') openFavs();
      else if (slug === 'notizen') openNotes();
      else if (slug && laws.some((l) => l.slug === slug)) openLaw(slug, num);
    });

    requireLogin().then(async (me) => {
      mountNav('profile', me);
      noAutoFocus($('#search'));
      try {
        laws = await api('/api/gesetze');
        favs = await api('/api/gesetze/favorites/all').catch(() => []);
        notes = await api('/api/gesetze/notes/all').catch(() => []);
        prefs = await api('/api/gesetze/prefs/me').catch(() => ({ hidden: [], order: [] }));
        renderTabs();
        $('#tabs').addEventListener('click', (e) => {
          if (e.target.closest('[data-cfg]')) { openLibrary(); return; }
          const b = e.target.closest('.law-tab');
          if (b) (b.dataset.slug === '__fav' ? Promise.resolve(openFavs()) : b.dataset.slug === '__notes' ? Promise.resolve(openNotes()) : openLaw(b.dataset.slug)).catch((err) => { $('#error').textContent = err.message; });
        });
        const [hs, hn] = location.hash.slice(1).split('/');
        const vis = visibleLaws();
        const slug = laws.some((l) => l.slug === hs) ? hs : (vis.some((l) => l.slug === store.get('law:last')) ? store.get('law:last') : (vis[0] || laws[0]).slug);
        if (hs === 'favoriten') openFavs(); else if (hs === 'notizen') openNotes(); else await openLaw(slug, hn && hs === slug ? hn : null);
      } catch (err) {
        $('#error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
