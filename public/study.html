<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Lernen</title>
  <link rel="stylesheet" href="/style.css?v=11">
</head>
<body>
  <header class="top">
    <a class="brand brand-logo" href="/dashboard" aria-label="Quiz – Startseite"><img src="/icons/logo.svg" alt="" width="32" height="32"></a>
    <strong>Lernen</strong>
    <span id="me"></span>
  </header>
  <main>
    <div id="battles"></div>

    <div class="row spread section-head">
      <h2>Meine Lernsets</h2>
      <a class="btn primary" href="/study-edit">+ Neues Lernset</a>
    </div>
    <p class="error" id="error"></p>
    <div class="recent-list" id="mine"></div>

    <div class="section-head" style="margin-top:2rem"><h2>Von anderen geteilt</h2></div>
    <div class="recent-list" id="shared"></div>
  </main>
  <button type="button" class="fab" id="fab-battle" aria-label="Battle starten" title="Battle starten"><span aria-hidden="true">⚔️</span><span class="fab-label">Battle</span></button>
  <div class="changelog-backdrop" id="duel" hidden>
    <div class="changelog card" role="dialog" aria-modal="true" aria-labelledby="duel-title">
      <button type="button" class="changelog-x" id="duel-close" aria-label="Schließen">✕</button>
      <h2 id="duel-title">⚔️ Battle starten</h2>
      <form id="duel-form">
        <label id="duel-friend-label">Gegen wen?</label>
        <div id="duel-friend-box"></div>
        <label for="duel-set">Welches Lernset?</label>
        <select id="duel-set"></select>
        <label>Spielmodus</label>
        <div class="mode-pick" id="duel-mode" role="radiogroup" aria-label="Spielmodus">
          <button type="button" role="radio" aria-checked="true" data-mode="cloze"><strong>✏️ Lückentext</strong><span class="muted">Ihr füllt gleichzeitig dieselben Lücken aus – schneller und genauer gewinnt.</span></button>
        </div>
        <p class="error" id="duel-error"></p>
        <button class="primary" type="submit" id="duel-go" style="width:100%" disabled>Herausfordern</button>
      </form>
    </div>
  </div>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const nf = (n) => n.toLocaleString('de-DE');

    function rowHtml(s) {
      const learned = s.card_count ? (s.mastered_count / s.card_count) * 100 : 0;
      return `
        <div class="recent-row">
          <span class="subject-icon" aria-hidden="true">${s.subject_icon || '📘'}</span>
          <div>
            <div class="recent-title">${escapeHtml(s.title)}</div>
            <span class="muted">${nf(s.card_count)} ${s.card_count === 1 ? 'Karte' : 'Karten'}</span>
            ${s.subject ? `<span class="tag">${escapeHtml(s.subject)}</span>` : ''}
            ${s.copyId ? '<span class="tag">🔄 Update verfügbar</span>' : ''}
            ${s.isOwner ? (s.is_public ? '<span class="tag">🌍 Geteilt</span>' : '<span class="tag">🔒 Privat</span>') : s.mine ? `<span class="tag">🤝 von ${escapeHtml(s.owner)}</span>` : `<span class="tag">von ${escapeHtml(s.owner)}</span>`}
            <div class="set-meter" title="Gelernt = in mindestens Box 3 des Karteikasten-Systems">
              <div class="stat-bar"><span style="width:${learned}%"></span></div>
              <span class="muted">${nf(s.mastered_count)}/${nf(s.card_count)} gelernt${s.due_count ? ` · ${nf(s.due_count)} fällig` : ''}</span>
            </div>
          </div>
          <div class="recent-meta">
            <a class="btn primary" href="/learn?id=${s.id}">Lernen</a>
            ${s.mine
              ? `<a class="btn" href="/study-edit?id=${s.id}">Bearbeiten</a>
                 ${s.isOwner ? `<button class="danger" type="button" data-delete="${s.id}">Löschen</button>` : ''}`
              : s.copyId
                ? `<a class="btn" href="/learn?id=${s.copyId}">Meine Kopie</a><button type="button" class="primary" data-sync="${s.copyId}" data-title="${escapeHtml(s.title)}">🔄 Kopie aktualisieren</button>`
                : `<button type="button" data-copy="${s.id}">Kopieren</button>`}
          </div>
        </div>`;
    }

    async function load() {
      const { mine, shared } = await api('/api/study');
      allSets = mine;   // Battle nur mit eigenen Lernsets (auch gemeinsam bearbeitete), nicht mit fremden geteilten
      $('#mine').innerHTML = mine.length ? mine.map(rowHtml).join('')
        : `<div class="card muted"><strong>Noch kein Lernset.</strong><br>Lege Begriffe mit ihren Definitionen an
           und lerne sie als Karteikarten, Lückentext oder aus dem Kopf. Du kannst Definitionen aus deinem Skript einfach einfügen.</div>`;
      $('#shared').innerHTML = shared.length ? shared.map(rowHtml).join('')
        : '<div class="card muted">Keine weiteren geteilten Lernsets – was du schon kopiert hast, findest du oben bei „Meine Lernsets“.</div>';
    }

    // --- Battle: Übersicht und Herausfordern ---
    async function loadBattles() {
      let b;
      try { b = await api('/api/battles'); } catch { return; }
      const row = (x, right) => `<div class="friend-row">${profileLink(x.opponent, avatarHtml(x.opponent, '2.2rem'))}<div class="friend-name">${profileLink(x.opponent, `<strong>${escapeHtml(x.opponent)}</strong>`)} <span class="muted">· ${escapeHtml(x.setTitle)}</span></div><div class="row">${right}</div></div>`;
      const parts = [];
      if (b.invites.length) parts.push(`<h3>Herausforderungen an dich</h3>${b.invites.map((x) => row(x, `<a class="btn primary" href="/battle?id=${x.id}">Ansehen</a>`)).join('')}`);
      if (b.active.length) parts.push(`<h3>Läuft gerade</h3>${b.active.map((x) => row(x, `<a class="btn primary" href="/battle?id=${x.id}">Weiterspielen</a>`)).join('')}`);
      if (b.waiting.length) parts.push(`<h3>Wartet auf Antwort</h3>${b.waiting.map((x) => row(x, `<a class="btn" href="/battle?id=${x.id}">Öffnen</a>`)).join('')}`);
      if (b.recent.length) parts.push(`<h3>Letzte Battles</h3>${b.recent.map((x) => row(x, `<span class="tag">${{ win: '🏆 Sieg', loss: 'Niederlage', draw: '🤝 Remis' }[x.result]} ${nf(x.myScore)}:${nf(x.theirScore)}</span>`)).join('')}`);
      $('#battles').innerHTML = parts.length ? `<div class="card"><h2 style="margin-bottom:.4rem">⚔️ Battle</h2>${parts.join('')}</div>` : '';
    }

    // --- Battle starten: Spieler, Lernset und Spielmodus im Menü wählen ---
    let allSets = [];
    let duelFriends = null;
    let duelPick = null;       // gewählter Gegner
    let duelSetsOk = false;
    const battleSets = () => allSets.filter((x) => x.card_count >= 3);
    async function openDuel() {
      $('#duel-error').textContent = '';
      $('#duel').hidden = false;
      const sets = battleSets();
      $('#duel-set').innerHTML = sets.length
        ? sets.map((x) => `<option value="${x.id}">${escapeHtml(x.title)} (${nf(x.card_count)} Karten)</option>`).join('')
        : '<option value="">Du hast noch kein eigenes Lernset mit mindestens 3 Karten</option>';
      if (!duelFriends) {
        $('#duel-friend-box').innerHTML = '<span class="muted">Lade Freunde …</span>';
        try { duelFriends = (await api('/api/friends')).friends; } catch (err) { $('#duel-friend-box').innerHTML = ''; $('#duel-error').textContent = err.message; return; }
      }
      duelPick = null;
      $('#duel-friend-box').innerHTML = duelFriends.length
        ? `<div class="player-pick" role="radiogroup" aria-labelledby="duel-friend-label">${duelFriends.map((f) => `
            <button type="button" role="radio" aria-checked="false" data-friend="${escapeHtml(f.username)}">
              ${avatarHtml(f.username, '3.4rem')}
              <span class="pp-name">${escapeHtml(f.username)}</span>
              <span class="muted pp-code">${escapeHtml(f.code)}</span>
              <span class="pp-check" aria-hidden="true">✓</span>
            </button>`).join('')}</div>`
        : '<p class="muted" style="margin:0">Du hast noch keine Freunde. <a href="/friends">Freunde hinzufügen →</a></p>';
      $('#duel-go').disabled = true;
      duelSetsOk = sets.length > 0;
    }
    $('#fab-battle').onclick = openDuel;
    $('#duel-friend-box').addEventListener('click', (e) => {
      const b = e.target.closest('[data-friend]');
      if (!b) return;
      duelPick = b.dataset.friend;
      document.querySelectorAll('#duel-friend-box [data-friend]').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
      $('#duel-go').disabled = !duelSetsOk;
    });
    $('#duel-close').onclick = () => { $('#duel').hidden = true; };
    $('#duel').addEventListener('click', (e) => { if (e.target === $('#duel')) $('#duel').hidden = true; });
    $('#duel-form').onsubmit = async (e) => {
      e.preventDefault();
      $('#duel-error').textContent = '';
      const friend = duelPick;
      const setId = $('#duel-set').value;
      if (!friend || !setId) return;
      $('#duel-go').disabled = true;
      try {
        const { id } = await api('/api/battles', { method: 'POST', body: { setId, friend, mode: 'cloze' } });
        location.href = `/battle?id=${id}`;
      } catch (err) { $('#duel-error').textContent = err.message; $('#duel-go').disabled = false; }
    };

    document.querySelector('main').onclick = async (e) => {
      const del = e.target.dataset.delete;
      const copy = e.target.dataset.copy;
      const sync = e.target.dataset.sync;
      try {
        if (del && confirm('Lernset wirklich löschen? Dein Lernfortschritt dazu geht verloren.')) {
          await api(`/api/study/${del}`, { method: 'DELETE' });
          load();
        } else if (sync) {
          if (!confirm(`Deine Kopie von „${e.target.dataset.title}“ mit den neuen Inhalten abgleichen?\n\nNeue Karten kommen dazu, geänderte Karten werden übernommen (dein Lernfortschritt bleibt), im Original gelöschte Karten entfallen. Eigene zusätzliche Karten bleiben.`)) return;
          const r = await api(`/api/study/${sync}/sync`, { method: 'POST' });
          alert(`Aktualisiert: ${r.added} neu, ${r.updated} geändert, ${r.removed} entfernt.`);
          load();
        } else if (copy) {
          const { id } = await api(`/api/study/${copy}/copy`, { method: 'POST' });
          location.href = `/study-edit?id=${id}`;
        }
      } catch (err) {
        $('#error').textContent = err.message;
      }
    };

    requireLogin().then((me) => {
      mountNav('study', me);
      load();
      loadBattles();
      setInterval(loadBattles, 8000);
    });
  </script>
</body>
</html>
