<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m!=="on"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Lernen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">Quiz</a>
    <strong>Lernen</strong>
    <span id="me"></span>
  </header>
  <main>
    <div id="battles"></div>

    <div class="row spread section-head">
      <h2>Meine Lernsets</h2>
      <a class="btn primary" href="/study-edit">+ Neues Lernset</a>
    </div>
    <p class="error" id="error"></p>
    <div class="recent-list" id="mine"></div>

    <div class="section-head" style="margin-top:2rem"><h2>Von anderen geteilt</h2></div>
    <div class="recent-list" id="shared"></div>
  </main>
  <div class="changelog-backdrop" id="duel" hidden>
    <div class="changelog card" role="dialog" aria-modal="true" aria-labelledby="duel-title">
      <button type="button" class="changelog-x" id="duel-close" aria-label="Schließen">✕</button>
      <h2 id="duel-title">⚔️ Freund herausfordern</h2>
      <p class="muted" id="duel-info"></p>
      <div id="duel-list" class="friend-list"></div>
      <p class="error" id="duel-error"></p>
    </div>
  </div>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const nf = (n) => n.toLocaleString('de-DE');

    function rowHtml(s) {
      const learned = s.card_count ? (s.mastered_count / s.card_count) * 100 : 0;
      return `
        <div class="recent-row">
          <span class="subject-icon" aria-hidden="true">${s.subject_icon || '📘'}</span>
          <div>
            <div class="recent-title">${escapeHtml(s.title)}</div>
            <span class="muted">${nf(s.card_count)} ${s.card_count === 1 ? 'Karte' : 'Karten'}</span>
            ${s.subject ? `<span class="tag">${escapeHtml(s.subject)}</span>` : ''}
            ${s.mine ? (s.is_public ? '<span class="tag">🌍 Geteilt</span>' : '<span class="tag">🔒 Privat</span>') : `<span class="tag">von ${escapeHtml(s.owner)}</span>`}
            <div class="set-meter" title="Gelernt = in mindestens Box 3 des Karteikasten-Systems">
              <div class="stat-bar"><span style="width:${learned}%"></span></div>
              <span class="muted">${nf(s.mastered_count)}/${nf(s.card_count)} gelernt${s.due_count ? ` · ${nf(s.due_count)} fällig` : ''}</span>
            </div>
          </div>
          <div class="recent-meta">
            <a class="btn primary" href="/learn?id=${s.id}">Lernen</a>
            ${s.card_count >= 3 ? `<button type="button" data-battle="${s.id}" data-title="${escapeHtml(s.title)}" title="Einen Freund zum Lückentext-Battle herausfordern">⚔️ Battle</button>` : ''}
            ${s.mine
              ? `<a class="btn" href="/study-edit?id=${s.id}">Bearbeiten</a>
                 <button class="danger" type="button" data-delete="${s.id}">Löschen</button>`
              : `<button type="button" data-copy="${s.id}">Kopieren</button>`}
          </div>
        </div>`;
    }

    async function load() {
      const { mine, shared } = await api('/api/study');
      $('#mine').innerHTML = mine.length ? mine.map(rowHtml).join('')
        : `<div class="card muted"><strong>Noch kein Lernset.</strong><br>Lege Begriffe mit ihren Definitionen an
           und lerne sie als Karteikarten, Lückentext oder aus dem Kopf. Du kannst Definitionen aus deinem Skript einfach einfügen.</div>`;
      $('#shared').innerHTML = shared.length ? shared.map(rowHtml).join('')
        : '<div class="card muted">Noch hat niemand ein Lernset geteilt.</div>';
    }

    // --- Battle: Übersicht und Herausfordern ---
    async function loadBattles() {
      let b;
      try { b = await api('/api/battles'); } catch { return; }
      const row = (x, right) => `<div class="friend-row">${profileLink(x.opponent, avatarHtml(x.opponent, '2.2rem'))}<div class="friend-name">${profileLink(x.opponent, `<strong>${escapeHtml(x.opponent)}</strong>`)} <span class="muted">· ${escapeHtml(x.setTitle)}</span></div><div class="row">${right}</div></div>`;
      const parts = [];
      if (b.invites.length) parts.push(`<h3>Herausforderungen an dich</h3>${b.invites.map((x) => row(x, `<a class="btn primary" href="/battle?id=${x.id}">Ansehen</a>`)).join('')}`);
      if (b.active.length) parts.push(`<h3>Läuft gerade</h3>${b.active.map((x) => row(x, `<a class="btn primary" href="/battle?id=${x.id}">Weiterspielen</a>`)).join('')}`);
      if (b.waiting.length) parts.push(`<h3>Wartet auf Antwort</h3>${b.waiting.map((x) => row(x, `<a class="btn" href="/battle?id=${x.id}">Öffnen</a>`)).join('')}`);
      if (b.recent.length) parts.push(`<h3>Letzte Battles</h3>${b.recent.map((x) => row(x, `<span class="tag">${{ win: '🏆 Sieg', loss: 'Niederlage', draw: '🤝 Remis' }[x.result]} ${nf(x.myScore)}:${nf(x.theirScore)}</span>`)).join('')}`);
      $('#battles').innerHTML = parts.length ? `<div class="card"><h2 style="margin-bottom:.4rem">⚔️ Battle</h2>${parts.join('')}</div>` : '';
    }

    let duelSet = null;
    async function openDuel(setId, title) {
      duelSet = setId;
      $('#duel-error').textContent = '';
      $('#duel-info').textContent = `Lückentext-Battle mit „${title}“ – du und dein Freund füllt gleichzeitig dieselben Lücken aus.`;
      $('#duel-list').innerHTML = '<span class="muted">Lade Freunde …</span>';
      $('#duel').hidden = false;
      const { friends } = await api('/api/friends');
      $('#duel-list').innerHTML = friends.length ? friends.map((f) => `
        <div class="friend-row">${avatarHtml(f.username, '2.2rem')}<div class="friend-name"><strong>${escapeHtml(f.username)}</strong> <span class="muted">${escapeHtml(f.code)}</span></div>
        <button type="button" class="primary" data-challenge="${escapeHtml(f.username)}">Herausfordern</button></div>`).join('')
        : '<p class="muted">Du hast noch keine Freunde. <a href="/friends">Freunde hinzufügen →</a></p>';
    }
    $('#duel-close').onclick = () => { $('#duel').hidden = true; };
    $('#duel').addEventListener('click', async (e) => {
      if (e.target === $('#duel')) $('#duel').hidden = true;
      const friend = e.target.dataset.challenge;
      if (!friend) return;
      try {
        const { id } = await api('/api/battles', { method: 'POST', body: { setId: duelSet, friend } });
        location.href = `/battle?id=${id}`;
      } catch (err) { $('#duel-error').textContent = err.message; }
    });

    document.querySelector('main').onclick = async (e) => {
      if (e.target.dataset.battle) return openDuel(e.target.dataset.battle, e.target.dataset.title);
      const del = e.target.dataset.delete;
      const copy = e.target.dataset.copy;
      try {
        if (del && confirm('Lernset wirklich löschen? Dein Lernfortschritt dazu geht verloren.')) {
          await api(`/api/study/${del}`, { method: 'DELETE' });
          load();
        } else if (copy) {
          const { id } = await api(`/api/study/${copy}/copy`, { method: 'POST' });
          location.href = `/study-edit?id=${id}`;
        }
      } catch (err) {
        $('#error').textContent = err.message;
      }
    };

    requireLogin().then((me) => {
      mountNav('study', me);
      load();
      loadBattles();
      setInterval(loadBattles, 8000);
    });
  </script>
</body>
</html>
