<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Umfrage-Ergebnisse</title>
  <link rel="stylesheet" href="/style.css?v=11">
</head>
<body>
  <header class="top">
    <a class="brand" href="/quizzes">← Quiz</a>
    <strong>📊 Ergebnisse</strong>
    <span id="me"></span>
  </header>
  <main>
    <p class="error" id="error"></p>
    <h1 id="poll-title" style="margin-bottom:.25rem"></h1>
    <div class="row" id="run-picker" style="margin-bottom:1rem" hidden>
      <label for="runs" style="margin:0">Durchlauf</label>
      <select id="runs" style="max-width:20rem"></select>
    </div>
    <div id="charts"></div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/poll.js"></script>
  <script>
    const params = new URLSearchParams(location.search);

    async function showRun(runId) {
      const run = await api(`/api/polls/run/${runId}`);
      $('#poll-title').textContent = run.title;
      $('#charts').innerHTML = `<p class="muted">Durchgeführt am ${new Date(run.createdAt).toLocaleString('de-DE')}</p>${pollResultsHtml({ participants: run.participants, questions: run.questions })}`;
    }

    requireLogin().then(async (me) => {
      mountNav('quizzes', me);
      try {
        if (params.get('run')) return await showRun(params.get('run'));
        const quizId = params.get('quiz');
        if (!quizId) { location.href = '/quizzes'; return; }
        const { title, runs } = await api(`/api/polls/quiz/${quizId}`);
        $('#poll-title').textContent = title;
        if (!runs.length) { $('#charts').innerHTML = '<div class="card muted">Noch kein Durchlauf – starte die Umfrage unter „Quiz“, dann erscheinen die Ergebnisse hier.</div>'; return; }
        $('#run-picker').hidden = runs.length < 2;
        $('#runs').innerHTML = runs.map((r) => `<option value="${r.id}">${new Date(r.createdAt).toLocaleString('de-DE')} · ${r.participants} Teilnehmer</option>`).join('');
        $('#runs').onchange = () => showRun($('#runs').value).catch((e) => { $('#error').textContent = e.message; });
        await showRun(runs[0].id);
      } catch (err) { $('#error').textContent = err.message; }
    });
  </script>
</body>
</html>
