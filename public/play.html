<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m!=="on"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Mitspielen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Quiz</a>
    <span class="muted" id="status"></span>
  </header>
  <main>
    <div id="join" class="card narrow" hidden>
      <h2>Spiel beitreten</h2>
      <form id="join-form">
        <label for="pin">Game-PIN</label>
        <input type="text" id="pin" inputmode="numeric" autocomplete="off">
        <div id="name-field">
          <label for="name">Dein Name</label>
          <input type="text" id="name" maxlength="20" autocomplete="nickname">
        </div>
        <p class="muted" id="account-hint"></p>
        <p class="error" id="error"></p>
        <button class="primary" type="submit">Beitreten</button>
      </form>
    </div>
    <div id="view"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let me = null;
    let state = null;
    let tick = null;  // Intervall bzw. Animationsframe des Countdown-Rings
    let live = null;
    let joinedPin = null;
    let lastKey = null;  // Endansicht nur einmal aufbauen, damit Animationen nicht bei jedem Nachladen neu starten

    // Zufällige Gast-ID pro Tab, damit man nach einem Reload im selben Spiel bleibt
    function guestId() {
      let id = sessionStorage.getItem('guestId');
      if (!id) {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        id = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        sessionStorage.setItem('guestId', id);
      }
      return id;
    }
    apiHeaders['X-Guest-Id'] = guestId();

    function showJoinForm() {
      $('#join').hidden = false;
      noAutoFocus($('#pin'));
      $('#name-field').hidden = !!me;
      $('#name').value = sessionStorage.getItem('guestName') || '';
      const loginLink = `/?next=${encodeURIComponent(location.pathname + location.search)}`;
      $('#account-hint').innerHTML = me
        ? `Du spielst als <strong>${escapeHtml(me.username)}</strong> – deine Punkte werden gespeichert.`
        : `Du spielst als Gast. <a href="${loginLink}">Anmelden</a>, um deine Punkte zu speichern.`;
      // Nichts automatisch anklicken, wenn man die PIN selbst eingeben will. Nur nach dem Scannen
      // des QR-Codes (PIN steht schon da) geht es für Gäste direkt beim Namen weiter.
      if ($('#pin').value && !me) $('#name').focus();
    }

    function render() {
      const s = state;
      $('#status').textContent = `${s.team ? s.team.emoji + ' ' : ''}${s.name}${s.guest ? ' (Gast)' : ''} · ${s.score} Punkte`;
      const key = `${s.state}:${s.questionIndex}`;
      if ((s.state === 'finished' || (s.state === 'lobby' && document.querySelector('.react-row'))) && key === lastKey) return;
      lastKey = key;
      stopTimer();
      let html = '';

      if (s.state === 'lobby') {
        html = `<div class="card center">
          <h2>${escapeHtml(s.title)}</h2>
          <p class="big">Du bist drin! 🎉</p>
          <p class="muted">Warte, bis der Host das Quiz startet …</p>
          <p class="muted" style="margin-bottom:0">Schick eine Reaktion an den Bildschirm:</p>
          <div class="react-row">${['👋', '🔥', '😂', '🎉'].map((e) => `<button type="button" data-react="${e}" aria-label="Reaktion ${e}">${e}</button>`).join('')}</div>
          ${s.teamCount ? '<p class="muted">👥 Team-Modus: Beim Start wirst du einem Team zugelost.</p>' : ''}
        </div>`;
      } else if (s.state === 'teams') {
        html = `<div class="card center" style="border-top:6px solid ${s.team.color}">
          <h2>Du bist bei ${s.team.emoji} ${escapeHtml(s.team.name)}!</h2>
          <p class="muted">Deine Mitspieler:</p>
          <p class="big">${s.teammates.map(escapeHtml).join(', ')}</p>
          ${s.team.ghost ? '<p class="muted">👻 Euer Team ist einen Spieler kleiner und bekommt einen Geist-Spieler mit dem Punktedurchschnitt eures Teams.</p>' : ''}
          <p class="muted">Gleich geht’s los …</p>
        </div>`;
      } else if (s.state === 'question') {
        const answered = s.myAnswer !== null;
        html = `
          <div class="row spread">
            <span class="muted">Frage ${s.questionIndex + 1} / ${s.total}</span>
            ${s.streak > 0 ? `<span class="streak-pill">🔥 ${s.streak} in Folge · +${s.nextBonus} Bonus</span>` : ''}
          </div>
          <h2>${escapeHtml(s.question.text)}</h2>
          <div class="answers">${s.question.answers.map((a, i) => `
            <button type="button" class="answer c${i} ${answered && s.myAnswer !== i ? 'dim' : ''} ${s.myAnswer === i ? 'chosen' : ''}"
              data-choice="${i}" ${answered ? 'disabled' : ''}>${escapeHtml(a)}</button>`).join('')}
          </div>
          <div class="timer-ring" id="ring" role="timer" aria-label="Verbleibende Zeit">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="45"></circle>
              <circle class="bar" id="ring-bar" cx="50" cy="50" r="45" pathLength="1"></circle>
            </svg>
            <span id="timer"></span>
          </div>
          ${answered ? '<p class="center muted">Antwort abgegeben – warte auf die anderen …</p>' : ''}`;
      } else if (s.state === 'reveal') {
        const correct = s.myAnswer === s.question.correct;
        html = `<div class="card center">
          <h2>${s.myAnswer === null ? 'Keine Antwort ⏱️' : correct ? 'Richtig! ✅' : 'Leider falsch ❌'}</h2>
          <p>Richtige Antwort: <strong>${escapeHtml(s.question.answers[s.question.correct])}</strong></p>
          <p class="big">+${s.lastPoints} Punkte</p>
          ${s.lastBonus ? `<p><span class="streak-pill">🔥 ${s.streak} in Folge · inkl. +${s.lastBonus} Serien-Bonus</span></p>` : ''}
          <p class="muted">Platz ${s.rank} von ${s.playerCount}</p>
        </div>`;
      } else if (s.state === 'scoreboard') {
        const climbed = s.prevRank - s.rank;
        html = `<div class="card center">
          <h2>Zwischenstand</h2>
          <p class="big" style="font-size:2.5rem;font-weight:800">Platz ${s.rank}</p>
          <p class="muted">von ${s.playerCount}</p>
          ${climbed > 0 ? `<p class="big" style="color:var(--ok)">▲ ${climbed} ${climbed === 1 ? 'Platz' : 'Plätze'} gutgemacht!</p>` : ''}
          <p>${s.score} Punkte${s.lastPoints ? ` (+${s.lastPoints})` : ''}</p>
          ${s.team ? `
            <div class="team-standing" style="border-color:${s.team.color}">
              <strong>${s.team.emoji} ${escapeHtml(s.team.name)}</strong>: Platz ${s.teamStanding.rank} von ${s.teamStanding.teams}
              · ${s.teamStanding.score} Punkte
              ${s.teamStanding.prevRank > s.teamStanding.rank ? `<br><span style="color:var(--ok);font-weight:700">▲ Euer Team ist aufgestiegen!</span>` : ''}
            </div>` : ''}
          <p class="muted">Schau auf den großen Bildschirm …</p>
        </div>`;
      } else if (s.state === 'finished') {
        const medal = ['🥇', '🥈', '🥉'][s.rank - 1];
        html = `<div class="card center">
          <h1>${s.rank === 1 ? 'Du hast gewonnen! 🏆' : 'Quiz beendet'}</h1>
          <p class="big">${medal ? medal + ' ' : ''}${s.score} Punkte</p>
          <p>Platz ${s.rank} von ${s.playerCount}</p>
          ${s.team ? `
            <div class="team-standing" style="border-color:${s.team.color}">
              ${s.teamStanding.rank === 1 ? '🏆 <strong>Dein Team hat gewonnen!</strong><br>' : ''}
              ${s.team.emoji} <strong>${escapeHtml(s.team.name)}</strong>: Platz ${s.teamStanding.rank} von ${s.teamStanding.teams}
              · ${s.teamStanding.score} Punkte
            </div>` : ''}
          ${s.achievements && s.achievements.length ? `
            <div class="ach-new">
              <h3>${s.achievements.length === 1 ? 'Neuer Erfolg!' : 'Neue Erfolge!'}</h3>
              ${s.achievements.map((a, i) => `
                <div class="ach-toast pop-in" style="--delay:${0.3 + i * 0.3}s">
                  <span class="icon" aria-hidden="true">${a.icon}</span>
                  <div><strong>${escapeHtml(a.name)}</strong><br><span class="muted">${escapeHtml(a.description)}</span></div>
                </div>`).join('')}
            </div>` : ''}
          ${s.guest
            ? '<p class="muted">Als Gast werden deine Punkte und Erfolge nicht gespeichert.</p><p><a class="btn" href="/">Konto erstellen</a></p>'
            : `<p class="muted">Deine Punkte wurden gespeichert${s.playerCount < s.minPlayers
                ? `, zählen aber nicht für Gesamtwertung und Erfolge (dafür braucht es mindestens ${s.minPlayers} Teilnehmer).`
                : '.'}</p><p><a class="btn" href="/profile">Zu meinen Ergebnissen</a></p>`}
        </div>`;
      }
      $('#view').innerHTML = html;

      if (s.state === 'question') startTimer(s);
    }

    // Der Ring läuft aus der Restzeit (Serveruhr) herunter; bei reduzierter Bewegung nur einmal pro Sekunde
    const reducedMotion = document.documentElement.classList.contains('reduce-motion');
    const URGENT_SECONDS = 5;

    function stopTimer() {
      clearInterval(tick);
      cancelAnimationFrame(tick);
    }

    function startTimer(s) {
      const ring = $('#ring');
      const bar = $('#ring-bar');
      const label = $('#timer');
      const frame = () => {
        const left = live.remaining(s);
        const fraction = Math.min(1, left / s.question.timeLimit);
        bar.style.strokeDashoffset = 1 - fraction;
        bar.style.opacity = fraction > 0 ? 1 : 0;
        label.textContent = Math.ceil(left);
        ring.classList.toggle('urgent', left <= URGENT_SECONDS);
        if (!reducedMotion) tick = requestAnimationFrame(frame);
      };
      frame();
      if (reducedMotion) tick = setInterval(frame, 1000);
    }

    function startLive(pin) {
      joinedPin = pin;
      $('#join').hidden = true;
      $('#error').textContent = '';
      history.replaceState(null, '', `/play?pin=${encodeURIComponent(pin)}`);
      live = liveGame(pin, () => api(`/api/games/${encodeURIComponent(pin)}/me`), (s) => {
        state = s;
        render();
      });
    }

    async function join(pin, name) {
      try {
        await api(`/api/games/${encodeURIComponent(pin)}/join`, { method: 'POST', body: { name } });
        if (name) sessionStorage.setItem('guestName', name);
        startLive(pin);
      } catch (err) {
        showJoinForm();
        $('#error').textContent = err.message;
      }
    }

    // Reaktion in der Lobby: höchstens eine alle 0,7 s
    let lastReact = 0;
    $('#view').addEventListener('click', async (e) => {
      const react = e.target.closest('[data-react]');
      if (react) {
        if (Date.now() - lastReact < 700) return;
        lastReact = Date.now();
        react.classList.remove('sent'); void react.offsetWidth; react.classList.add('sent');
        api(`/api/games/${encodeURIComponent(joinedPin)}/react`, { method: 'POST', body: { emoji: react.dataset.react } }).catch(() => {});
        return;
      }
      const choice = e.target.closest('[data-choice]');
      if (!choice || choice.disabled) return;
      document.querySelectorAll('[data-choice]').forEach((b) => { b.disabled = true; });
      try {
        live.apply(await api(`/api/games/${encodeURIComponent(joinedPin)}/answer`, {
          method: 'POST', body: { choice: Number(choice.dataset.choice) },
        }));
      } catch (err) {
        live.refresh();
      }
    });

    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      join($('#pin').value.trim(), me ? undefined : $('#name').value.trim());
    };

    api('/api/auth/me').catch(() => null).then(async (user) => {
      me = user;
      const pin = new URLSearchParams(location.search).get('pin');
      if (!pin) return showJoinForm();
      $('#pin').value = pin;
      // Schon im Spiel (z. B. nach Reload)? Dann direkt weiter
      try {
        await api(`/api/games/${encodeURIComponent(pin)}/me`);
        return startLive(pin);
      } catch {}
      // Eingeloggte (oder Gäste mit gemerktem Namen) treten direkt bei
      if (me || sessionStorage.getItem('guestName')) join(pin, sessionStorage.getItem('guestName'));
      else showJoinForm();
    });
  </script>
</body>
</html>
