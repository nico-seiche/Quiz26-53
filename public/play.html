<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – Mitspielen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Quiz</a>
    <span class="muted" id="status"></span>
  </header>
  <main>
    <div id="join" class="card narrow" hidden>
      <h2>Spiel beitreten</h2>
      <form id="join-form">
        <label for="pin">Game-PIN</label>
        <input type="text" id="pin" inputmode="numeric" autocomplete="off">
        <div id="name-field">
          <label for="name">Dein Name</label>
          <input type="text" id="name" maxlength="20" autocomplete="nickname">
        </div>
        <p class="muted" id="account-hint"></p>
        <p class="error" id="error"></p>
        <button class="primary" type="submit">Beitreten</button>
      </form>
    </div>
    <div id="view"></div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let socket;
    let me = null;
    let state = null;
    let tick = null;
    let joinedPin = null;

    // Zufällige Gast-ID pro Tab, damit man nach einem Reload im selben Spiel bleibt
    function guestId() {
      let id = sessionStorage.getItem('guestId');
      if (!id) {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        id = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        sessionStorage.setItem('guestId', id);
      }
      return id;
    }

    function showJoinForm() {
      $('#join').hidden = false;
      $('#name-field').hidden = !!me;
      $('#name').value = sessionStorage.getItem('guestName') || '';
      const loginLink = `/?next=${encodeURIComponent(location.pathname + location.search)}`;
      $('#account-hint').innerHTML = me
        ? `Du spielst als <strong>${escapeHtml(me.username)}</strong> – deine Punkte werden gespeichert.`
        : `Du spielst als Gast. <a href="${loginLink}">Anmelden</a>, um deine Punkte zu speichern.`;
      ($('#pin').value ? (me ? $('#pin') : $('#name')) : $('#pin')).focus();
    }

    function render() {
      const s = state;
      $('#status').textContent = `${s.name}${s.guest ? ' (Gast)' : ''} · ${s.score} Punkte`;
      clearInterval(tick);
      let html = '';

      if (s.state === 'lobby') {
        html = `<div class="card center">
          <h2>${escapeHtml(s.title)}</h2>
          <p class="big">Du bist drin! 🎉</p>
          <p class="muted">Warte, bis der Host das Quiz startet …</p>
        </div>`;
      } else if (s.state === 'question') {
        const answered = s.myAnswer !== null;
        html = `
          <div class="row spread">
            <span class="muted">Frage ${s.questionIndex + 1} / ${s.total}</span>
            <strong id="timer"></strong>
          </div>
          <h2>${escapeHtml(s.question.text)}</h2>
          <div class="answers">${s.question.answers.map((a, i) => `
            <button type="button" class="answer c${i} ${answered && s.myAnswer !== i ? 'dim' : ''} ${s.myAnswer === i ? 'chosen' : ''}"
              data-choice="${i}" ${answered ? 'disabled' : ''}>${escapeHtml(a)}</button>`).join('')}
          </div>
          ${answered ? '<p class="center muted">Antwort abgegeben – warte auf die anderen …</p>' : ''}`;
      } else if (s.state === 'reveal') {
        const correct = s.myAnswer === s.question.correct;
        html = `<div class="card center">
          <h2>${s.myAnswer === null ? 'Keine Antwort ⏱️' : correct ? 'Richtig! ✅' : 'Leider falsch ❌'}</h2>
          <p>Richtige Antwort: <strong>${escapeHtml(s.question.answers[s.question.correct])}</strong></p>
          <p class="big">+${s.lastPoints} Punkte</p>
          <p class="muted">Platz ${s.rank} von ${s.playerCount}</p>
        </div>`;
      } else if (s.state === 'finished') {
        html = `<div class="card center">
          <h1>Quiz beendet</h1>
          <p class="big">${s.score} Punkte</p>
          <p>Platz ${s.rank} von ${s.playerCount}</p>
          ${s.guest
            ? '<p class="muted">Als Gast werden deine Punkte nicht gespeichert.</p><p><a class="btn" href="/">Konto erstellen</a></p>'
            : '<p class="muted">Deine Punkte wurden gespeichert.</p><p><a class="btn" href="/dashboard">Zu meinen Ergebnissen</a></p>'}
        </div>`;
      }
      $('#view').innerHTML = html;

      if (s.state === 'question') {
        const update = () => {
          const el = $('#timer');
          if (el) el.textContent = `${Math.max(0, Math.ceil((s.endsAt - Date.now()) / 1000))} s`;
        };
        update();
        tick = setInterval(update, 250);
      }
    }

    function join(pin, name) {
      socket.emit('player:join', { pin, name, guestId: guestId() }, (res) => {
        if (res.error) {
          joinedPin = null;
          showJoinForm();
          $('#error').textContent = res.error;
          return;
        }
        $('#join').hidden = true;
        $('#error').textContent = '';
        if (name) sessionStorage.setItem('guestName', name);
        history.replaceState(null, '', `/play?pin=${encodeURIComponent(pin)}`);
        joinedPin = pin;
      });
    }

    $('#view').addEventListener('click', (e) => {
      const choice = e.target.closest('[data-choice]');
      if (choice && !choice.disabled) socket.emit('player:answer', { choice: Number(choice.dataset.choice) });
    });

    $('#join-form').onsubmit = (e) => {
      e.preventDefault();
      join($('#pin').value.trim(), me ? undefined : $('#name').value.trim());
    };

    api('/api/auth/me').catch(() => null).then((user) => {
      me = user;
      socket = io();
      socket.on('game:state', (s) => { state = s; render(); });
      socket.on('connect', () => {
        // Nach Verbindungsabbruch automatisch wieder beitreten
        if (joinedPin) return join(joinedPin);
        const pin = new URLSearchParams(location.search).get('pin');
        if (pin) $('#pin').value = pin;
        // Eingeloggte (oder Gäste, die schon drin waren) treten direkt bei
        if (pin && (me || sessionStorage.getItem('guestName'))) join(pin, sessionStorage.getItem('guestName'));
        else showJoinForm();
      });
    });
  </script>
</body>
</html>
