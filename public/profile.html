<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Profil</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">Quiz</a>
    <strong>Profil</strong>
    <button type="button" onclick="logout()">Abmelden</button>
  </header>
  <main>
    <div class="card profile-card">
      <span id="profile-avatar"></span>
      <div>
        <div class="muted">Angemeldet als</div>
        <h1 id="name" style="margin:0">…</h1>
        <span class="level-badge" id="profile-level"></span>
        <span class="tag" id="profile-code" title="Deine Freunde-ID"></span>
        <div class="muted level-next" id="profile-next"></div>
      </div>
    </div>

    <a class="card friend-link" href="/friends" id="friend-link">
      <span>👫 Freunde &amp; ID</span>
      <span class="muted" id="friend-hint">Freunde finden und hinzufügen →</span>
    </a>

    <div class="card">
      <h2>Meine Statistik</h2>
      <div class="stat-total" id="total">0</div>
      <div class="muted" id="games">Punkte insgesamt</div>
      <div id="subjects" style="margin-top:1rem"></div>
      <p class="muted" id="rule" style="margin-bottom:0"></p>
    </div>

    <div class="card" id="erfolge">
      <div class="row spread">
        <h2>Meine Erfolge</h2>
        <span class="muted" id="ach-count"></span>
      </div>
      <div class="ach-grid" id="achievements"></div>
      <p class="muted" id="ach-rule" style="margin-bottom:0"></p>
    </div>

    <div class="card">
      <h2>Meine Ergebnisse</h2>
      <ul class="list" id="results"></ul>
      <button type="button" class="more-btn" id="more" hidden>Alle anzeigen</button>
    </div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let showAll = false;
    async function loadResults() {
      const { total, games, minPlayers, subjects, results } = await api('/api/results');
      $('#rule').textContent = `Gewertet werden nur Spiele mit mindestens ${minPlayers} Teilnehmern.`;
      $('#total').textContent = total.toLocaleString('de-DE');
      $('#games').textContent = `Punkte insgesamt · ${games} ${games === 1 ? 'Spiel' : 'Spiele'}`;
      const max = Math.max(1, ...subjects.map((s) => s.points));
      $('#subjects').innerHTML = subjects.map((s) => `
        <div class="stat-row" title="${s.games} ${s.games === 1 ? 'Spiel' : 'Spiele'}">
          <span>${escapeHtml(s.name)}</span>
          <div class="stat-bar"><span style="width:${(s.points / max) * 100}%"></span></div>
          <span class="stat-points">${s.points.toLocaleString('de-DE')}</span>
        </div>`).join('');
      const shown = showAll ? results : results.slice(0, 5);
      $('#more').hidden = showAll || results.length <= 5;
      $('#results').innerHTML = shown.length ? shown.map((r) => `
        <li>
          <div>
            <strong>${escapeHtml(r.quiz_title)}</strong>${r.subject ? ` <span class="tag">${escapeHtml(r.subject)}</span>` : ''}<br>
            <span class="muted">${new Date(r.played_at).toLocaleString('de-DE')}</span>
          </div>
          <div>
            ${r.score} Punkte · Platz ${r.rank}/${r.player_count}
            ${r.counted ? '' : `<br><span class="muted">zählt nicht (unter ${minPlayers} Teilnehmer)</span>`}
          </div>
        </li>`).join('') : '<li class="muted">Noch keine Ergebnisse – spiel eingeloggt mit, dann werden deine Punkte hier gespeichert.</li>';
    }

    async function loadAchievements() {
      const { minPlayers, earned, total, achievements } = await api('/api/achievements');
      $('#ach-count').textContent = `${earned} / ${total} erreicht`;
      $('#ach-rule').textContent = `Erfolge gibt es nur in Spielen mit mindestens ${minPlayers} Teilnehmern.`;
      $('#achievements').innerHTML = achievements.map((a) => `
        <div class="ach-tile ${a.earned ? 'earned' : 'locked'}">
          <span class="icon" aria-hidden="true">${a.icon}</span>
          <strong>${escapeHtml(a.name)}</strong>
          <span class="muted">${escapeHtml(a.description)}</span>
          ${a.earned
            ? `<span class="tag">Erreicht am ${new Date(a.earnedAt).toLocaleDateString('de-DE')}</span>`
            : a.progress
              ? `<div class="stat-bar"><span style="width:${(a.progress.value / a.progress.target) * 100}%"></span></div>
                 <span class="muted">${a.progress.value.toLocaleString('de-DE')} / ${a.progress.target.toLocaleString('de-DE')}</span>`
              : '<span class="tag">🔒 Noch offen</span>'}
        </div>`).join('');
    }

    $('#more').onclick = () => { showAll = true; loadResults(); };

    requireLogin().then((me) => {
      $('#name').textContent = me.username;
      $('#profile-avatar').innerHTML = avatarHtml(me.username, '4.5rem');
      $('#profile-level').textContent = `🏅 Level ${me.level}`;
      $('#profile-code').textContent = me.code ? `#${me.code}` : '';
      if (me.friendRequests) $('#friend-hint').innerHTML = `<span class="tag">${me.friendRequests} ${me.friendRequests === 1 ? 'Anfrage' : 'Anfragen'}</span>`;
      $('#profile-next').textContent = `Noch ${me.toNext.toLocaleString('de-DE')} Punkte bis Level ${me.level + 1}`;
      mountNav('profile', me);
      loadResults();
      loadAchievements().then(() => {
        if (location.hash === '#erfolge') document.getElementById('erfolge').scrollIntoView();
      });
    });
  </script>
</body>
</html>
