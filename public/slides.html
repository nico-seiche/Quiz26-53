<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Folien</title>
  <link rel="stylesheet" href="/style.css?v=13">
</head>
<body>
  <header class="top">
    <a class="brand" href="/profile">← Profil</a>
    <strong>Folien</strong>
    <span id="me"></span>
  </header>
  <main style="max-width:1000px">
    <div class="row spread section-head">
      <h1 style="margin:0">🖥️ Folien</h1>
      <div class="row">
        <button type="button" id="import" title="Eine PowerPoint-Datei (.pptx) hochladen und im Editor bearbeiten">📥 PowerPoint importieren</button>
        <button type="button" class="primary" id="new">+ Neue Präsentation</button>
      </div>
      <input type="file" id="pptx" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
    </div>
    <p class="muted">Erstelle Präsentationen für die Vorlesung, arbeite mit Freunden gleichzeitig daran und teile sie per Link.</p>
    <p class="error" id="error"></p>
    <div class="deck-grid" id="decks"></div>
    <h2 id="shared-head" hidden style="margin-top:2rem">🤝 Mit mir geteilt</h2>
    <div class="deck-grid" id="shared-decks"></div>
  </main>
  <style>
    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .deck-card { padding: .8rem; margin: 0; display: flex; flex-direction: column; gap: .6rem; }
    .deck-thumb { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #fff; aspect-ratio: 16 / 9; display: block; width: 100%; padding: 0; cursor: pointer; box-shadow: none; }
    .deck-title { font-weight: 800; overflow-wrap: anywhere; }
    .deck-actions { display: flex; flex-wrap: wrap; gap: .4rem; }
    .deck-actions button, .deck-actions a { padding: .4rem .7rem; font-size: .9rem; }
  </style>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/slides-render.js"></script>
  <script src="/js/slides-pdf.js"></script>
  <script src="/js/slides-images.js"></script>
  <script src="/js/slides-pptx.js"></script>
  <script>
    const fmt = (d) => new Date(d).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });

    const card = (d, mine) => `
        <div class="card deck-card" data-id="${d.id}">
          <button type="button" class="deck-thumb" data-open="${d.id}" aria-label="${escapeHtml(d.title)} öffnen"></button>
          <div><div class="deck-title">${escapeHtml(d.title)}</div><span class="muted">${d.slides} ${d.slides === 1 ? 'Folie' : 'Folien'} · ${fmt(d.updatedAt)}</span>${mine ? '' : `<br><span class="tag">🤝 von ${escapeHtml(d.owner)}</span>`}</div>
          <div class="deck-actions">
            <a class="btn primary" href="/slides-present?id=${d.id}">▶ Präsentieren</a>
            <a class="btn" href="/slides-edit?id=${d.id}">Bearbeiten</a>
            <button type="button" data-pdf="${d.id}">⬇ PDF</button>
            <button type="button" data-dup="${d.id}">Duplizieren</button>
            ${mine ? `<button type="button" class="danger" data-del="${d.id}" data-title="${escapeHtml(d.title)}">Löschen</button>` : ''}
          </div>
        </div>`;

    async function load() {
      const { mine, shared } = await api('/api/slides');
      const box = $('#decks');
      box.innerHTML = mine.length ? mine.map((d) => card(d, true)).join('') : '<div class="card muted">Noch keine Präsentation – lege mit „Neue Präsentation“ deine erste an.</div>';
      $('#shared-head').hidden = !shared.length;
      const sbox = $('#shared-decks');
      sbox.innerHTML = shared.map((d) => card(d, false)).join('');
      [...mine, ...shared].forEach((d) => {
        const thumb = document.querySelector(`[data-open="${d.id}"]`);
        if (thumb && d.first) SlideRender.mount(thumb, d.first, thumb.clientWidth || 260);
      });
    }

    // PowerPoint-Datei → neue, bearbeitbare Präsentation
    $('#import').onclick = () => { $('#error').textContent = ''; $('#pptx').click(); };
    $('#pptx').onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const btn = $('#import');
      const label = btn.textContent;
      if (!/\.pptx$/i.test(file.name)) { $('#error').textContent = 'Bitte eine PowerPoint-Datei im Format .pptx wählen (ältere .ppt-Dateien in PowerPoint als .pptx speichern).'; return; }
      btn.disabled = true;
      let deckId = null;
      try {
        btn.textContent = 'Lese Datei …';
        ({ id: deckId } = await api('/api/slides', { method: 'POST', body: { title: 'Import' } }));
        const result = await PptxImport.parse(file, { upload: (blob, o) => SlidesImages.upload(deckId, blob, { crop: o.crop, maxSide: 1920 }), onProgress: (t) => { btn.textContent = t; } });
        btn.textContent = 'Speichere …';
        // die leere Startfolie der neuen Präsentation durch die importierten Folien ersetzen
        const ops = [{ t: 'title', v: result.title }];
        result.slides.forEach((s, i) => ops.push({ t: 'slideAdd', slide: s, after: i ? result.slides[i - 1].id : 's1' }));
        ops.push({ t: 'slideDel', id: 's1' });
        await api(`/api/slides/${deckId}/ops`, { method: 'POST', body: { ops } });
        try { sessionStorage.setItem('pptx-report', JSON.stringify({ slides: result.report.slides, images: result.report.images, notes: result.report.notes })); } catch { /* egal */ }
        location.href = `/slides-edit?id=${deckId}`;
      } catch (err) {
        if (deckId) api(`/api/slides/${deckId}`, { method: 'DELETE' }).catch(() => {});
        $('#error').textContent = err.message;
        btn.disabled = false; btn.textContent = label;
      }
    };

    $('#new').onclick = async () => {
      try { const { id } = await api('/api/slides', { method: 'POST', body: { title: 'Neue Präsentation' } }); location.href = `/slides-edit?id=${id}`; }
      catch (err) { $('#error').textContent = err.message; }
    };
    document.querySelector('main').onclick = async (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      try {
        if (t.dataset.open) location.href = `/slides-edit?id=${t.dataset.open}`;
        else if (t.dataset.pdf) {
          const label = t.textContent;
          t.disabled = true;
          try {
            const deck = await api(`/api/slides/${t.dataset.pdf}`);
            await SlidesPdf.exportDeck(deck, (i, n) => { t.textContent = i < n ? `Folie ${i + 1}/${n} …` : '✓ Fertig'; });
          } finally { setTimeout(() => { t.disabled = false; t.textContent = label; }, 1500); }
        }
        else if (t.dataset.dup) { await api(`/api/slides/${t.dataset.dup}/duplicate`, { method: 'POST' }); load(); }
        else if (t.dataset.del && confirm(`„${t.dataset.title}“ wirklich löschen?`)) { await api(`/api/slides/${t.dataset.del}`, { method: 'DELETE' }); load(); }
      } catch (err) { $('#error').textContent = err.message; }
    };

    requireLogin().then((me) => {
      mountNav('profile', me);
      load().catch((err) => { $('#error').textContent = err.message; });
    });
  </script>
</body>
</html>
