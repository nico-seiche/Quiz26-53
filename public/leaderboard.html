<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Bestenliste</title>
  <link rel="stylesheet" href="/style.css?v=20">
</head>
<body>
  <header class="top">
    <a class="brand brand-logo" href="/dashboard" aria-label="Quiz – Startseite"><img src="/icons/logo.svg" alt="" width="32" height="32"></a>
    <strong>🏆 Bestenliste</strong>
    <span id="me"></span>
  </header>
  <main>
    <div class="tabs" id="tabs" role="group" aria-label="Wertung wählen"></div>
    <p class="muted" id="multi-hint" style="margin:-.3rem 0 .8rem;font-size:.9rem"></p>
    <p class="error" id="error"></p>
    <div class="card" id="summary"></div>
    <div class="card">
      <ol class="leaderboard" id="list"></ol>
      <p class="muted" id="rule" style="margin-bottom:0"></p>
    </div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // Auswahl: leer = Gesamt, sonst die gewählten Fächer (Punkte werden zusammengerechnet)
    let sel = (new URLSearchParams(location.search).get('subject') || '').split(',').filter((x) => /^\d+$/.test(x));
    let myName = '';

    const nf = (n) => n.toLocaleString('de-DE');

    function rankLabel(e) {
      if (e.points === 0) return '–';
      return ({ 1: '🥇', 2: '🥈', 3: '🥉' })[e.rank] || e.rank;
    }

    function rowHtml(e) {
      return `
        <li class="lb-row ${e.isMe ? 'me' : ''} ${e.points === 0 ? 'zero' : ''}" ${e.isMe ? 'aria-current="true"' : ''}>
          <span class="lb-rank">${rankLabel(e)}</span>
          <span class="lb-name">${profileLink(e.username, `${avatarHtml(e.username, '1.9rem')}<span class="lb-text">${escapeHtml(e.username)}</span>`)}${e.isMe ? ' <span class="tag">Du</span>' : ''}</span>
          <span class="lb-games muted">${e.games} ${e.games === 1 ? 'Spiel' : 'Spiele'}</span>
          <span class="lb-points">${nf(e.points)}</span>
        </li>`;
    }

    function render(d) {
      sel = d.selected === 'all' ? [] : d.selected.map(String);
      const same = (ids) => ids.length === sel.length && ids.every((i) => sel.includes(String(i)));
      $('#tabs').innerHTML = [
        `<button type="button" aria-pressed="${sel.length === 0}" class="${sel.length === 0 ? 'active' : ''}" data-all="1">Gesamt</button>`,
        ...(d.groups || []).map((g) => `<button type="button" aria-pressed="${same(g.ids)}" class="${same(g.ids) ? 'active' : ''}" data-group="${g.ids.join(',')}">⚖️ ${escapeHtml(g.name)}</button>`),
        ...d.subjects.map((x) => `<button type="button" aria-pressed="${sel.includes(String(x.id))}" class="${sel.includes(String(x.id)) ? 'active' : ''}" data-subject="${x.id}">${escapeHtml(x.name)}</button>`),
      ].join('');
      $('#multi-hint').textContent = sel.length > 1 ? `${sel.length} Fächer zusammen – die Punkte werden addiert.` : 'Tipp: Mehrere Fächer antippen, dann werden ihre Punkte zusammengerechnet.';

      const names = sel.map((id) => d.subjects.find((x) => String(x.id) === id).name);
      const grp = (d.groups || []).find((g) => same(g.ids));
      const scope = sel.length === 0 ? 'insgesamt' : grp ? `in den ${grp.name}n` : `in ${names.length > 2 ? `${names.length} Fächern (${names.join(' + ')})` : names.join(' + ')}`;
      $('#summary').innerHTML = d.me.points > 0
        ? `<div class="stat-total">Platz ${d.me.rank}</div>
           <div class="muted">von ${d.userCount} · ${nf(d.me.points)} Punkte ${scope} · ${d.me.games} ${d.me.games === 1 ? 'Spiel' : 'Spiele'}</div>`
        : `<strong>Du hast ${scope} noch keine gewerteten Punkte.</strong>
           <div class="muted">Spiele ein Quiz mit mindestens ${d.minPlayers} Teilnehmern, dann erscheinst du hier mit deinen Punkten.</div>`;

      let html = d.entries.map(rowHtml).join('');
      // Eigene Zeile anhängen, falls man wegen der Listenlänge nicht mehr sichtbar ist
      if (!d.entries.some((e) => e.isMe)) {
        html += `<li class="lb-gap muted" aria-hidden="true">…</li>` + rowHtml({ ...d.me, username: myName, isMe: true });
      }
      $('#list').innerHTML = html;
      $('#rule').textContent = `Alle registrierten Nutzer · gewertet werden nur Spiele mit mindestens ${d.minPlayers} Teilnehmern.`;
    }

    async function load() {
      $('#error').textContent = '';
      try {
        render(await api(`/api/leaderboard?subject=${sel.length ? sel.join(',') : 'all'}`));
      } catch (err) {
        if (sel.length) { sel = []; return load(); }  // ungültiges Fach in der Adresse
        $('#error').textContent = err.message;
      }
    }

    $('#tabs').addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.dataset.all) sel = [];
      else if (t.dataset.group) { const ids = t.dataset.group.split(','); sel = ids.every((i) => sel.includes(i)) && ids.length === sel.length ? [] : ids; }
      else if (t.dataset.subject) sel = sel.includes(t.dataset.subject) ? sel.filter((x) => x !== t.dataset.subject) : [...sel, t.dataset.subject];
      history.replaceState(null, '', sel.length ? `/leaderboard?subject=${sel.join(',')}` : '/leaderboard');
      load();
    });

    requireLogin().then((me) => {
      myName = me.username;
      mountNav('leaderboard', me);
      load();
    });
  </script>
</body>
</html>
