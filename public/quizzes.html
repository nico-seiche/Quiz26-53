<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Meine Quiz</title>
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <header class="top">
    <a class="brand brand-logo" href="/dashboard" aria-label="Quiz – Startseite"><img src="/icons/logo.svg" alt="" width="32" height="32"></a>
    <strong>Meine Quiz</strong>
    <span id="me"></span>
  </header>
  <main>
    <div class="row spread section-head">
      <h2>Meine Quiz</h2>
      <a class="btn primary" href="/edit">+ Neues Quiz</a>
    </div>
    <p class="error" id="error"></p>
    <div class="recent-list" id="quizzes"></div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function load() {
      const quizzes = await api('/api/quizzes');
      $('#quizzes').innerHTML = quizzes.length ? quizzes.map((q) => `
        <div class="recent-row">
          <span class="subject-icon" aria-hidden="true">${q.subject_icon || '📘'}</span>
          <div>
            <div class="recent-title">${escapeHtml(q.title)}</div>
            <span class="muted">${q.question_count} Fragen</span>
            ${q.subject ? `<span class="tag">${escapeHtml(q.subject)}</span>` : '<span class="tag">Kein Fach</span>'}
            ${q.mine ? (q.collaborator_count ? `<span class="tag">👥 mit ${q.collaborator_count} ${q.collaborator_count === 1 ? 'Freund' : 'Freunden'}</span>` : '') : `<span class="tag">🤝 von ${escapeHtml(q.owner)}</span>`}
            ${q.kind === 'poll' ? '<span class="tag">📊 Umfrage</span>' : `<span class="tag">${q.mode === 'team' ? '👥 Team' : '👤 Einzel'}</span>`}
          </div>
          <div class="recent-meta">
            <button class="primary" type="button" data-start="${q.id}" ${q.question_count ? '' : 'disabled'}>Starten</button>
            ${q.kind === 'poll' ? `<a class="btn" href="/poll-results?quiz=${q.id}">📊 Ergebnisse</a>` : ''}
            <a class="btn" href="/edit?id=${q.id}">Bearbeiten</a>
            ${q.mine ? `<button class="danger" type="button" data-delete="${q.id}">Löschen</button>` : ''}
          </div>
        </div>`).join('') : '<div class="card muted">Noch kein Quiz – leg dein erstes an.</div>';
    }

    $('#quizzes').onclick = async (e) => {
      const start = e.target.dataset.start;
      const del = e.target.dataset.delete;
      try {
        if (start) {
          const { pin } = await api('/api/games', { method: 'POST', body: { quizId: Number(start) } });
          location.href = `/host?pin=${pin}`;
        } else if (del && confirm('Quiz wirklich löschen?')) {
          await api(`/api/quizzes/${del}`, { method: 'DELETE' });
          load();
        }
      } catch (err) {
        $('#error').textContent = err.message;
      }
    };

    requireLogin().then((me) => {
      mountNav('quizzes', me);
      load();
    });
  </script>
</body>
</html>
