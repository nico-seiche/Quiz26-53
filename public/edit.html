<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Quiz – Bearbeiten</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/quizzes">← Meine Quiz</a>
    <button class="primary" type="button" id="save">Speichern</button>
  </header>
  <main>
    <div class="card">
      <label for="title">Titel</label>
      <input type="text" id="title" placeholder="z. B. Wahlsysteme im Vergleich">
      <label for="subject">Fach</label>
      <select id="subject"><option value="">Fach wählen …</option></select>
      <label for="mode">Spielmodus</label>
      <select id="mode">
        <option value="single">Einzel – jeder spielt für sich</option>
        <option value="team">Team – zwei Teams spielen gegeneinander</option>
      </select>
      <p class="muted" id="mode-hint" style="margin:.5rem 0 0"></p>
    </div>
    <div class="card" id="team-card" hidden>
      <h2 style="margin-bottom:.25rem">👥 Zusammen bearbeiten</h2>
      <p class="muted" id="team-info" style="margin-top:0"></p>
      <div id="team-list" class="row"></div>
      <div class="row" id="team-add" style="margin-top:.75rem;flex-wrap:nowrap">
        <input type="text" id="team-name" placeholder="Nutzername deines Freundes" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" id="team-invite">Einladen</button>
      </div>
      <p class="error" id="team-error" style="margin-bottom:0"></p>
    </div>
    <div id="questions"></div>
    <button type="button" id="add">+ Frage hinzufügen</button>
    <p class="error" id="error"></p>
  </main>
  <script src="/js/common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let questions = [];
    let version = null;   // Stand beim Laden, damit gleichzeitiges Speichern auffällt
    let me = null;
    let openIndex = -1;  // Akkordeon: immer höchstens eine Frage ist aufgeklappt

    function updateModeHint() {
      $('#mode-hint').textContent = $('#mode').value === 'team'
        ? 'Die Teilnehmer werden beim Start zufällig in zwei Teams gelost (mindestens 4 Teilnehmer). Bei ungerader Zahl bekommt das kleinere Team einen Geist-Spieler 👻 mit dem Punktedurchschnitt seiner Mitspieler.'
        : 'Jeder Teilnehmer spielt für sich allein.';
    }
    $('#mode').onchange = updateModeHint;

    function blankQuestion() {
      return { text: '', answers: ['', '', '', ''], correct: 0, timeLimit: 20 };
    }

    // Titel einer zugeklappten Frage: der eingegebene Fragetext
    function questionTitle(q, i) {
      return q.text.trim() ? `${i + 1}. ${q.text.trim()}` : `Frage ${i + 1} (noch leer)`;
    }

    function render() {
      $('#questions').innerHTML = questions.map((q, i) => {
        const open = i === openIndex;
        return `
        <div class="card ${open ? '' : 'collapsed'}" data-q="${i}">
          <div class="row question-head">
            <button type="button" class="q-toggle" data-action="toggle" aria-expanded="${open}" aria-controls="q-body-${i}">
              <span class="chevron" aria-hidden="true">${open ? '▾' : '▸'}</span>
              <span class="q-title">${open ? `Frage ${i + 1}` : escapeHtml(questionTitle(q, i))}</span>
            </button>
            <div class="row">
              <button type="button" data-action="up" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button type="button" data-action="down" aria-label="Nach unten" ${i === questions.length - 1 ? 'disabled' : ''}>↓</button>
              <button type="button" class="danger" data-action="remove">Entfernen</button>
            </div>
          </div>
          <div id="q-body-${i}" ${open ? '' : 'hidden'}>
            <textarea rows="2" data-field="text" placeholder="Fragetext">${escapeHtml(q.text)}</textarea>
            <label>Antworten <span class="muted">(richtige Antwort anklicken)</span></label>
            ${q.answers.map((a, j) => `
              <div class="answer-row">
                <input type="radio" name="correct-${i}" data-correct="${j}" ${q.correct === j ? 'checked' : ''}>
                <input type="text" data-answer="${j}" value="${escapeHtml(a)}" placeholder="Antwort ${j + 1}">
              </div>`).join('')}
            <label>Zeit (Sekunden)</label>
            <input type="number" min="5" max="120" data-field="timeLimit" value="${q.timeLimit}" style="max-width:120px">
          </div>
        </div>`;
      }).join('');
    }

    // Eine Frage aufklappen, alle anderen zuklappen
    function openQuestion(i, { focus = false } = {}) {
      openIndex = i;
      render();
      const card = document.querySelector(`[data-q="${i}"]`);
      if (card) {
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (focus) card.querySelector('textarea').focus({ preventScroll: true });
      }
    }

    // Eingaben direkt ins Datenmodell übernehmen
    $('#questions').addEventListener('input', (e) => {
      const card = e.target.closest('[data-q]');
      if (!card) return;
      const q = questions[card.dataset.q];
      const t = e.target;
      if (t.dataset.field === 'text') q.text = t.value;
      if (t.dataset.field === 'timeLimit') q.timeLimit = Number(t.value);
      if (t.dataset.answer !== undefined) q.answers[t.dataset.answer] = t.value;
      if (t.dataset.correct !== undefined) q.correct = Number(t.dataset.correct);
    });

    $('#questions').addEventListener('click', (e) => {
      const button = e.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      const i = Number(button.closest('[data-q]').dataset.q);
      if (action === 'toggle') return i === openIndex ? (openIndex = -1, render()) : openQuestion(i);
      if (action === 'remove') {
        questions.splice(i, 1);
        if (openIndex === i) openIndex = -1;
        else if (openIndex > i) openIndex--;
      }
      // Die aufgeklappte Frage wandert beim Verschieben mit
      if (action === 'up' || action === 'down') {
        const j = action === 'up' ? i - 1 : i + 1;
        [questions[j], questions[i]] = [questions[i], questions[j]];
        if (openIndex === i) openIndex = j;
        else if (openIndex === j) openIndex = i;
      }
      render();
    });

    $('#add').onclick = () => {
      questions.push(blankQuestion());
      openQuestion(questions.length - 1, { focus: true });
    };


    // --- Zusammenarbeit ---
    let team = null;
    function showTeam(quiz) {
      team = quiz;
      $('#team-card').hidden = false;
      $('#team-add').hidden = !quiz.isOwner;
      $('#team-info').textContent = quiz.isOwner
        ? 'Lade Freunde ein: Sie können Fragen bearbeiten und das Quiz starten, löschen können nur du. Wer angemeldet ist, sieht das Quiz unter „Quiz“.'
        : `Dieses Quiz gehört ${quiz.owner}. Du kannst Fragen bearbeiten und es starten.`;
      const chips = [`<span class="tag">👑 ${escapeHtml(quiz.owner)}${quiz.isOwner ? ' (du)' : ''}</span>`]
        .concat(quiz.collaborators.map((name) => {
          const removable = quiz.isOwner || name.toLowerCase() === me.username.toLowerCase();
          return `<span class="tag">${escapeHtml(name)}${name.toLowerCase() === me.username.toLowerCase() ? ' (du)' : ''}${removable
            ? ` <button type="button" class="chip-x" data-remove="${escapeHtml(name)}" aria-label="${quiz.isOwner ? 'Entfernen' : 'Verlassen'}" title="${quiz.isOwner ? 'Entfernen' : 'Quiz verlassen'}">✕</button>` : ''}</span>`;
        }));
      $('#team-list').innerHTML = chips.join('');
    }
    async function teamAction(fn) {
      $('#team-error').textContent = '';
      try { await fn(); } catch (err) { $('#team-error').textContent = err.message; }
    }
    $('#team-invite').onclick = () => teamAction(async () => {
      const username = $('#team-name').value.trim();
      if (!username) return;
      const { username: name } = await api(`/api/quizzes/${id}/collaborators`, { method: 'POST', body: { username } });
      if (!team.collaborators.some((n) => n.toLowerCase() === name.toLowerCase())) team.collaborators.push(name);
      $('#team-name').value = '';
      showTeam(team);
    });
    $('#team-name').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#team-invite').click(); } };
    $('#team-list').onclick = (e) => {
      const name = e.target.dataset.remove;
      if (!name) return;
      const self = name.toLowerCase() === me.username.toLowerCase();
      if (!confirm(self ? 'Dieses Quiz verlassen? Du kannst es dann nicht mehr bearbeiten.' : `${name} entfernen?`)) return;
      teamAction(async () => {
        await api(`/api/quizzes/${id}/collaborators/${encodeURIComponent(name)}`, { method: 'DELETE' });
        if (self) { location.href = '/quizzes'; return; }
        team.collaborators = team.collaborators.filter((n) => n !== name);
        showTeam(team);
      });
    };

    $('#save').onclick = async () => {
      $('#error').textContent = '';
      // Leere Antwortfelder am Ende ignorieren (Fragen mit 2–3 Antworten erlauben)
      const payload = questions.map((q) => {
        const answers = [...q.answers];
        while (answers.length > 2 && !answers[answers.length - 1].trim()) answers.pop();
        return { ...q, answers };
      });
      try {
        const body = { title: $('#title').value, subjectId: Number($('#subject').value) || null, mode: $('#mode').value, questions: payload };
        if (id) {
          try {
            await api(`/api/quizzes/${id}`, { method: 'PUT', body: { ...body, version } });
          } catch (err) {
            if (!err.data || !err.data.conflict) throw err;
            // Jemand anderes hat zwischenzeitlich gespeichert: bewusst entscheiden, nichts stillschweigend überschreiben
            if (!confirm(`${err.message}\n\nOK: Deine Version trotzdem speichern (seine Änderungen gehen verloren).\nAbbrechen: nicht speichern – lade die Seite neu, um seine Änderungen zu sehen.`)) {
              $('#error').textContent = `${err.message} Lade die Seite neu, um die Änderungen zu sehen (deine ungespeicherten Änderungen gehen dabei verloren).`;
              return;
            }
            await api(`/api/quizzes/${id}`, { method: 'PUT', body: { ...body, version, force: true } });
          }
        } else await api('/api/quizzes', { method: 'POST', body });
        location.href = '/quizzes';
      } catch (err) {
        $('#error').textContent = err.message;
        // Fehler in einer Frage ("Frage 3: …"): diese Frage aufklappen
        const match = /^Frage (\d+):/.exec(err.message);
        if (match && questions[match[1] - 1]) openQuestion(match[1] - 1);
      }
    };

    requireLogin().then(async (user) => {
      me = user;
      const subjects = await api('/api/subjects');
      $('#subject').innerHTML += subjects.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
      if (id) {
        const quiz = await api(`/api/quizzes/${id}`);
        $('#title').value = quiz.title;
        $('#subject').value = quiz.subject_id || '';
        $('#mode').value = quiz.mode || 'single';
        version = quiz.version;
        showTeam(quiz);
        questions = quiz.questions.map((q) => ({
          ...q,
          answers: [...q.answers, '', '', ''].slice(0, 4),
        }));
      } else {
        questions = [blankQuestion()];
        openIndex = 0;
        $('#team-card').hidden = false;
        $('#team-add').hidden = true;
        $('#team-info').textContent = 'Speichere das Quiz zuerst – danach kannst du Freunde zum gemeinsamen Bearbeiten einladen.';
      }
      updateModeHint();
      render();
    });
  </script>
</body>
</html>
