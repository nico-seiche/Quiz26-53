<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Bearbeiten</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/quizzes">← Meine Quiz</a>
    <span class="muted save-state" id="state" aria-live="polite"></span>
    <button class="primary" type="button" id="save">Speichern</button>
  </header>
  <main>
    <div class="card">
      <label for="title">Titel</label>
      <input type="text" id="title" placeholder="z. B. Wahlsysteme im Vergleich">
      <label for="subject">Fach</label>
      <select id="subject"><option value="">Fach wählen …</option></select>
      <label for="mode">Spielmodus</label>
      <select id="mode">
        <option value="single">Einzel – jeder spielt für sich</option>
        <option value="team">Team – zwei Teams spielen gegeneinander</option>
      </select>
      <p class="muted" id="mode-hint" style="margin:.5rem 0 0"></p>
    </div>
    <div class="card" id="team-card" hidden>
      <h2 style="margin-bottom:.25rem">👥 Zusammen bearbeiten</h2>
      <p class="muted" id="team-info" style="margin-top:0"></p>
      <div id="team-list" class="row"></div>
      <div id="team-add" style="margin-top:.75rem">
        <div class="row" style="flex-wrap:nowrap">
          <input type="text" id="team-name" placeholder="Freund suchen …" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button type="button" id="team-invite">Einladen</button>
        </div>
        <div class="suggest-list team-suggest" id="team-suggest" hidden></div>
        <p class="muted" id="team-nofriends" style="margin:.5rem 0 0" hidden>Du kannst nur Freunde einladen. <a href="/friends">Freunde hinzufügen →</a></p>
      </div>
      <p class="error" id="team-error" style="margin-bottom:0"></p>
    </div>
    <div class="card" id="presence-card" hidden><div class="row" id="presence"></div></div>
    <div id="questions"></div>
    <button type="button" id="add">+ Frage hinzufügen</button>
    <p class="error" id="error"></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const live = Boolean(id);          // bestehendes Quiz: Live-Bearbeitung mit Freunden; neues Quiz: einmal speichern
    let me = null;
    let isOwner = true;
    let questions = [];                // { key, id, rev, text, answers[4], correct, timeLimit, lockedBy }
    let openKey = null;                // Akkordeon: höchstens eine Frage ist aufgeklappt
    let draftSeq = 0;
    let presence = [];
    let dirty = false;
    let saveTimer = null;
    let saving = null;                 // laufende Speicherung (Promise)
    let metaTimer = null;
    let notice = '';

    const blank = () => ({ key: `new-${++draftSeq}`, id: null, rev: 0, text: '', answers: ['', '', '', ''], correct: 0, timeLimit: 20, lockedBy: null });
    const fromServer = (q) => ({ key: String(q.id), id: q.id, rev: q.rev, text: q.text, answers: [...q.answers, '', '', ''].slice(0, 4), correct: q.correct, timeLimit: q.timeLimit, lockedBy: null });
    const byKey = (key) => questions.find((q) => q.key === key);
    const openQ = () => byKey(openKey);

    function setState(text, kind = '') {
      $('#state').textContent = text;
      $('#state').className = `muted save-state ${kind}`;
    }

    function updateModeHint() {
      $('#mode-hint').textContent = $('#mode').value === 'team'
        ? 'Die Teilnehmer werden beim Start zufällig in zwei Teams gelost (mindestens 4 Teilnehmer). Bei ungerader Zahl bekommt das kleinere Team einen Geist-Spieler 👻 mit dem Punktedurchschnitt seiner Mitspieler.'
        : 'Jeder Teilnehmer spielt für sich allein.';
    }
    $('#mode').addEventListener('change', updateModeHint);

    // Titel einer zugeklappten Frage: der eingegebene Fragetext
    function questionTitle(q, i) {
      return q.text.trim() ? `${i + 1}. ${q.text.trim()}` : `Frage ${i + 1} (noch leer)`;
    }

    // --- Darstellung: jede Karte wird nur neu gezeichnet, wenn sich ihr Inhalt ändert (sonst verliert man beim Tippen den Fokus) ---
    function cardSignature(q, i) {
      const open = q.key === openKey && !q.lockedBy;
      return open ? `open|${i}|${questions.length}|${live}` : JSON.stringify([i, questions.length, q.text, q.lockedBy, q.key === openKey, live]);
    }

    function cardHtml(q, i) {
      const open = q.key === openKey && !q.lockedBy;
      const locked = Boolean(q.lockedBy);
      return `
        <div class="row question-head">
          <button type="button" class="q-toggle" data-action="toggle" aria-expanded="${open}" aria-controls="q-body-${q.key}">
            <span class="chevron" aria-hidden="true">${open ? '▾' : locked ? '🔒' : '▸'}</span>
            <span class="q-title">${open ? `Frage ${i + 1}` : escapeHtml(questionTitle(q, i))}</span>
          </button>
          ${locked ? `<span class="tag lock-tag">✏️ ${escapeHtml(q.lockedBy)} bearbeitet</span>` : ''}
          <div class="row">
            <button type="button" data-action="up" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button type="button" data-action="down" aria-label="Nach unten" ${i === questions.length - 1 ? 'disabled' : ''}>↓</button>
            <button type="button" class="danger" data-action="remove" ${locked ? 'disabled' : ''}>Entfernen</button>
          </div>
        </div>
        <div id="q-body-${q.key}" ${open ? '' : 'hidden'}>
          <textarea rows="2" data-field="text" placeholder="Fragetext">${escapeHtml(q.text)}</textarea>
          <label>Antworten <span class="muted">(richtige Antwort anklicken)</span></label>
          ${q.answers.map((a, j) => `
            <div class="answer-row">
              <input type="radio" name="correct-${q.key}" data-correct="${j}" ${q.correct === j ? 'checked' : ''}>
              <input type="text" data-answer="${j}" value="${escapeHtml(a)}" placeholder="Antwort ${j + 1}">
            </div>`).join('')}
          <label>Zeit (Sekunden)</label>
          <input type="number" min="5" max="120" data-field="timeLimit" value="${q.timeLimit}" style="max-width:120px">
        </div>`;
    }

    function render() {
      const box = $('#questions');
      const existing = new Map([...box.children].map((el) => [el.dataset.key, el]));
      questions.forEach((q, i) => {
        let el = existing.get(q.key);
        const sig = cardSignature(q, i);
        const open = q.key === openKey && !q.lockedBy;
        if (!el) { el = document.createElement('div'); el.dataset.key = q.key; }
        if (el.dataset.sig !== sig) {
          el.dataset.sig = sig;
          el.className = `card ${open ? '' : 'collapsed'} ${q.lockedBy ? 'locked' : ''}`;
          el.innerHTML = cardHtml(q, i);
        }
        existing.delete(q.key);
        if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
      });
      existing.forEach((el) => el.remove());
    }

    function renderPresence() {
      const others = presence.filter((p) => !p.me);
      $('#presence-card').hidden = !live || !others.length;
      $('#presence').innerHTML = others.map((p) => {
        const idx = questions.findIndex((q) => q.id === p.editing);
        return `<span class="presence-chip">${avatarHtml(p.username, '1.6rem')}<span><strong>${escapeHtml(p.username)}</strong> <span class="muted">${idx >= 0 ? `· Frage ${idx + 1}` : '· schaut zu'}</span></span></span>`;
      }).join('');
    }

    // --- Speichern einer Frage (nur Live-Modus) ---
    // Gültig = so, dass der Server sie annimmt; unfertige Fragen bleiben lokal, bis sie vollständig sind.
    function problem(q) {
      const answers = [...q.answers];
      while (answers.length > 2 && !answers[answers.length - 1].trim()) answers.pop();
      if (!q.text.trim()) return 'Fragetext fehlt';
      if (answers.some((a) => !a.trim())) return 'Antwortfeld leer';
      if (q.correct >= answers.length) return 'Richtige Antwort markieren';
      if (!(q.timeLimit >= 5 && q.timeLimit <= 120)) return 'Zeitlimit 5–120 Sekunden';
      return null;
    }
    const payload = (q) => ({ text: q.text, answers: q.answers, correct: q.correct, timeLimit: q.timeLimit });

    function scheduleSave() {
      if (!live) return;
      dirty = true;
      setState('Ungespeicherte Änderungen …');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => flush(), 700);
    }

    // Ergebnis: true = alles gespeichert (oder nichts zu speichern), false = ungespeichert (unvollständig/Fehler)
    async function flush() {
      clearTimeout(saveTimer);
      if (saving) await saving;
      const q = openQ();
      if (!live || !dirty || !q || q.lockedBy) { dirty = false; return true; }
      const bad = problem(q);
      if (bad) { setState(`Noch nicht gespeichert: ${bad}`, 'warn'); return false; }
      dirty = false;
      setState('Speichert …');
      saving = (async () => {
        try {
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              if (q.id) {
                const r = await api(`/api/quizzes/${id}/questions/${q.id}`, { method: 'PUT', body: payload(q) });
                q.rev = r.rev;
              } else {
                const r = await api(`/api/quizzes/${id}/questions`, { method: 'POST', body: payload(q) });
                q.id = r.id; q.rev = r.rev;
                q.key = String(r.id);
                openKey = q.key;
                $('#questions').querySelector('[data-key^="new-"]')?.setAttribute('data-key', q.key);
              }
              setState('✓ Gespeichert', 'ok');
              return true;
            } catch (err) {
              // Sperre kurz verloren (z. B. Tab im Hintergrund): neu anfordern und noch einmal versuchen
              if (err.data && err.data.lost && q.id && attempt === 0) { await tick(q.id); continue; }
              if (err.data && err.data.by) { await lostLock(q, err.data.by); return false; }
              dirty = true;
              setState(`Nicht gespeichert: ${err.message}`, 'warn');
              return false;
            }
          }
        } finally { saving = null; }
      })();
      return saving;
    }

    // Jemand anderes bearbeitet die Frage jetzt: eigene Fassung aufgeben, Stand vom Server zeigen
    async function lostLock(q, by) {
      notice = `${by} bearbeitet Frage ${questions.indexOf(q) + 1} gerade – deine letzten Änderungen daran wurden nicht gespeichert.`;
      dirty = false;
      openKey = null;
      await tick(null);
      showNotice();
    }

    function showNotice() { $('#error').textContent = notice; if (notice) setTimeout(() => { if ($('#error').textContent === notice) $('#error').textContent = ''; }, 8000); }

    // --- Öffnen, Schließen, Anlegen, Löschen, Verschieben ---
    async function closeOpen({ release = true } = {}) {
      const q = openQ();
      if (!q) return true;
      if (live && dirty && !(await flush())) {
        if (!confirm('Diese Frage ist noch unvollständig und wurde nicht gespeichert. Änderungen verwerfen?')) return false;
        dirty = false;
        if (!q.id) questions.splice(questions.indexOf(q), 1);
      }
      if (live && !q.id && !q.text.trim() && !q.answers.some((a) => a.trim())) questions.splice(questions.indexOf(q), 1);
      openKey = null;
      if (live && release) await tick(null);
      return true;
    }

    async function openQuestion(key, { focus = false } = {}) {
      const q = byKey(key);
      if (!q) return;
      if (q.lockedBy) { $('#error').textContent = `${q.lockedBy} bearbeitet diese Frage gerade.`; return; }
      if (openKey && !(await closeOpen({ release: false }))) return;
      if (live && q.id) {
        const state = await tick(q.id);
        if (state && state.denied) { $('#error').textContent = `${state.denied.by} bearbeitet diese Frage gerade.`; return; }
      }
      $('#error').textContent = '';
      openKey = q.key;
      render();
      const card = $('#questions').querySelector(`[data-key="${q.key}"]`);
      if (card) {
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (focus) card.querySelector('textarea').focus({ preventScroll: true });
      }
    }

    // Eingaben direkt ins Datenmodell übernehmen
    $('#questions').addEventListener('input', (e) => {
      const card = e.target.closest('[data-key]');
      const q = card && byKey(card.dataset.key);
      if (!q || q.lockedBy) return;
      const t = e.target;
      if (t.dataset.field === 'text') q.text = t.value;
      if (t.dataset.field === 'timeLimit') q.timeLimit = Number(t.value);
      if (t.dataset.answer !== undefined) q.answers[t.dataset.answer] = t.value;
      if (t.dataset.correct !== undefined) q.correct = Number(t.dataset.correct);
      scheduleSave();
    });

    $('#questions').addEventListener('click', async (e) => {
      const button = e.target.closest('[data-action]');
      if (!button) return;
      const q = byKey(button.closest('[data-key]').dataset.key);
      const i = questions.indexOf(q);
      const action = button.dataset.action;
      if (action === 'toggle') {
        if (q.key === openKey) { await closeOpen(); render(); } else await openQuestion(q.key);
        return;
      }
      if (action === 'remove') {
        if (live && q.id) {
          try { await api(`/api/quizzes/${id}/questions/${q.id}`, { method: 'DELETE' }); } catch (err) { $('#error').textContent = err.message; return; }
        }
        if (openKey === q.key) { openKey = null; dirty = false; }
        questions.splice(i, 1);
        render();
        if (live) tick(null);
        return;
      }
      // Verschieben (Reihenfolge ist für alle gleich)
      const j = action === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= questions.length) return;
      [questions[j], questions[i]] = [questions[i], questions[j]];
      render();
      if (live) {
        try { await api(`/api/quizzes/${id}/order`, { method: 'PUT', body: { ids: questions.filter((x) => x.id).map((x) => x.id) } }); }
        catch (err) { $('#error').textContent = err.message; await tick(undefined); }
      }
    });

    $('#add').onclick = async () => {
      if (openKey && !(await closeOpen({ release: false }))) return;
      const q = blank();
      questions.push(q);
      openKey = q.key;
      if (live) await tick(null);
      render();
      const card = $('#questions').querySelector(`[data-key="${q.key}"]`);
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      card.querySelector('textarea').focus({ preventScroll: true });
    };

    // --- Live: Lebenszeichen senden und Stand der anderen holen ---
    let ticking = null;
    async function tick(editing) {
      // editing: Frage-ID anfordern, null = freigeben, undefined = unverändert
      if (!live) return null;
      if (ticking) await ticking;
      const q = openQ();
      const want = editing !== undefined ? editing : (q && q.id ? q.id : null);
      ticking = (async () => {
        try {
          const state = await api(`/api/quizzes/${id}/live`, { method: 'POST', body: { editing: want } });
          applyLive(state);
          return state;
        } catch (err) {
          setState('Keine Verbindung – Änderungen werden nachgeholt …', 'warn');
          return null;
        } finally { ticking = null; }
      })();
      return ticking;
    }

    function applyLive(state) {
      presence = state.presence;
      // Eigene Meta-Eingaben nur ersetzen, wenn ich nichts gerade tippe (und nur Besitzer tippen überhaupt)
      const metaFocus = ['title', 'subject', 'mode'].includes(document.activeElement && document.activeElement.id);
      if (!isOwner || !metaFocus) {
        if (state.meta.title !== $('#title').value && !metaTimer) $('#title').value = state.meta.title;
        $('#subject').value = state.meta.subjectId || '';
        $('#mode').value = state.meta.mode || 'single';
        updateModeHint();
      }
      const serverIds = new Set(state.questions.map((q) => q.id));
      const mineOpen = openQ();
      const mineHeld = mineOpen && mineOpen.id && state.presence.some((p) => p.me && p.editing === mineOpen.id);
      // Habe ich die Sperre meiner offenen Frage verloren? (z. B. lange Pause)
      if (mineOpen && mineOpen.id && !mineHeld && !state.denied && serverIds.has(mineOpen.id) && !saving) {
        // Wird beim nächsten Tick neu angefordert, da want = offene Frage; hier nichts tun
      }
      if (state.denied && mineOpen && mineOpen.id === state.denied.question) {
        notice = `${state.denied.by} bearbeitet diese Frage gerade.`;
        openKey = null; dirty = false;
        showNotice();
      }
      const local = new Map(questions.map((q) => [q.id, q]));
      const next = state.questions.map((sq) => {
        const l = local.get(sq.id);
        const holding = l && l.key === openKey && !state.denied;
        if (holding && (dirty || (saving !== null))) return l;          // meine laufende Bearbeitung nicht überschreiben
        if (l && l.rev === sq.rev && !(l.key === openKey)) return l;    // unverändert
        const fresh = fromServer(sq);
        if (l && l.key === openKey && holding) { fresh.key = l.key; return Object.assign(l, fresh, { key: l.key }); }
        return fresh;
      });
      // Entwürfe (noch nicht gespeicherte neue Fragen) bleiben am Ende
      const drafts = questions.filter((q) => !q.id);
      questions = next.concat(drafts);
      // Wer bearbeitet was?
      const lockers = new Map(state.presence.filter((p) => !p.me && p.editing).map((p) => [p.editing, p.username]));
      for (const q of questions) q.lockedBy = q.id ? (lockers.get(q.id) || null) : null;
      if (openKey && !byKey(openKey)) openKey = null;
      render();
      renderPresence();
      if (!dirty && !saving && $('#state').className.includes('warn') && $('#state').textContent.startsWith('Keine Verbindung')) setState('');
    }

    // Echtzeit-Signal (Supabase) beschleunigt das Aktualisieren; Polling alle 2,5 s bleibt als Sicherheitsnetz
    function startLive() {
      setInterval(() => tick(undefined), 2500);
      api('/api/config').then((cfg) => {
        if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) return;
        window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey)
          .channel(`game:q${id}`).on('broadcast', { event: 'update' }, () => tick(undefined)).subscribe();
      }).catch(() => {});
      window.addEventListener('pagehide', () => {
        navigator.sendBeacon(`/api/quizzes/${id}/live`, new Blob([JSON.stringify({ leave: true })], { type: 'application/json' }));
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(undefined); });
    }

    // --- Titel, Fach, Modus: nur der Besitzer ---
    function metaChanged() {
      if (!live || !isOwner) return;
      clearTimeout(metaTimer);
      setState('Ungespeicherte Änderungen …');
      metaTimer = setTimeout(async () => {
        metaTimer = null;
        try {
          await api(`/api/quizzes/${id}/meta`, { method: 'PATCH', body: { title: $('#title').value, subjectId: Number($('#subject').value) || null, mode: $('#mode').value } });
          setState('✓ Gespeichert', 'ok');
        } catch (err) { setState(`Nicht gespeichert: ${err.message}`, 'warn'); }
      }, 700);
    }
    $('#title').addEventListener('input', metaChanged);
    $('#subject').addEventListener('change', metaChanged);
    $('#mode').addEventListener('change', metaChanged);

    // --- Zusammenarbeit ---
    let team = null;
    function showTeam(quiz) {
      team = quiz;
      $('#team-card').hidden = false;
      $('#team-add').hidden = !quiz.isOwner;
      $('#team-info').textContent = quiz.isOwner
        ? 'Lade Freunde ein: Sie können Fragen bearbeiten und das Quiz starten, löschen können nur du.'
        : `Dieses Quiz gehört ${quiz.owner}. Du kannst Fragen bearbeiten und es starten.`;
      const chips = [`<span class="tag">👑 ${escapeHtml(quiz.owner)}${quiz.isOwner ? ' (du)' : ''}</span>`]
        .concat(quiz.collaborators.map((name) => {
          const removable = quiz.isOwner || name.toLowerCase() === me.username.toLowerCase();
          return `<span class="tag">${escapeHtml(name)}${name.toLowerCase() === me.username.toLowerCase() ? ' (du)' : ''}${removable
            ? ` <button type="button" class="chip-x" data-remove="${escapeHtml(name)}" aria-label="${quiz.isOwner ? 'Entfernen' : 'Verlassen'}" title="${quiz.isOwner ? 'Entfernen' : 'Quiz verlassen'}">✕</button>` : ''}</span>`;
        }));
      $('#team-list').innerHTML = chips.join('');
    }
    async function teamAction(fn) {
      $('#team-error').textContent = '';
      try { await fn(); } catch (err) { $('#team-error').textContent = err.message; }
    }
    $('#team-invite').onclick = () => teamAction(async () => {
      const username = $('#team-name').value.trim();
      if (!username) return;
      const { username: name } = await api(`/api/quizzes/${id}/collaborators`, { method: 'POST', body: { username } });
      if (!team.collaborators.some((n) => n.toLowerCase() === name.toLowerCase())) team.collaborators.push(name);
      $('#team-name').value = '';
      $('#team-suggest').hidden = true;
      showTeam(team);
    });
    // Vorschläge aus der Freundesliste (Name oder #ID), schon eingeladene ausgeblendet
    let friends = null;
    async function loadFriends() {
      if (friends) return friends;
      try { friends = (await api('/api/friends')).friends; } catch { friends = []; }
      $('#team-nofriends').hidden = friends.length > 0;
      return friends;
    }
    async function suggest() {
      const list = await loadFriends();
      const q = $('#team-name').value.trim().toLowerCase().replace(/^#/, '');
      const taken = new Set((team ? team.collaborators : []).map((n) => n.toLowerCase()));
      const hits = list.filter((f) => !taken.has(f.username.toLowerCase())
        && (!q || f.username.toLowerCase().includes(q) || f.code.slice(1).startsWith(q))).slice(0, 6);
      $('#team-suggest').innerHTML = hits.map((f) => `
        <div class="friend-row">${avatarHtml(f.username, '2rem')}
          <div class="friend-name"><strong>${escapeHtml(f.username)}</strong> <span class="muted">${escapeHtml(f.code)}</span></div>
          <button type="button" class="primary" data-pick="${escapeHtml(f.username)}">Einladen</button></div>`).join('');
      $('#team-suggest').hidden = !hits.length;
    }
    $('#team-name').addEventListener('input', suggest);
    $('#team-name').addEventListener('focus', suggest);
    $('#team-suggest').addEventListener('click', (e) => {
      if (!e.target.dataset.pick) return;
      $('#team-name').value = e.target.dataset.pick;
      $('#team-invite').click();
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('#team-add')) $('#team-suggest').hidden = true; });
    $('#team-name').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#team-invite').click(); } };
    $('#team-list').onclick = (e) => {
      const name = e.target.dataset.remove;
      if (!name) return;
      const self = name.toLowerCase() === me.username.toLowerCase();
      if (!confirm(self ? 'Dieses Quiz verlassen? Du kannst es dann nicht mehr bearbeiten.' : `${name} entfernen?`)) return;
      teamAction(async () => {
        await api(`/api/quizzes/${id}/collaborators/${encodeURIComponent(name)}`, { method: 'DELETE' });
        if (self) { location.href = '/quizzes'; return; }
        team.collaborators = team.collaborators.filter((n) => n !== name);
        showTeam(team);
      });
    };

    // Speichern: bei neuen Quiz einmal anlegen, bei bestehenden nur noch zum Abschluss sicherstellen und zurück zur Liste
    $('#save').onclick = async () => {
      $('#error').textContent = '';
      if (live) {
        if (metaTimer) { clearTimeout(metaTimer); metaTimer = null; metaChanged(); await new Promise((r) => setTimeout(r, 900)); }
        if (!(await closeOpen())) return;
        location.href = '/quizzes';
        return;
      }
      // Neues Quiz: leere Antwortfelder am Ende ignorieren (Fragen mit 2–3 Antworten erlauben)
      const list = questions.map((q) => {
        const answers = [...q.answers];
        while (answers.length > 2 && !answers[answers.length - 1].trim()) answers.pop();
        return { text: q.text, answers, correct: q.correct, timeLimit: q.timeLimit };
      });
      try {
        await api('/api/quizzes', { method: 'POST', body: { title: $('#title').value, subjectId: Number($('#subject').value) || null, mode: $('#mode').value, questions: list } });
        location.href = '/quizzes';
      } catch (err) {
        $('#error').textContent = err.message;
        // Fehler in einer Frage ("Frage 3: …"): diese Frage aufklappen
        const match = /^Frage (\d+):/.exec(err.message);
        if (match && questions[match[1] - 1]) { openKey = questions[match[1] - 1].key; render(); }
      }
    };

    requireLogin().then(async (user) => {
      me = user;
      const subjects = await api('/api/subjects');
      $('#subject').innerHTML += subjects.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
      if (live) {
        const quiz = await api(`/api/quizzes/${id}`);
        isOwner = quiz.isOwner;
        $('#title').value = quiz.title;
        $('#subject').value = quiz.subject_id || '';
        $('#mode').value = quiz.mode || 'single';
        for (const el of [$('#title'), $('#subject'), $('#mode')]) el.disabled = !isOwner;
        if (!isOwner) $('#mode-hint').insertAdjacentHTML('afterend', '<p class="muted" style="margin:.25rem 0 0">Titel, Fach und Modus ändert nur der Besitzer.</p>');
        questions = quiz.questions.map(fromServer);
        $('#save').textContent = 'Fertig';
        showTeam(quiz);
        startLive();
        tick(undefined);
      } else {
        const q = blank();
        questions = [q];
        openKey = q.key;
        $('#team-card').hidden = false;
        $('#team-add').hidden = true;
        $('#team-info').textContent = 'Speichere das Quiz zuerst – danach kannst du Freunde zum gemeinsamen Bearbeiten einladen.';
      }
      updateModeHint();
      render();
    });
  </script>
</body>
</html>
