<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Gerät anmelden</title>
  <link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
  <header class="top">
    <a class="brand" href="/dashboard">← Zurück</a>
    <strong>Gerät anmelden</strong>
    <span id="me"></span>
  </header>
  <main>
    <div class="card narrow" style="margin-top:1.5rem">
      <h1 style="margin-top:0">📱 Neues Gerät anmelden?</h1>
      <div id="body"><p class="muted">Einen Moment …</p></div>
    </div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const code = new URLSearchParams(location.search).get('code') || '';
    const ago = (d) => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? 'gerade eben' : `vor ${m} Min.`; };

    requireLogin().then(async (me) => {
      mountNav('profile', me);
      const box = $('#body');
      try {
        const info = await api(`/api/auth/qr/${encodeURIComponent(code)}`);
        if (info.approved) { box.innerHTML = '<p>✓ Dieses Gerät wurde schon bestätigt.</p>'; return; }
        box.innerHTML = `
          <p>Ein Gerät möchte sich als <strong>${escapeHtml(me.username)}</strong> anmelden:</p>
          <div class="card" style="margin:.5rem 0 1rem;text-align:center"><strong style="font-size:1.2rem">${escapeHtml(info.device)}</strong><br><span class="muted">QR-Code angezeigt ${ago(info.createdAt)}</span></div>
          <p class="muted" style="font-size:.9rem">⚠️ Bestätige nur, wenn du diesen QR-Code gerade selbst auf <strong>deinem eigenen Gerät</strong> aufgerufen hast. Wer den Code sieht, bekommt vollen Zugriff auf dein Konto.</p>
          <p class="error" id="err"></p>
          <div class="row-inline" style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="primary" id="yes" type="button">Ja, anmelden</button><button id="no" type="button">Abbrechen</button></div>`;
        $('#no').onclick = () => { location.href = '/dashboard'; };
        $('#yes').onclick = async () => {
          $('#yes').disabled = true;
          try {
            const r = await api(`/api/auth/qr/${encodeURIComponent(code)}/approve`, { method: 'POST' });
            box.innerHTML = `<p>✓ Fertig – <strong>${escapeHtml(r.device)}</strong> ist jetzt angemeldet.</p><a class="btn primary" href="/dashboard">Zur Startseite</a>`;
          } catch (err) { $('#err').textContent = err.message; $('#yes').disabled = false; }
        };
      } catch (err) {
        box.innerHTML = `<p class="error">${escapeHtml(err.message)}</p><a class="btn" href="/dashboard">Zur Startseite</a>`;
      }
    });
  </script>
</body>
</html>
