<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4de8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Lernen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/study">← Lernsets</a>
    <strong id="set-title">…</strong>
    <span></span>
  </header>
  <main>
    <div class="tabs" id="modes" role="tablist" aria-label="Lernart">
      <button type="button" role="tab" data-mode="cards">🃏 Karteikarten</button>
      <button type="button" role="tab" data-mode="cloze">✏️ Lückentext</button>
      <button type="button" role="tab" data-mode="free">🧠 Aus dem Kopf</button>
      <button type="button" role="tab" data-mode="type">⌨️ Tippen</button>
      <button type="button" role="tab" data-mode="hear" id="hear-tab" hidden>🎧 Hören</button>
    </div>
    <div class="row spread" style="margin-bottom:1rem">
      <div class="tabs" id="scope" style="margin:0">
        <button type="button" data-scope="due">Fällige</button>
        <button type="button" data-scope="all">Alle Karten</button>
      </div>
      <div class="tabs" id="levels" style="margin:0" hidden>
        <button type="button" data-level="0.3">Leicht</button>
        <button type="button" data-level="0.6">Mittel</button>
        <button type="button" data-level="1">Alle Begriffe</button>
      </div>
    </div>
    <p class="error" id="error"></p>
    <div id="stage"></div>
  </main>
  <script src="/js/cloze.js"></script>
  <script src="/js/piper.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const setId = new URLSearchParams(location.search).get('id');
    const PASS = 0.8;  // ab diesem Anteil richtiger Wörter gilt eine Karte als gewusst
    let set = null;
    let mode = localStorage.getItem('learn-mode') || 'cards';
    let scope = 'due';
    let level = Number(localStorage.getItem('learn-level')) || 0.3;
    let queue = [];
    let total = 0;
    let known = 0;
    let retried = new Set();
    let blanks = null;     // Lücken der aktuellen Karte
    let checked = false;
    let hearIdx = 0;
    let hearPlaying = false;

    const stage = $('#stage');
    const card = () => queue[0];

    function markTabs() {
      document.querySelectorAll('#modes button').forEach((b) => { const on = b.dataset.mode === mode; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
      document.querySelectorAll('#scope button').forEach((b) => b.classList.toggle('active', b.dataset.scope === scope));
      document.querySelectorAll('#levels button').forEach((b) => b.classList.toggle('active', Number(b.dataset.level) === level));
      $('#levels').hidden = mode !== 'cloze';
    }

    function startSession() {
      Speech.cancel();
      hearPlaying = false;
      hearIdx = 0;
      let cards = set.cards.slice();
      if (scope === 'due') cards = cards.filter((c) => c.due);
      // Unsichere Karten zuerst, innerhalb einer Box zufällig
      cards = cards.map((c) => [c, c.box + Math.random() * 0.9]).sort((a, b) => a[1] - b[1]).map(([c]) => c);
      queue = cards;
      total = cards.length;
      known = 0;
      retried = new Set();
      markTabs();
      next();
    }

    function progressHtml() {
      const done = total - queue.length;
      return `<div class="study-progress"><div class="level-bar"><span style="width:${total ? (done / total) * 100 : 0}%"></span></div>
        <span class="muted">${Math.min(done + 1, total)} / ${total}</span></div>`;
    }

    function next() {
      checked = false;
      if (!queue.length) return finish();
      if (mode === 'hear') return showHear();
      if (mode === 'type') return showType();
      if (mode === 'cards') showCard(false);
      else if (mode === 'cloze') showCloze();
      else showFree();
    }

    function finish() {
      const dueLeft = set.cards.filter((c) => c.due).length;
      stage.innerHTML = total === 0 ? `
        <div class="card" style="text-align:center">
          <div class="score-big">🎉 Alles erledigt!</div>
          <p class="muted">Gerade ist keine Karte fällig. Komm später wieder – oder übe alle Karten.</p>
          <button type="button" class="primary" id="all">Alle Karten üben</button>
        </div>` : `
        <div class="card" style="text-align:center">
          <div class="score-big">🎉 Geschafft!</div>
          <p>${known} von ${total} ${total === 1 ? 'Karte' : 'Karten'} gewusst.</p>
          <div class="row" style="justify-content:center">
            <button type="button" class="primary" id="again">Nochmal</button>
            <a class="btn" href="/study">Zu den Lernsets</a>
          </div>
        </div>`;
      const all = $('#all'); if (all) all.onclick = () => { scope = 'all'; startSession(); };
      const again = $('#again'); if (again) again.onclick = () => { scope = dueLeft ? 'due' : 'all'; startSession(); };
    }

    // Ergebnis speichern und weiter. Nicht Gewusstes kommt einmal ans Ende der Runde zurück.
    async function answer(isKnown) {
      const c = queue.shift();
      if (isKnown) known++;
      else if (!retried.has(c.id)) { retried.add(c.id); queue.push(c); total++; }
      c.due = false;
      api(`/api/study/cards/${c.id}/review`, { method: 'POST', body: { known: isKnown } }).catch((e) => { $('#error').textContent = e.message; });
      next();
    }

    // --- Karteikarten ---
    function showCard(flipped) {
      const c = card();
      stage.innerHTML = progressHtml() + `
        <div class="card study-card" id="flip" tabindex="0" role="button" aria-label="Karte umdrehen">
          <div>
            <div class="term">${escapeHtml(c.term)}</div>
            ${flipped ? `<div class="definition">${escapeHtml(c.definition)}</div>` : '<div class="hint">Sag die Definition laut oder im Kopf – dann umdrehen (Leertaste)</div>'}
          </div>
        </div>
        ${flipped ? `<div class="study-actions">
          <button type="button" class="no" id="no">❌ Noch nicht</button>
          <button type="button" class="ok" id="yes">✅ Gewusst</button></div>
          ${Speech.available() ? '<div style="text-align:center;margin-top:.75rem"><button type="button" id="say">🔊 Vorlesen</button></div>' : ''}` :
          '<div class="study-actions" style="grid-template-columns:1fr"><button type="button" class="primary" id="show">Antwort zeigen</button></div>'}`;
      if (flipped) { if ($('#say')) $('#say').onclick = () => { Speech.unlock(); Speech.cancel(); Speech.say(c.definition); }; $('#yes').onclick = () => answer(true); $('#no').onclick = () => answer(false); $('#yes').focus(); }
      else { $('#show').onclick = $('#flip').onclick = () => showCard(true); $('#show').focus(); }
    }

    // --- Lückentext ---
    function showCloze() {
      const c = card();
      const tokens = Cloze.tokenize(c.definition);
      blanks = Cloze.pickBlanks(tokens, level);
      stage.innerHTML = progressHtml() + `
        <div class="card">
          <div class="muted">Ergänze die Lücken</div>
          <h2 style="margin:.2rem 0 1rem">${escapeHtml(c.term)}</h2>
          <div class="cloze-text" id="cloze">${tokens.map((t, i) => blanks.has(i)
            ? `<input class="cloze-input" type="text" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke" style="--w:${Math.max(4, t.text.length + 1)}ch">`
            : escapeHtml(t.text)).join('')}</div>
          <div class="row" style="margin-top:1rem"><button type="button" class="primary" id="check">Prüfen</button>
            <button type="button" id="skip">Weiß ich nicht</button></div>
          <div id="result"></div>
        </div>`;
      const inputs = [...document.querySelectorAll('.cloze-input')];
      inputs[0].focus();
      inputs.forEach((inp, k) => inp.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (checked) answer(Number($('#result').dataset.pass) === 1);
        else if (k < inputs.length - 1) inputs[k + 1].focus();
        else checkCloze(tokens, inputs);
      }));
      $('#check').onclick = () => checkCloze(tokens, inputs);
      $('#skip').onclick = () => checkCloze(tokens, inputs, true);
    }

    function checkCloze(tokens, inputs, giveUp = false) {
      if (checked) return;
      checked = true;
      let right = 0;
      inputs.forEach((inp) => {
        const expected = tokens[Number(inp.dataset.i)].text;
        const good = !giveUp && Cloze.matches(inp.value, expected);
        if (good) right++;
        inp.classList.add(good ? 'ok' : 'bad');
        inp.readOnly = true;
        if (!good) inp.insertAdjacentHTML('afterend', `<span class="cloze-answer"> ${escapeHtml(expected)} </span>`);
      });
      const share = right / inputs.length;
      resultBox(share, `${right} von ${inputs.length} Lücken richtig`);
    }

    // --- Aus dem Kopf ---
    function showFree() {
      const c = card();
      stage.innerHTML = progressHtml() + `
        <div class="card">
          <div class="muted">Schreibe die Definition aus dem Gedächtnis auf – sinngemäß reicht nicht, es zählen die Wörter.</div>
          <h2 style="margin:.2rem 0 .8rem">${escapeHtml(c.term)}</h2>
          <textarea class="freetext" id="free" placeholder="Definition …" autocomplete="off" spellcheck="false"></textarea>
          <div class="row" style="margin-top:1rem"><button type="button" class="primary" id="check">Prüfen</button>
            <button type="button" id="skip">Weiß ich nicht</button></div>
          <div id="result"></div>
        </div>`;
      $('#free').focus();
      const run = (giveUp) => {
        if (checked) return;
        checked = true;
        const r = Cloze.compare(c.definition, giveUp ? '' : $('#free').value);
        $('#free').readOnly = true;
        const text = r.tokens.map((t) => !t.word ? escapeHtml(t.text)
          : `<span class="${t.ok ? 'w-ok' : 'w-missing'}">${escapeHtml(t.text)}</span>`).join('');
        resultBox(r.total ? r.correct / r.total : 0, `${r.correct} von ${r.total} Wörtern richtig`,
          `<p class="cloze-text" style="line-height:1.9">${text}</p>
           ${r.extra.length ? `<p class="muted">Nicht in der Definition: ${escapeHtml(r.extra.join(', '))}</p>` : ''}`);
      };
      $('#check').onclick = () => run(false);
      $('#skip').onclick = () => run(true);
    }

    // Auswertung unter der Aufgabe: ab PASS gewusst, sonst nochmal
    function resultBox(share, summary, extra = '') {
      const pass = share >= PASS;
      $('#check').hidden = true; $('#skip').hidden = true;
      $('#result').dataset.pass = pass ? 1 : 0;
      $('#result').innerHTML = `
        <div style="margin-top:1rem">
          <div class="score-big">${pass ? '✅' : '🔁'} ${Math.round(share * 100)} %</div>
          <div class="muted">${summary}${pass ? '' : ' – das kommt gleich nochmal'}</div>
          ${extra}
          ${Speech.available() ? '<button type="button" id="say" style="margin-top:.8rem">🔊 Vorlesen</button>' : ''}
          <button type="button" class="primary" id="go" style="margin-top:.8rem">Weiter</button>
        </div>`;
      if ($('#say')) $('#say').onclick = () => { Speech.unlock(); Speech.cancel(); Speech.say(card().definition); };
      $('#go').onclick = () => answer(pass);
      $('#go').focus();
    }



    // --- Tippen: Definition Wort für Wort abtippen, Hilfe mit "Nächstes Wort", Fehler per Klick korrigieren ---
    let typeWords = [];      // erwartete Wörter
    let typeEntries = [];    // bisher eingegebene Wörter: { text, hint, fixed }

    function showType() {
      const c = card();
      typeWords = Cloze.typingWords(c.definition);
      typeEntries = [];
      stage.innerHTML = progressHtml() + `
        <div class="card">
          <div class="muted">Tippe die Definition ab – Leertaste beendet ein Wort, Enter ohne Text deckt das nächste auf.</div>
          <h2 style="margin:.2rem 0 1rem">${escapeHtml(c.term)}</h2>
          <div class="type-area" id="type-area"><span id="type-words"></span><input class="type-input" id="type-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Nächstes Wort" placeholder="Hier tippen …"></div>
          <div class="muted" id="type-count" style="margin-top:.6rem"></div>
          <p class="error" id="type-msg" style="min-height:1.2em;margin:.3rem 0 0"></p>
          <div class="row" style="margin-top:.5rem">
            <button type="button" class="primary" id="type-hint">💡 Nächstes Wort</button>
            <button type="button" id="type-giveup">Weiß ich nicht</button>
          </div>
          <div id="result"></div>
          <button type="button" id="check" hidden></button><button type="button" id="skip" hidden></button>
        </div>`;
      const input = $('#type-input');
      input.addEventListener('input', () => {
        if (!/\s/.test(input.value)) return;
        const parts = input.value.split(/\s+/);
        const rest = /\s$/.test(input.value) ? '' : parts.pop();
        input.value = rest;
        for (const w of parts) if (Cloze.cleanWord(w)) typeEntries.push({ text: w, hint: false, fixed: false });
        renderType();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (input.value.trim()) { typeEntries.push({ text: input.value.trim(), hint: false, fixed: false }); input.value = ''; renderType(); }
          else typeHint();
        } else if (e.key === 'Backspace' && !input.value && typeEntries.length && !checked) {
          // Letztes Wort wieder zum Bearbeiten zurückholen
          e.preventDefault();
          const last = typeEntries.pop();
          if (!last.hint) input.value = last.text;
          renderType();
        }
      });
      $('#type-words').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fix]');
        if (!btn) return;
        const i = Number(btn.dataset.fix);
        typeEntries[i] = { text: typeWords[i], hint: false, fixed: true };
        $('#type-msg').textContent = '';
        renderType();
        input.focus();
      });
      $('#type-hint').onclick = () => { typeHint(); input.focus(); };
      $('#type-giveup').onclick = () => {
        while (typeEntries.length < typeWords.length) typeEntries.push({ text: typeWords[typeEntries.length], hint: true, fixed: false });
        typeEntries = typeEntries.map((en, i) => (Cloze.sameWord(en.text, typeWords[i]) ? en : { text: typeWords[i], hint: true, fixed: false }));
        renderType();
      };
      renderType();
    }

    function typeHint() {
      if (checked) return;
      const input = $('#type-input');
      const status = Cloze.typingStatus(typeEntries, typeWords);
      if (status.includes('bad')) { $('#type-msg').textContent = 'Klicke zuerst auf das rote Wort, um es zu korrigieren.'; return; }
      if (typeEntries.length >= typeWords.length) return;
      input.value = '';
      typeEntries.push({ text: typeWords[typeEntries.length], hint: true, fixed: false });
      $('#type-msg').textContent = '';
      renderType();
    }

    function renderType() {
      const status = Cloze.typingStatus(typeEntries, typeWords);
      $('#type-words').innerHTML = typeEntries.map((en, i) => {
        const cls = status[i] === 'ok' ? (en.hint ? 'hint' : en.fixed ? 'fixed' : 'ok') : status[i];
        return status[i] === 'bad'
          ? `<button type="button" class="tw bad" data-fix="${i}" title="Antippen zum Korrigieren">${escapeHtml(en.text)}</button> `
          : `<span class="tw ${cls}">${escapeHtml(en.text)}</span> `;
      }).join('');
      const done = typeEntries.length === typeWords.length && !status.includes('bad') && !status.includes('pending');
      $('#type-count').textContent = `${Math.min(typeEntries.length, typeWords.length)} von ${typeWords.length} Wörtern`;
      if (done && !checked) finishType();
    }

    function finishType() {
      checked = true;
      $('#type-input').readOnly = true;
      $('#type-hint').hidden = true; $('#type-giveup').hidden = true; $('#type-area').querySelector('input').hidden = true;
      const hints = typeEntries.filter((e) => e.hint).length;
      const fixed = typeEntries.filter((e) => e.fixed).length;
      const share = (typeWords.length - hints - fixed) / typeWords.length;
      resultBox(share, `${hints} ${hints === 1 ? 'Wort' : 'Wörter'} aufgedeckt, ${fixed} korrigiert`);
    }

    // --- Hören: Karten nacheinander vorlesen (Begriff, Pause, Definition, Pause) ---
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function showHear() {
      const list = queue;
      if (!list.length) { stage.innerHTML = '<div class="card muted" style="text-align:center">Gerade ist keine Karte fällig – wähle oben „Alle Karten“, um sie trotzdem anzuhören.</div>'; return; }
      const voices = Speech.voices();
      stage.innerHTML = `
        <div class="study-progress"><div class="level-bar"><span id="hear-bar" style="width:0%"></span></div><span class="muted" id="hear-count"></span></div>
        <div class="card study-card" style="cursor:default">
          <div>
            <div class="term" id="hear-term"></div>
            <div class="definition" id="hear-def"></div>
          </div>
        </div>
        <div class="hear-controls">
          <button type="button" id="hear-prev" aria-label="Vorherige Karte">⏮</button>
          <button type="button" class="primary" id="hear-play" aria-label="Abspielen oder anhalten">▶ Abspielen</button>
          <button type="button" id="hear-next" aria-label="Nächste Karte">⏭</button>
        </div>
        <div class="card hear-options">
          <label for="hear-rate">Tempo</label>
          <select id="hear-rate">${[0.8, 0.9, 1, 1.1, 1.25].map((r) => `<option value="${r}">${r === 1 ? 'Normal' : r + '×'}</option>`).join('')}</select>
          <label for="hear-voice">Stimme</label>
          <select id="hear-voice">
            ${Speech.piperSupported() ? `<optgroup label="Einmal ca. 60 MB laden">${Speech.PIPER_VOICES.map((v) => `<option value="${v.id}">${escapeHtml(v.label)}</option>`).join('')}</optgroup>` : ''}
            ${!Speech.piperSupported() && voices.length ? `<optgroup label="Stimmen deines Geräts">${voices.map((v) => `<option value="device:${escapeHtml(v.voiceURI)}">${escapeHtml(v.name)}</option>`).join('')}</optgroup>` : (!Speech.piperSupported() && Speech.supported ? '<option value="device:">Standardstimme</option>' : '')}
          </select>
          <p class="muted" id="hear-status" style="margin:.4rem 0 0"></p>
          <label class="inline-check"><input type="checkbox" id="hear-hide"> Text verbergen (nur zuhören und mitdenken)</label>
          <label class="inline-check"><input type="checkbox" id="hear-loop"> Wiederholen, bis ich anhalte</label>
          <p class="muted" style="margin-bottom:0">Natürliche Stimmen laufen im Browser (kein Server). Bei gesperrtem Display stoppt das Vorlesen auf vielen Handys.</p>
        </div>`;
      $('#hear-rate').value = Speech.store.get('speech-rate', '1');
      const engine = Speech.engine();
      $('#hear-voice').value = engine !== 'device' && Speech.piperSupported() ? engine : `device:${(Speech.pickVoice() || voices[0] || {}).voiceURI || ''}`;
      if (!$('#hear-voice').value) $('#hear-voice').selectedIndex = 0;
      $('#hear-hide').checked = Speech.store.get('hear-hide', '0') === '1';
      $('#hear-loop').checked = Speech.store.get('hear-loop', '0') === '1';
      hearShow();
      $('#hear-play').onclick = () => { Speech.unlock(); (hearPlaying ? hearStop() : hearStart()); };
      $('#hear-next').onclick = () => { Speech.unlock(); hearJump(1); };
      $('#hear-prev').onclick = () => { Speech.unlock(); hearJump(-1); };
      $('#hear-rate').onchange = (e) => { Speech.store.set('speech-rate', e.target.value); hearRestart(); };
      $('#hear-voice').onchange = (e) => chooseVoice(e.target.value);
      $('#hear-hide').onchange = (e) => { Speech.store.set('hear-hide', e.target.checked ? '1' : '0'); hearShow(); };
      $('#hear-loop').onchange = (e) => Speech.store.set('hear-loop', e.target.checked ? '1' : '0');
    }

    let hearStep = 'term';   // was gerade gesprochen wird: Begriff oder Definition
    function hearShow() {
      if (mode !== 'hear' || !$('#hear-term')) return;
      const c = queue[hearIdx];
      const hide = $('#hear-hide').checked;
      $('#hear-term').textContent = c.term;
      $('#hear-def').textContent = c.definition;
      $('#hear-def').style.visibility = !hide || (hearPlaying && hearStep === 'definition') ? 'visible' : 'hidden';
      $('#hear-count').textContent = `${hearIdx + 1} / ${queue.length}`;
      $('#hear-bar').style.width = `${((hearIdx + 1) / queue.length) * 100}%`;
      $('#hear-play').textContent = hearPlaying ? '⏸ Pause' : '▶ Abspielen';
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: c.term, artist: set.title });
    }

    function hearStatus(text) { const el = $('#hear-status'); if (el) el.textContent = text; }

    // Stimme wählen; eine natürliche Stimme wird beim ersten Mal heruntergeladen
    async function chooseVoice(value) {
      Speech.unlock();
      Speech.cancel();
      if (value.startsWith('device:')) {
        Speech.setEngine('device');
        Speech.store.set('speech-voice', value.slice(7));
        hearStatus('');
        return hearRestart();
      }
      const wasPlaying = hearPlaying;
      hearPlaying = false;
      let loaded = false;
      try {
        if (!(await Speech.piperReady(value))) {
          if (!confirm('Die natürliche Stimme ist ca. 60 MB groß und wird einmalig auf dein Gerät geladen (am besten im WLAN). Jetzt laden?')) throw new Error('abgebrochen');
          await Speech.piperLoad(value, (done, total) => hearStatus(`Stimme wird geladen … ${Math.round(done / 1e6)} von ${Math.round(total / 1e6)} MB`));
        }
        Speech.setEngine(value);
        loaded = true;
        hearStatus('Stimme bereit. Die erste Karte braucht beim Start einen Moment, danach geht es flüssig.');
      } catch (err) {
        console.warn(err);
        hearStatus(err.message === 'abgebrochen' ? '' : 'Die Stimme konnte nicht geladen werden – bitte Internetverbindung prüfen und es noch einmal versuchen.');
        hearShow();
      }
      hearShow();
      if (wasPlaying && loaded) hearStart();
    }

    // Bildschirm anlassen, solange vorgelesen wird (sonst unterbricht das Handy die Wiedergabe)
    let wakeLock = null;
    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
      } catch {}
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && hearPlaying) keepAwake(true); });

    // Ergebnis einer Wiedergabe auswerten; false = Schleife beenden
    function hearCheck(result, me) {
      if (result === 'cancelled' || me !== Speech.current() || !hearPlaying) return false;
      if (result === 'blocked') { hearFail('Dein Browser hat die Wiedergabe blockiert – tippe noch einmal auf „Abspielen“.'); return false; }
      if (result === 'error') {
        hearFail(Speech.engine() !== 'device'
          ? 'Die Stimme konnte nicht abgespielt werden (zu wenig Speicher oder keine Verbindung?) – tippe noch einmal auf „Abspielen“.'
          : 'Die Sprachausgabe hat abgebrochen – tippe noch einmal auf „Abspielen“.');
        return false;
      }
      return true;
    }
    function hearFail(msg) { hearPlaying = false; keepAwake(false); hearShow(); hearStatus(msg); }

    async function hearStart() {
      if (Speech.piperSupported() && !(await Speech.piperReady(Speech.engine()))) {
        hearPlaying = true;
        return chooseVoice(Speech.engine());   // lädt die Stimme (nach Rückfrage) und startet danach
      }
      hearPlaying = true;
      keepAwake(true);
      Speech.cancel();
      hearStatus('');
      const me = Speech.current();
      const wait4 = (w) => hearStatus(w ? 'Wird vorbereitet …' : '');
      while (hearPlaying && me === Speech.current() && mode === 'hear') {
        const c = queue[hearIdx];
        hearStep = 'term'; hearShow();
        Speech.prefetch(c.definition);
        const nextCard = queue[(hearIdx + 1) % queue.length];
        Speech.prefetch(nextCard.term); Speech.prefetch(nextCard.definition);
        if (!hearCheck(await Speech.say(c.term, { onWait: wait4 }), me)) return;
        await wait(1200);
        if (!hearPlaying || me !== Speech.current()) return;
        hearStep = 'definition'; hearShow();
        if (!hearCheck(await Speech.say(c.definition, { onWait: wait4 }), me)) return;
        await wait(2000);
        if (!hearPlaying || me !== Speech.current()) return;
        if (hearIdx + 1 < queue.length) hearIdx++;
        else if ($('#hear-loop').checked) hearIdx = 0;
        else { hearPlaying = false; keepAwake(false); hearIdx = 0; hearStep = 'term'; hearShow(); return; }
      }
    }
    function hearStop() { hearPlaying = false; keepAwake(false); Speech.cancel(); hearShow(); }
    function hearRestart() { if (hearPlaying) hearStart(); }
    function hearJump(step) {
      hearIdx = (hearIdx + step + queue.length) % queue.length;
      hearStep = 'term';
      Speech.cancel();
      hearShow();
      if (hearPlaying) hearStart();
    }
    if ('mediaSession' in navigator) {
      for (const [action, fn] of [['play', () => mode === 'hear' && !hearPlaying && hearStart()], ['pause', () => hearStop()],
        ['nexttrack', () => mode === 'hear' && hearJump(1)], ['previoustrack', () => mode === 'hear' && hearJump(-1)]]) {
        try { navigator.mediaSession.setActionHandler(action, fn); } catch {}
      }
    }
    window.addEventListener('pagehide', () => Speech.cancel());

    // Tastatur: Leertaste dreht die Karteikarte um, 1/2 bewertet sie
    document.addEventListener('keydown', (e) => {
      if (mode !== 'cards' || !queue.length || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      if (e.key === ' ' && $('#show')) { e.preventDefault(); showCard(true); }
      else if ($('#yes') && (e.key === '1' || e.key === 'ArrowRight')) answer(true);
      else if ($('#no') && (e.key === '2' || e.key === 'ArrowLeft')) answer(false);
    });

    $('#modes').onclick = (e) => { if (e.target.dataset.mode) { mode = e.target.dataset.mode; localStorage.setItem('learn-mode', mode); startSession(); } };
    $('#scope').onclick = (e) => { if (e.target.dataset.scope) { scope = e.target.dataset.scope; startSession(); } };
    $('#levels').onclick = (e) => { if (e.target.dataset.level) { level = Number(e.target.dataset.level); localStorage.setItem('learn-level', level); startSession(); } };

    (async () => {
      await requireLogin();
      try {
        set = await api(`/api/study/${setId}`);
      } catch (err) {
        $('#error').textContent = err.message;
        return;
      }
      $('#set-title').textContent = set.title;
      Speech.onVoices(() => { $('#hear-tab').hidden = !Speech.available(); });
      if (!Speech.available() && mode === 'hear') mode = 'cards';
      if (!set.cards.length) { stage.innerHTML = '<div class="card muted">Dieses Lernset hat noch keine Karten.</div>'; return; }
      if (!set.cards.some((c) => c.due)) scope = 'all';
      startSession();
    })();
  </script>
</body>
</html>
