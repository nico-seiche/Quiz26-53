<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),m=localStorage.getItem("motion");if(t)d.dataset.theme=t;if(m==="off"||(m==="auto"&&matchMedia("(prefers-reduced-motion: reduce)").matches))d.classList.add("reduce-motion")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <title>Quiz – Spielerprofil</title>
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" id="back">← Zurück</a>
    <strong id="head-name">Profil</strong>
    <span></span>
  </header>
  <main>
    <p class="error" id="error"></p>
    <div id="page"></div>
  </main>
  <script src="/js/changelog.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get('name');
    const nf = (n) => n.toLocaleString('de-DE');
    const MODE_NAMES = { cards: '🃏 Karteikarten', cloze: '✏️ Lückentext', free: '🧠 Aus dem Kopf', type: '⌨️ Tippen' };
    let me = null;
    let p = null;

    $('#back').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = '/leaderboard'; };

    function actions() {
      const n = escapeHtml(p.username);
      switch (p.relation) {
        case 'none': return `<button type="button" class="primary" data-act="request">＋ Freundschaftsanfrage</button>`;
        case 'requested': return '<span class="tag">Anfrage gesendet</span>';
        case 'incoming': return `<button type="button" class="primary" data-act="accept">Anfrage annehmen</button> <button type="button" data-act="remove">Ablehnen</button>`;
        case 'friend': return `<span class="tag">✓ Befreundet</span> <a class="btn primary" href="/study" title="Lernset wählen und herausfordern">⚔️ Battle</a> <button type="button" class="link-btn" data-act="remove">Entfernen</button>`;
        default: return '';
      }
    }

    function render() {
      $('#head-name').textContent = p.username;
      const since = new Date(p.memberSince).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      const bar = (v, max) => `<div class="stat-bar"><span style="width:${max ? (v / max) * 100 : 0}%"></span></div>`;
      const maxSubject = Math.max(1, ...p.subjects.map((s) => s.points));
      const maxMode = Math.max(1, ...p.learn.byMode.map((m) => m.points));
      const bt = p.battles.wins + p.battles.losses + p.battles.draws;
      const vs = p.vsMe;
      $('#page').innerHTML = `
        <div class="card profile-card">
          ${avatarHtml(p.username, '4.5rem')}
          <div style="min-width:0">
            <h1 style="margin:0;overflow-wrap:anywhere">${escapeHtml(p.username)}</h1>
            <span class="level-badge" title="${nf(p.xp)} Level-Punkte (Quiz + Lernen)">🏅 Level ${p.level}</span>
            <span class="tag" title="Freunde-ID">${escapeHtml(p.code)}</span>
            ${p.achievements.title ? `<span class="tag">${escapeHtml(p.achievements.title)}</span>` : ''}
            <div class="muted level-next">Dabei seit ${escapeHtml(since)}</div>
          </div>
        </div>
        <div class="card"><div class="row" id="actions">${actions()}</div><p class="error" id="act-error" style="margin:.4rem 0 0"></p></div>

        <div class="tile-grid">
          <div class="tile tile-gold"><span class="tile-icon" aria-hidden="true">🏆</span><span class="tile-value">${nf(p.points)}</span><span class="tile-label">Punkte</span></div>
          <div class="tile tile-silver"><span class="tile-icon" aria-hidden="true">🥇</span><span class="tile-value">${p.points > 0 ? p.rank : '–'}</span><span class="tile-label">${p.points > 0 ? `Platz von ${p.userCount}` : 'noch ohne Platz'}</span></div>
          <div class="tile tile-rainbow"><span class="tile-icon" aria-hidden="true">🔥</span><span class="tile-value">${p.dayStreak}</span><span class="tile-label">${p.dayStreak === 1 ? 'Tag Serie' : 'Tage Serie'}</span></div>
        </div>

        <div class="card">
          <h2 style="margin-bottom:.4rem">Punkte nach Fach</h2>
          <p class="muted" style="margin-top:0">${nf(p.games)} ${p.games === 1 ? 'gewertetes Spiel' : 'gewertete Spiele'} (ab ${p.minPlayers} Teilnehmern)</p>
          ${p.subjects.map((s) => `<div class="stat-row wide"><span>${s.icon || ''} ${escapeHtml(s.name)}</span>${bar(s.points, maxSubject)}<span class="stat-points">${nf(s.points)}</span></div>`).join('')}
        </div>

        <div class="card">
          <h2 style="margin-bottom:.25rem">🧠 Lernpunkte</h2>
          <div class="row" style="align-items:flex-end"><div class="stat-total">${nf(p.learn.total)}</div><span class="tag">7 Tage +${nf(p.learn.week)}</span></div>
          ${p.learn.byMode.length ? p.learn.byMode.map((m) => `<div class="stat-row wide" title="${m.reviews} ${m.reviews === 1 ? 'Karte' : 'Karten'} geübt"><span>${MODE_NAMES[m.mode] || m.mode}</span>${bar(m.points, maxMode)}<span class="stat-points">${nf(m.points)}</span></div>`).join('') : '<p class="muted" style="margin:.4rem 0 0">Noch nichts geübt.</p>'}
        </div>

        <div class="card">
          <div class="row spread"><h2 style="margin-bottom:0">Erfolge</h2><span class="muted">${p.achievements.earned} / ${p.achievements.total}</span></div>
          <div class="ach-grid">${p.achievements.items.map((a) => `
            <div class="ach-tile ${a.earned ? 'earned' : 'locked'}" title="${escapeHtml(a.description)}">
              <span class="icon" aria-hidden="true">${a.icon}</span><strong>${escapeHtml(a.name)}</strong>
              <span class="muted">${a.earned ? escapeHtml(a.description) : '🔒 noch offen'}</span>
            </div>`).join('')}</div>
        </div>

        <div class="card">
          <h2 style="margin-bottom:.4rem">⚔️ Battles</h2>
          ${bt ? `<div class="row"><span class="tag">🏆 ${p.battles.wins} Siege</span><span class="tag">${p.battles.losses} Niederlagen</span><span class="tag">${p.battles.draws} Remis</span></div>` : '<p class="muted" style="margin:0">Noch kein Battle gespielt.</p>'}
          ${p.relation === 'friend' && (vs.wins + vs.losses + vs.draws) ? `<p style="margin:.7rem 0 0">Gegen dich: <strong>${p.vsMe.wins}</strong> Siege · <strong>${p.vsMe.losses}</strong> Niederlagen · ${p.vsMe.draws} Remis</p>` : ''}
        </div>

        ${p.recent.length ? `<div class="card"><h2 style="margin-bottom:.4rem">Zuletzt gespielt</h2><ul class="list">${p.recent.map((r) => `
          <li><div><strong>${r.subject_icon || '📘'} ${escapeHtml(r.quiz_title)}</strong><br><span class="muted">${new Date(r.played_at).toLocaleDateString('de-DE')}</span></div>
          <div>${nf(r.score)} Punkte · Platz ${r.rank}/${r.player_count}</div></li>`).join('')}</ul></div>` : ''}`;
    }

    async function act(kind) {
      $('#act-error').textContent = '';
      try {
        if (kind === 'request') await api('/api/friends/request', { method: 'POST', body: { user: p.username } });
        else if (kind === 'accept') await api('/api/friends/accept', { method: 'POST', body: { user: p.username } });
        else if (kind === 'remove') {
          if (p.relation === 'friend' && !confirm(`${p.username} aus deinen Freunden entfernen?`)) return;
          await api(`/api/friends/${encodeURIComponent(p.username)}`, { method: 'DELETE' });
        }
        await load();
      } catch (err) { $('#act-error').textContent = err.message; }
    }
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); });

    async function load() {
      p = await api(`/api/users/${encodeURIComponent(name)}`);
      if (p.isMe) { location.replace('/profile'); return; }
      render();
    }

    requireLogin().then(async (user) => {
      me = user;
      mountNav('leaderboard', user);
      if (!name) { location.href = '/leaderboard'; return; }
      try { await load(); } catch (err) { $('#error').textContent = err.message; }
    });
  </script>
</body>
</html>
